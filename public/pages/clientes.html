<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css?v=20260629-brasil-mobile" />
  <link rel="stylesheet" href="../css/assistente-senso.css" />
  <link rel="stylesheet" href="../css/assistente-ajuda.css" />

  <style>
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.28), transparent 38%),
        radial-gradient(circle at 82% 25%, rgba(45, 212, 191, 0.24), transparent 40%),
        linear-gradient(170deg, #e6f4ff 0%, #ecfeff 46%, #f8fafc 100%);
      min-height: 100vh;
    }

    .app {
      background: transparent;
    }

    .header {
      background: rgba(10, 124, 255, 0.78) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: rgba(10, 124, 255, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 22px rgba(10, 124, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .cliente-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.72),
        rgba(255, 255, 255, 0.4)
      );
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 14px;
    }

    .cliente-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.58) 0%,
        rgba(255, 255, 255, 0) 34%
      );
    }

    .cliente-card > * {
      position: relative;
      z-index: 1;
    }

    .cliente-resumo {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cliente-info {
      line-height: 1.4;
    }

    .btn-detalhes {
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      padding: 6px 12px;
      color: #0a4ea9;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .cliente-acoes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-whatsapp {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: #25d366;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-whatsapp:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cliente-detalhes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }

    .ultimo-servico-card {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0 8px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .ultimo-servico-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ultimo-servico-titulo {
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .ultimo-servico-contador {
      color: #0a4ea9;
      font-size: 12px;
      white-space: nowrap;
    }

    .ultimo-servico-nome {
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .ultimo-servico-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      color: #475569;
      margin-bottom: 8px;
    }

    .ultimo-servico-itens {
      margin: 0 0 10px;
      padding-left: 16px;
      color: #334155;
    }

    .ultimo-servico-vazio {
      color: #64748b;
      margin-top: 6px;
    }

    .btn-historico {
      background: rgba(10, 124, 255, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .historico-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      padding: 16px;
    }

    .historico-modal.hidden {
      display: none;
    }

    .historico-modal-conteudo {
      width: min(520px, 100%);
      max-height: 82vh;
      overflow: auto;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 14px 14px 10px 10px;
      padding: 14px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.24);
    }

    .historico-modal-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .historico-modal-topo h3 {
      margin: 0;
      font-size: 17px;
    }

    .btn-fechar-historico {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 999px;
      background: #e2e8f0;
      color: #0f172a;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .historico-item {
      border-top: 1px solid #e2e8f0;
      padding: 10px 0;
    }

    .historico-item:first-child {
      border-top: none;
    }

    .historico-item-data {
      color: #0a4ea9;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .historico-item-total {
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .historico-item ul {
      margin: 0 0 6px;
      padding-left: 16px;
    }

    .historico-observacoes {
      color: #475569;
      font-style: italic;
    }

    .hidden {
      display: none;
    }

    .btn-arquivar {
      margin-top: 6px;
      background: rgba(244, 67, 54, 0.92);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-editar {
      margin-top: 6px;
      margin-right: 6px;
      background: rgba(10, 124, 255, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .veiculo-edicao {
      display: grid;
      gap: 8px;
      margin: 10px 0 8px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.68);
    }

    .veiculo-edicao.hidden {
      display: none;
    }

    .veiculo-edicao label {
      font-size: 12px;
      color: #334155;
      font-weight: 700;
    }

    .veiculo-edicao input {
      width: 100%;
      box-sizing: border-box;
      margin: 0;
    }

    .veiculo-edicao-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible,
    .btn-whatsapp:hover,
    .btn-whatsapp:focus-visible,
    .btn-detalhes:hover,
    .btn-detalhes:focus-visible,
    .btn-historico:hover,
    .btn-historico:focus-visible,
    .btn-fechar-historico:hover,
    .btn-fechar-historico:focus-visible,
    .btn-editar:hover,
    .btn-editar:focus-visible,
    .btn-arquivar:hover,
    .btn-arquivar:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.14);
      filter: saturate(1.05);
    }

    .btn-primary:active,
    .btn-whatsapp:active,
    .btn-detalhes:active,
    .btn-historico:active,
    .btn-fechar-historico:active,
    .btn-editar:active,
    .btn-arquivar:active {
      transform: scale(0.98);
      box-shadow: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-primary,
      .btn-whatsapp,
      .btn-detalhes,
      .btn-historico,
      .btn-fechar-historico,
      .btn-editar,
      .btn-arquivar {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="header">Clientes</div>

    <div class="content">
      <a href="novo-cliente.html" class="btn-primary">+ Novo Cliente</a>
      <div id="lista"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js?v=20260607-gratis"></script>
  <script src="../js/core/plans.js?v=20260607-gratis"></script>
  <script src="../js/core/profile.js"></script>
  <script src="../js/domains/mecanica/domain.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/assistente-senso.js"></script>
  <script src="../js/assistente-ajuda.js"></script>

  <script>
    const lista = document.getElementById("lista");
    const modoMecanica = (
      window.SensoProfile &&
      typeof window.SensoProfile.getActiveProfile === "function" &&
      window.SensoProfile.getActiveProfile()?.id === "mecanica"
    );

    function formatarDocumentoBR(doc) {
      if (!doc) return "Documento nao informado";

      const v = doc.replace(/\D/g, "");

      if (v.length === 11) {
        return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
      }

      if (v.length === 14) {
        return v.replace(
          /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
          "$1.$2.$3/$4-$5"
        );
      }

      return doc;
    }

    function normalizarTelefoneWhats(telefone) {
      const digitos = String(telefone || "").replace(/\D/g, "");
      if (!digitos) return "";
      if (digitos.startsWith("55")) return digitos;
      if (digitos.length >= 10 && digitos.length <= 11) return `55${digitos}`;
      return digitos;
    }

    function normalizarPlacaHistorico(placa) {
      return String(placa || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
    }

    function normalizarPlaca(value) {
      const raw = String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!raw) return "";

      if (/^[A-Z]{3}[0-9]{4}$/.test(raw)) {
        return `${raw.slice(0, 3)}-${raw.slice(3)}`;
      }

      if (/^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(raw)) {
        return raw;
      }

      return raw;
    }

    function placaValida(value) {
      if (!value) return true;
      return /^[A-Z]{3}-[0-9]{4}$/.test(value) || /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(value);
    }

    function normalizarKm(value) {
      const digitos = String(value || "").replace(/\D/g, "");
      if (!digitos) return "";
      return String(Number(digitos));
    }

    function formatarKm(value) {
      const km = normalizarKm(value);
      return km ? Number(km).toLocaleString("pt-BR") : "";
    }

    function dataServicoTimestamp(servico) {
      const data = new Date(servico?.executadoEm || servico?.criadoEm || 0);
      const tempo = data.getTime();
      return Number.isFinite(tempo) ? tempo : 0;
    }

    function formatarDataHistorico(data) {
      const d = new Date(data || 0);
      if (!Number.isFinite(d.getTime())) return "Data não informada";
      return d.toLocaleDateString("pt-BR");
    }

    function obterItensServico(servico) {
      return Array.isArray(servico?.itens)
        ? servico.itens
            .map(item => String(item?.descricao || item?.nome || "").trim())
            .filter(Boolean)
        : [];
    }

    function chaveHistoricoCliente(cliente) {
      const clienteId = String(cliente?.id || "");
      if (modoMecanica) {
        const placa = normalizarPlacaHistorico(cliente?.placaCarro);
        return clienteId && placa ? `${clienteId}|${placa}` : "";
      }

      return clienteId || `nome:${String(cliente?.nome || "").trim().toLocaleLowerCase("pt-BR")}`;
    }

    function chaveHistoricoServico(servico) {
      const clienteId = String(servico?.cliente?.id || servico?.clienteId || "");
      if (modoMecanica) {
        const placa = normalizarPlacaHistorico(servico?.placaCarro || servico?.cliente?.placaCarro);
        return clienteId && placa ? `${clienteId}|${placa}` : "";
      }

      return clienteId || `nome:${String(servico?.cliente?.nome || "").trim().toLocaleLowerCase("pt-BR")}`;
    }

    function criarIndiceHistorico(dataRef) {
      const data = dataRef || getData();
      const indice = new Map();

      (data.servicos || []).forEach(servico => {
        if (servico?.status !== "executado") return;

        const chave = chaveHistoricoServico(servico);
        if (!chave) return;

        if (!indice.has(chave)) indice.set(chave, []);
        indice.get(chave).push(servico);
      });

      indice.forEach(historico => {
        historico.sort((a, b) => dataServicoTimestamp(b) - dataServicoTimestamp(a));
      });

      return indice;
    }

    function buscarHistoricoCliente(cliente, dataRef, indiceHistorico) {
      const chave = chaveHistoricoCliente(cliente);
      if (!chave) return [];

      const indice = indiceHistorico || criarIndiceHistorico(dataRef);
      return indice.get(chave) || [];
    }

    function obterUltimoServico(historico) {
      return Array.isArray(historico) && historico.length ? historico[0] : null;
    }

    function montarTextoContadorHistorico(total) {
      return `${total} ${total === 1 ? "serviço realizado" : "serviços realizados"}`;
    }

    function obterTituloUltimoServico() {
      return modoMecanica ? "Último serviço" : "Último atendimento";
    }

    function obterTituloHistorico() {
      return modoMecanica ? "Histórico do veículo" : "Histórico de serviços";
    }

    function obterTextoHistoricoVazio() {
      return modoMecanica
        ? "Nenhum serviço realizado ainda"
        : "Nenhum atendimento realizado ainda";
    }

    function montarSubtituloHistorico(cliente, total) {
      const contador = montarTextoContadorHistorico(total);
      if (modoMecanica) {
        return `${cliente?.placaCarro || "Placa não informada"} - ${contador}`;
      }
      return `${cliente?.nome || "Cliente"} - ${contador}`;
    }

    function renderizarCardUltimoServico(cliente, dataRef, indiceHistorico) {
      const historico = buscarHistoricoCliente(cliente, dataRef, indiceHistorico);
      const ultimoServico = obterUltimoServico(historico);
      const contador = montarTextoContadorHistorico(historico.length);
      const tituloCard = obterTituloUltimoServico();

      if (!ultimoServico) {
        return `
          <div class="ultimo-servico-card">
            <div class="ultimo-servico-topo">
              <div class="ultimo-servico-titulo">${escapeHtml(tituloCard)}</div>
              <div class="ultimo-servico-contador">${escapeHtml(contador)}</div>
            </div>
            <div class="ultimo-servico-vazio">${escapeHtml(obterTextoHistoricoVazio())}</div>
          </div>
        `;
      }

      const itens = obterItensServico(ultimoServico);
      const itensResumo = itens.slice(0, 3);
      const titulo = itensResumo[0] || (modoMecanica ? "Serviço realizado" : "Atendimento realizado");

      return `
        <div class="ultimo-servico-card">
          <div class="ultimo-servico-topo">
            <div class="ultimo-servico-titulo">${escapeHtml(tituloCard)}</div>
            <div class="ultimo-servico-contador">${escapeHtml(contador)}</div>
          </div>
          <div class="ultimo-servico-nome">${escapeHtml(titulo)}</div>
          <div class="ultimo-servico-meta">
            <span>${escapeHtml(formatarDataHistorico(ultimoServico.executadoEm || ultimoServico.criadoEm))}</span>
            <span>R$ ${escapeHtml(formatarMoedaBR(ultimoServico.totalGeral || 0))}</span>
          </div>
          ${
            itensResumo.length
              ? `<ul class="ultimo-servico-itens">${itensResumo.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
              : ""
          }
          <button class="btn-historico" data-cliente-id="${escapeHtml(cliente.id)}">Ver histórico</button>
        </div>
      `;
    }

    function renderizarHistoricoCliente(cliente, dataRef) {
      const historico = buscarHistoricoCliente(cliente, dataRef, criarIndiceHistorico(dataRef));
      const modalExistente = document.getElementById("historicoClienteModal");
      if (modalExistente) modalExistente.remove();

      const modal = document.createElement("div");
      modal.id = "historicoClienteModal";
      modal.className = "historico-modal";

      const itensHtml = historico.length
        ? historico.map(servico => {
            const itens = obterItensServico(servico);
            return `
              <div class="historico-item">
                <div class="historico-item-data">${escapeHtml(formatarDataHistorico(servico.executadoEm || servico.criadoEm))}</div>
                <div class="historico-item-total">R$ ${escapeHtml(formatarMoedaBR(servico.totalGeral || 0))}</div>
                ${itens.length ? `<ul>${itens.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
                ${servico.observacoes ? `<div class="historico-observacoes">${escapeHtml(servico.observacoes)}</div>` : ""}
              </div>
            `;
          }).join("")
        : `<p>${escapeHtml(obterTextoHistoricoVazio())}</p>`;

      modal.innerHTML = `
        <div class="historico-modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="historicoClienteTitulo">
          <div class="historico-modal-topo">
            <div>
              <h3 id="historicoClienteTitulo">${escapeHtml(obterTituloHistorico())}</h3>
              <small>${escapeHtml(montarSubtituloHistorico(cliente, historico.length))}</small>
            </div>
            <button class="btn-fechar-historico" type="button" aria-label="Fechar histórico">x</button>
          </div>
          ${itensHtml}
        </div>
      `;

      const fechar = () => modal.remove();
      modal.querySelector(".btn-fechar-historico").onclick = fechar;
      modal.onclick = event => {
        if (event.target === modal) fechar();
      };
      document.body.appendChild(modal);
    }

    function renderClientes() {
      const data = getData();
      const clientes = (data.clientes || []).filter(c => !c.arquivado);
      const indiceHistorico = criarIndiceHistorico(data);
      const settings = getAppSettings();
      const companyName = String(settings?.companyName || "").trim();
      lista.innerHTML = "";

      if (clientes.length === 0) {
        lista.innerHTML = "<p>Nenhum cliente cadastrado</p>";
        return;
      }

      clientes.forEach(c => {
        const card = document.createElement("div");
        card.className = "cliente-card";
        const telefonesCliente = listarTelefonesCliente(c);
        const telefoneWhats = normalizarTelefoneWhats(c.telefone) || normalizarTelefoneWhats(c.telefone2);
        const remetente = companyName || (modoMecanica ? "oficina" : "empresa");
        const mensagemWhats = modoMecanica
          ? `Ola ${c.nome || ""}, aqui e da ${remetente}. Podemos falar sobre seu veiculo?`
          : `Ola ${c.nome || ""}, aqui e da ${remetente}. Podemos falar sobre seu atendimento?`;
        const detalhesVeiculo = modoMecanica
          ? `
            Modelo: ${escapeHtml(c.modeloCarro || "Modelo nao informado")}<br>
            Placa: ${escapeHtml(c.placaCarro || "Placa nao informada")}<br>
            Cor: ${escapeHtml(c.corCarro || "Cor nao informada")}<br>
            KM: ${escapeHtml(formatarKm(c.kmCarro) || "KM nao informado")}<br>
          `
          : "";
        const ultimoServicoHtml = renderizarCardUltimoServico(c, data, indiceHistorico);

        card.innerHTML = `
          <div class="cliente-resumo">
            <div class="cliente-info">
              <strong>${escapeHtml(c.nome)}</strong><br>
              Telefone: ${escapeHtml(telefonesCliente.join(" / ") || "Sem telefone")}
            </div>
            <div class="cliente-acoes">
              <button class="btn-whatsapp" title="Chamar no WhatsApp" aria-label="Chamar no WhatsApp" ${telefoneWhats ? "" : "disabled"}>WA</button>
              <button class="btn-detalhes">Ver</button>
            </div>
          </div>

          <div class="cliente-detalhes hidden">
            Endereco: ${escapeHtml(c.endereco || "Endereco nao informado")}<br>
            Documento: ${escapeHtml(formatarDocumentoBR(c.documento))}<br>
            ${detalhesVeiculo}
            ${
              modoMecanica
                ? `
                  <div class="veiculo-edicao hidden">
                    <label>Modelo do carro</label>
                    <input class="edit-modelo-carro" value="${escapeHtml(c.modeloCarro || "")}" placeholder="Opcional" maxlength="80" />
                    <label>Placa</label>
                    <input class="edit-placa-carro" value="${escapeHtml(c.placaCarro || "")}" placeholder="Opcional" maxlength="8" />
                    <label>Cor</label>
                    <input class="edit-cor-carro" value="${escapeHtml(c.corCarro || "")}" placeholder="Opcional" maxlength="40" />
                    <label>KM</label>
                    <input class="edit-km-carro" type="text" inputmode="numeric" value="${escapeHtml(formatarKm(c.kmCarro))}" placeholder="Opcional" />
                    <div class="veiculo-edicao-acoes">
                      <button class="btn-editar btn-salvar-veiculo" type="button">Salvar veículo</button>
                      <button class="btn-arquivar btn-cancelar-veiculo" type="button">Cancelar</button>
                    </div>
                  </div>
                `
                : ""
            }
            ${ultimoServicoHtml}
            <button class="btn-editar btn-editar-cliente">Editar</button>
            ${modoMecanica ? `<button class="btn-editar btn-editar-veiculo" type="button">Editar veículo</button>` : ""}
            <button class="btn-arquivar btn-arquivar-cliente">Arquivar</button>
          </div>
        `;

        const btnDetalhes = card.querySelector(".btn-detalhes");
        const btnWhats = card.querySelector(".btn-whatsapp");
        const detalhes = card.querySelector(".cliente-detalhes");
        const btnEditar = card.querySelector(".btn-editar-cliente");
        const btnArquivar = card.querySelector(".btn-arquivar-cliente");
        const btnHistorico = card.querySelector(".btn-historico");
        const formVeiculo = card.querySelector(".veiculo-edicao");
        const btnEditarVeiculo = card.querySelector(".btn-editar-veiculo");
        const btnSalvarVeiculo = card.querySelector(".btn-salvar-veiculo");
        const btnCancelarVeiculo = card.querySelector(".btn-cancelar-veiculo");
        const inputModeloCarro = card.querySelector(".edit-modelo-carro");
        const inputPlacaCarro = card.querySelector(".edit-placa-carro");
        const inputCorCarro = card.querySelector(".edit-cor-carro");
        const inputKmCarro = card.querySelector(".edit-km-carro");

        btnDetalhes.onclick = () => {
          detalhes.classList.toggle("hidden");
          btnDetalhes.textContent =
            detalhes.classList.contains("hidden") ? "Ver" : "Fechar";
        };

        btnArquivar.onclick = () => {
          if (!confirm("Arquivar este cliente?")) return;
          arquivarCliente(c.id);
          renderClientes();
        };

        btnEditar.onclick = () => {
          location.href = "novo-cliente.html?editar=" + encodeURIComponent(c.id);
        };

        if (btnEditarVeiculo && formVeiculo) {
          btnEditarVeiculo.onclick = () => {
            formVeiculo.classList.remove("hidden");
            btnEditarVeiculo.classList.add("hidden");
            inputModeloCarro.focus();
          };
        }

        if (inputPlacaCarro) {
          inputPlacaCarro.addEventListener("input", () => {
            inputPlacaCarro.value = normalizarPlaca(inputPlacaCarro.value);
          });
        }

        if (inputKmCarro) {
          inputKmCarro.addEventListener("input", () => {
            inputKmCarro.value = formatarKm(inputKmCarro.value);
          });
        }

        if (btnCancelarVeiculo && formVeiculo && btnEditarVeiculo) {
          btnCancelarVeiculo.onclick = () => {
            inputModeloCarro.value = c.modeloCarro || "";
            inputPlacaCarro.value = c.placaCarro || "";
            inputCorCarro.value = c.corCarro || "";
            inputKmCarro.value = formatarKm(c.kmCarro);
            formVeiculo.classList.add("hidden");
            btnEditarVeiculo.classList.remove("hidden");
          };
        }

        if (btnSalvarVeiculo) {
          btnSalvarVeiculo.onclick = () => {
            let modeloSeguro;
            let corSegura;
            try {
              modeloSeguro = validarTextoUsuario(inputModeloCarro.value, "Modelo do carro", 80);
              corSegura = validarTextoUsuario(inputCorCarro.value, "Cor", 40);
            } catch (err) {
              alert(err.message || "Texto bloqueado por seguranca.");
              return;
            }

            const placaNormalizada = normalizarPlaca(inputPlacaCarro.value);
            if (!placaValida(placaNormalizada)) {
              alert("Placa invalida. Use ABC-1234 ou ABC1D23 (Mercosul).");
              inputPlacaCarro.focus();
              return;
            }

            const salvo = atualizarCliente(c.id, {
              nome: c.nome || "",
              telefone: c.telefone || "",
              telefone2: c.telefone2 || "",
              endereco: c.endereco || "",
              documento: c.documento || "",
              modeloCarro: modeloSeguro || "",
              placaCarro: placaNormalizada || "",
              corCarro: corSegura || "",
              kmCarro: normalizarKm(inputKmCarro.value)
            });

            if (!salvo) return;
            renderClientes();
          };
        }

        btnWhats.onclick = () => {
          if (!telefoneWhats) {
            alert("Cliente sem telefone valido para WhatsApp.");
            return;
          }
          const url = `https://api.whatsapp.com/send?phone=${telefoneWhats}&text=${encodeURIComponent(mensagemWhats)}`;
          location.href = url;
        };

        if (btnHistorico) {
          btnHistorico.onclick = () => {
            renderizarHistoricoCliente(c, getData());
          };
        }

        lista.appendChild(card);
      });
    }

    window.addEventListener("senso-live-update", () => {
      renderClientes();
    });

    renderClientes();
  </script>

</body>

</html>
