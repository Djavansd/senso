<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.28), transparent 38%),
        radial-gradient(circle at 82% 25%, rgba(45, 212, 191, 0.24), transparent 40%),
        linear-gradient(170deg, #e6f4ff 0%, #ecfeff 46%, #f8fafc 100%);
      min-height: 100vh;
    }

    .app {
      background: transparent;
    }

    .header {
      background: rgba(10, 124, 255, 0.78) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: rgba(10, 124, 255, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 22px rgba(10, 124, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .cliente-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.72),
        rgba(255, 255, 255, 0.4)
      );
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 14px;
    }

    .cliente-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.58) 0%,
        rgba(255, 255, 255, 0) 34%
      );
    }

    .cliente-card > * {
      position: relative;
      z-index: 1;
    }

    .cliente-resumo {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cliente-info {
      line-height: 1.4;
    }

    .btn-detalhes {
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      padding: 6px 12px;
      color: #0a4ea9;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .cliente-detalhes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    .btn-arquivar {
      margin-top: 6px;
      background: rgba(244, 67, 54, 0.92);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible,
    .btn-detalhes:hover,
    .btn-detalhes:focus-visible,
    .btn-arquivar:hover,
    .btn-arquivar:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.14);
      filter: saturate(1.05);
    }

    .btn-primary:active,
    .btn-detalhes:active,
    .btn-arquivar:active {
      transform: scale(0.98);
      box-shadow: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-primary,
      .btn-detalhes,
      .btn-arquivar {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="header">Clientes</div>

    <div class="content">
      <a href="novo-cliente.html" class="btn-primary">+ Novo Cliente</a>
      <div id="lista"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/core/profile.js"></script>
  <script src="../js/domains/mecanica/domain.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const lista = document.getElementById("lista");

    // ===== FORMATAR DOCUMENTO BR (CPF / CNPJ) =====
    function formatarDocumentoBR(doc) {
      if (!doc) return "Documento não informado";

      const v = doc.replace(/\D/g, "");

      if (v.length === 11) {
        return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
      }

      if (v.length === 14) {
        return v.replace(
          /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
          "$1.$2.$3/$4-$5"
        );
      }

      return doc;
    }

    function renderClientes() {
      const clientes = listarClientesAtivos();
      lista.innerHTML = "";

      if (clientes.length === 0) {
        lista.innerHTML = "<p>Nenhum cliente cadastrado</p>";
        return;
      }

      clientes.forEach(c => {
        const card = document.createElement("div");
        card.className = "cliente-card";

        card.innerHTML = `
          <div class="cliente-resumo">
            <div class="cliente-info">
              <strong>${c.nome}</strong><br>
              📞 ${c.telefone}
            </div>
            <button class="btn-detalhes">Ver</button>
          </div>

          <div class="cliente-detalhes hidden">
            📍 ${c.endereco || "Endereço não informado"}<br>
            📄 ${formatarDocumentoBR(c.documento)}<br>
            🚗 ${c.modeloCarro || "Modelo não informado"}<br>
            🔖 ${c.placaCarro || "Placa não informada"}<br>
            🎨 ${c.corCarro || "Cor não informada"}<br>
            <button class="btn-arquivar">Arquivar</button>
          </div>
        `;

        const btnDetalhes = card.querySelector(".btn-detalhes");
        const detalhes = card.querySelector(".cliente-detalhes");
        const btnArquivar = card.querySelector(".btn-arquivar");

        btnDetalhes.onclick = () => {
          detalhes.classList.toggle("hidden");
          btnDetalhes.textContent =
            detalhes.classList.contains("hidden") ? "Ver" : "Fechar";
        };

        btnArquivar.onclick = () => {
          if (!confirm("Arquivar este cliente?")) return;
          arquivarCliente(c.id);
          renderClientes();
        };

        lista.appendChild(card);
      });
    }

    window.addEventListener("senso-live-update", () => {
      renderClientes();
    });

    renderClientes();
  </script>

</body>

</html>
