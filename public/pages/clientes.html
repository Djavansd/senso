<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.28), transparent 38%),
        radial-gradient(circle at 82% 25%, rgba(45, 212, 191, 0.24), transparent 40%),
        linear-gradient(170deg, #e6f4ff 0%, #ecfeff 46%, #f8fafc 100%);
      min-height: 100vh;
    }

    .app {
      background: transparent;
    }

    .header {
      background: rgba(10, 124, 255, 0.78) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: rgba(10, 124, 255, 0.9) !important;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 22px rgba(10, 124, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .cliente-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.72),
        rgba(255, 255, 255, 0.4)
      );
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 16px 28px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 14px;
    }

    .cliente-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.58) 0%,
        rgba(255, 255, 255, 0) 34%
      );
    }

    .cliente-card > * {
      position: relative;
      z-index: 1;
    }

    .cliente-resumo {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cliente-info {
      line-height: 1.4;
    }

    .btn-detalhes {
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      padding: 6px 12px;
      color: #0a4ea9;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .cliente-acoes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-whatsapp {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: #25d366;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-whatsapp:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cliente-detalhes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      font-size: 13px;
    }

    .ultimo-servico-card {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 10px;
      padding: 10px;
      margin: 10px 0 8px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .ultimo-servico-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ultimo-servico-titulo {
      color: #0f172a;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .ultimo-servico-contador {
      color: #0a4ea9;
      font-size: 12px;
      white-space: nowrap;
    }

    .ultimo-servico-nome {
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .ultimo-servico-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      color: #475569;
      margin-bottom: 8px;
    }

    .ultimo-servico-itens {
      margin: 0 0 10px;
      padding-left: 16px;
      color: #334155;
    }

    .ultimo-servico-vazio {
      color: #64748b;
      margin-top: 6px;
    }

    .btn-historico {
      background: rgba(10, 124, 255, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .historico-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      padding: 16px;
    }

    .historico-modal.hidden {
      display: none;
    }

    .historico-modal-conteudo {
      width: min(520px, 100%);
      max-height: 82vh;
      overflow: auto;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 14px 14px 10px 10px;
      padding: 14px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.24);
    }

    .historico-modal-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .historico-modal-topo h3 {
      margin: 0;
      font-size: 17px;
    }

    .btn-fechar-historico {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 999px;
      background: #e2e8f0;
      color: #0f172a;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .historico-item {
      border-top: 1px solid #e2e8f0;
      padding: 10px 0;
    }

    .historico-item:first-child {
      border-top: none;
    }

    .historico-item-data {
      color: #0a4ea9;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .historico-item-total {
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .historico-item ul {
      margin: 0 0 6px;
      padding-left: 16px;
    }

    .historico-observacoes {
      color: #475569;
      font-style: italic;
    }

    .hidden {
      display: none;
    }

    .btn-arquivar {
      margin-top: 6px;
      background: rgba(244, 67, 54, 0.92);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .btn-primary:hover,
    .btn-primary:focus-visible,
    .btn-whatsapp:hover,
    .btn-whatsapp:focus-visible,
    .btn-detalhes:hover,
    .btn-detalhes:focus-visible,
    .btn-historico:hover,
    .btn-historico:focus-visible,
    .btn-fechar-historico:hover,
    .btn-fechar-historico:focus-visible,
    .btn-arquivar:hover,
    .btn-arquivar:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.14);
      filter: saturate(1.05);
    }

    .btn-primary:active,
    .btn-whatsapp:active,
    .btn-detalhes:active,
    .btn-historico:active,
    .btn-fechar-historico:active,
    .btn-arquivar:active {
      transform: scale(0.98);
      box-shadow: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-primary,
      .btn-whatsapp,
      .btn-detalhes,
      .btn-historico,
      .btn-fechar-historico,
      .btn-arquivar {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="header">Clientes</div>

    <div class="content">
      <a href="novo-cliente.html" class="btn-primary">+ Novo Cliente</a>
      <div id="lista"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/core/plans.js"></script>
  <script src="../js/core/profile.js"></script>
  <script src="../js/domains/mecanica/domain.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const lista = document.getElementById("lista");
    const modoMecanica = (
      window.SensoProfile &&
      typeof window.SensoProfile.getActiveProfile === "function" &&
      window.SensoProfile.getActiveProfile()?.id === "mecanica"
    );

    function formatarDocumentoBR(doc) {
      if (!doc) return "Documento nao informado";

      const v = doc.replace(/\D/g, "");

      if (v.length === 11) {
        return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
      }

      if (v.length === 14) {
        return v.replace(
          /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
          "$1.$2.$3/$4-$5"
        );
      }

      return doc;
    }

    function normalizarTelefoneWhats(telefone) {
      const digitos = String(telefone || "").replace(/\D/g, "");
      if (!digitos) return "";
      if (digitos.startsWith("55")) return digitos;
      if (digitos.length >= 10 && digitos.length <= 11) return `55${digitos}`;
      return digitos;
    }

    function normalizarPlacaHistorico(placa) {
      return String(placa || "").replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
    }

    function dataServicoTimestamp(servico) {
      const data = new Date(servico?.executadoEm || servico?.criadoEm || 0);
      const tempo = data.getTime();
      return Number.isFinite(tempo) ? tempo : 0;
    }

    function formatarDataHistorico(data) {
      const d = new Date(data || 0);
      if (!Number.isFinite(d.getTime())) return "Data não informada";
      return d.toLocaleDateString("pt-BR");
    }

    function obterItensServico(servico) {
      return Array.isArray(servico?.itens)
        ? servico.itens
            .map(item => String(item?.descricao || item?.nome || "").trim())
            .filter(Boolean)
        : [];
    }

    function buscarHistoricoCliente(cliente) {
      if (!modoMecanica) return [];

      const placaCliente = normalizarPlacaHistorico(cliente?.placaCarro);
      if (!placaCliente) return [];

      return (getData().servicos || [])
        .filter(servico => {
          const placaServico = normalizarPlacaHistorico(
            servico?.placaCarro || servico?.cliente?.placaCarro
          );
          return servico?.status === "executado" && placaServico === placaCliente;
        })
        .sort((a, b) => dataServicoTimestamp(b) - dataServicoTimestamp(a));
    }

    function obterUltimoServico(historico) {
      return Array.isArray(historico) && historico.length ? historico[0] : null;
    }

    function montarTextoContadorHistorico(total) {
      return `${total} ${total === 1 ? "serviço realizado" : "serviços realizados"}`;
    }

    function renderizarCardUltimoServico(cliente) {
      if (!modoMecanica) return "";

      const historico = buscarHistoricoCliente(cliente);
      const ultimoServico = obterUltimoServico(historico);
      const contador = montarTextoContadorHistorico(historico.length);

      if (!ultimoServico) {
        return `
          <div class="ultimo-servico-card">
            <div class="ultimo-servico-topo">
              <div class="ultimo-servico-titulo">Último serviço</div>
              <div class="ultimo-servico-contador">${escapeHtml(contador)}</div>
            </div>
            <div class="ultimo-servico-vazio">Nenhum serviço realizado ainda</div>
          </div>
        `;
      }

      const itens = obterItensServico(ultimoServico);
      const itensResumo = itens.slice(0, 3);
      const titulo = itensResumo[0] || "Serviço realizado";

      return `
        <div class="ultimo-servico-card">
          <div class="ultimo-servico-topo">
            <div class="ultimo-servico-titulo">Último serviço</div>
            <div class="ultimo-servico-contador">${escapeHtml(contador)}</div>
          </div>
          <div class="ultimo-servico-nome">${escapeHtml(titulo)}</div>
          <div class="ultimo-servico-meta">
            <span>${escapeHtml(formatarDataHistorico(ultimoServico.executadoEm || ultimoServico.criadoEm))}</span>
            <span>R$ ${escapeHtml(formatarMoedaBR(ultimoServico.totalGeral || 0))}</span>
          </div>
          ${
            itensResumo.length
              ? `<ul class="ultimo-servico-itens">${itensResumo.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`
              : ""
          }
          <button class="btn-historico" data-cliente-id="${escapeHtml(cliente.id)}">Ver histórico</button>
        </div>
      `;
    }

    function renderizarHistoricoCliente(cliente) {
      const historico = buscarHistoricoCliente(cliente);
      const modalExistente = document.getElementById("historicoClienteModal");
      if (modalExistente) modalExistente.remove();

      const modal = document.createElement("div");
      modal.id = "historicoClienteModal";
      modal.className = "historico-modal";

      const itensHtml = historico.length
        ? historico.map(servico => {
            const itens = obterItensServico(servico);
            return `
              <div class="historico-item">
                <div class="historico-item-data">${escapeHtml(formatarDataHistorico(servico.executadoEm || servico.criadoEm))}</div>
                <div class="historico-item-total">R$ ${escapeHtml(formatarMoedaBR(servico.totalGeral || 0))}</div>
                ${itens.length ? `<ul>${itens.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : ""}
                ${servico.observacoes ? `<div class="historico-observacoes">${escapeHtml(servico.observacoes)}</div>` : ""}
              </div>
            `;
          }).join("")
        : `<p>Nenhum serviço realizado ainda</p>`;

      modal.innerHTML = `
        <div class="historico-modal-conteudo" role="dialog" aria-modal="true" aria-labelledby="historicoClienteTitulo">
          <div class="historico-modal-topo">
            <div>
              <h3 id="historicoClienteTitulo">Histórico do veículo</h3>
              <small>${escapeHtml(cliente?.placaCarro || "Placa não informada")} - ${escapeHtml(montarTextoContadorHistorico(historico.length))}</small>
            </div>
            <button class="btn-fechar-historico" type="button" aria-label="Fechar histórico">x</button>
          </div>
          ${itensHtml}
        </div>
      `;

      const fechar = () => modal.remove();
      modal.querySelector(".btn-fechar-historico").onclick = fechar;
      modal.onclick = event => {
        if (event.target === modal) fechar();
      };
      document.body.appendChild(modal);
    }

    function renderClientes() {
      const clientes = listarClientesAtivos();
      lista.innerHTML = "";

      if (clientes.length === 0) {
        lista.innerHTML = "<p>Nenhum cliente cadastrado</p>";
        return;
      }

      clientes.forEach(c => {
        const card = document.createElement("div");
        card.className = "cliente-card";
        const telefonesCliente = listarTelefonesCliente(c);
        const telefoneWhats = normalizarTelefoneWhats(c.telefone);
        const companyName = String(getAppSettings()?.companyName || "").trim();
        const remetente = companyName || (modoMecanica ? "oficina" : "empresa");
        const mensagemWhats = modoMecanica
          ? `Ola ${c.nome || ""}, aqui e da ${remetente}. Podemos falar sobre seu veiculo?`
          : `Ola ${c.nome || ""}, aqui e da ${remetente}. Podemos falar sobre seu atendimento?`;
        const detalhesVeiculo = modoMecanica
          ? `
            Modelo: ${escapeHtml(c.modeloCarro || "Modelo nao informado")}<br>
            Placa: ${escapeHtml(c.placaCarro || "Placa nao informada")}<br>
            Cor: ${escapeHtml(c.corCarro || "Cor nao informada")}<br>
          `
          : "";
        const ultimoServicoHtml = renderizarCardUltimoServico(c);

        card.innerHTML = `
          <div class="cliente-resumo">
            <div class="cliente-info">
              <strong>${escapeHtml(c.nome)}</strong><br>
              Telefone: ${escapeHtml(telefonesCliente.join(" / ") || "Sem telefone")}
            </div>
            <div class="cliente-acoes">
              <button class="btn-whatsapp" title="Chamar no WhatsApp" aria-label="Chamar no WhatsApp" ${telefoneWhats ? "" : "disabled"}>WA</button>
              <button class="btn-detalhes">Ver</button>
            </div>
          </div>

          <div class="cliente-detalhes hidden">
            Endereco: ${escapeHtml(c.endereco || "Endereco nao informado")}<br>
            Documento: ${escapeHtml(formatarDocumentoBR(c.documento))}<br>
            ${detalhesVeiculo}
            ${ultimoServicoHtml}
            <button class="btn-arquivar">Arquivar</button>
          </div>
        `;

        const btnDetalhes = card.querySelector(".btn-detalhes");
        const btnWhats = card.querySelector(".btn-whatsapp");
        const detalhes = card.querySelector(".cliente-detalhes");
        const btnArquivar = card.querySelector(".btn-arquivar");
        const btnHistorico = card.querySelector(".btn-historico");

        btnDetalhes.onclick = () => {
          detalhes.classList.toggle("hidden");
          btnDetalhes.textContent =
            detalhes.classList.contains("hidden") ? "Ver" : "Fechar";
        };

        btnArquivar.onclick = () => {
          if (!confirm("Arquivar este cliente?")) return;
          arquivarCliente(c.id);
          renderClientes();
        };

        btnWhats.onclick = () => {
          if (!telefoneWhats) {
            alert("Cliente sem telefone valido para WhatsApp.");
            return;
          }
          const url = `https://wa.me/${telefoneWhats}?text=${encodeURIComponent(mensagemWhats)}`;
          window.open(url, "_blank");
        };

        if (btnHistorico) {
          btnHistorico.onclick = () => {
            renderizarHistoricoCliente(c);
          };
        }

        lista.appendChild(card);
      });
    }

    window.addEventListener("senso-live-update", () => {
      renderClientes();
    });

    renderClientes();
  </script>

</body>

</html>
