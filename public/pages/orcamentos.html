<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orçamentos</title>

<link rel="stylesheet" href="../css/style.css" />

<style>
body {
    background: #ffffff;
}

/* ===== BUSCA ===== */
.busca {
    padding: 14px;
}

.busca input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 14px;
}

/* ===== FILTROS ===== */
.filtros {
    padding: 0 14px 6px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.abas {
    padding: 0 14px 10px;
    display: flex;
    gap: 8px;
}

.aba-btn {
    border: 1px solid #d0d7de;
    background: #fff;
    color: #444;
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease, background .2s ease;
}

.aba-btn.ativa {
    background: #0f9d58;
    color: #fff;
    border-color: #0f9d58;
}

.filtro-btn {
    border: 1px solid #d0d7de;
    background: #fff;
    color: #444;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease, background .2s ease;
}

.filtro-btn.ativo {
    background: #1976d2;
    color: #fff;
    border-color: #1976d2;
}

/* ===== AGRUPAMENTO ===== */
.grupo {
    padding: 0 14px;
    margin-top: 12px;
}

.grupo-titulo {
    font-size: 13px;
    font-weight: bold;
    color: #555;
    margin: 10px 0 6px;
}

/* ===== GRID ===== */
.lista {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

/* ===== CARD ===== */
.card {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,.08);
    font-size: 14px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .2s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
}

.aba-btn:hover,
.aba-btn:focus-visible,
.filtro-btn:hover,
.filtro-btn:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 8px 14px rgba(15, 23, 42, 0.12);
    filter: saturate(1.05);
}

.aba-btn:active,
.filtro-btn:active {
    transform: scale(0.98);
    box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
    .aba-btn,
    .filtro-btn,
    .card {
        transition: none;
    }
}

/* ===== CORES POR STATUS ===== */
.card.enviado {
    background: #e3f2fd;
}

.card.aprovado {
    background: #e8f5e9;
}

.card.recusado {
    background: #fdecea;
}

/* ===== TEXTO ===== */
.card-numero {
    font-weight: bold;
    font-size: 13px;
    color: #0f9d58;
}

.card-cliente {
    margin-top: 6px;
    font-weight: bold;
}

.card-data {
    font-size: 12px;
    color: #666;
    margin-top: 2px;
}

.card-valor {
    margin-top: 8px;
    font-weight: bold;
    font-size: 15px;
}

.card-status {
    margin-top: 6px;
    font-size: 12px;
    font-weight: bold;
}

.status-enviado { color: #1976d2; }
.status-aprovado { color: #1e8e3e; }
.status-recusado { color: #d93025; }

.aviso-meses-fechados {
    margin: 0 14px 12px;
    padding: 10px 12px;
    border: 1px solid #f4b4ae;
    border-left: 4px solid #d93025;
    border-radius: 10px;
    background: #fdecea;
    color: #a50e0e;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.35;
}

/* ===== VAZIO ===== */
.vazio {
    padding: 30px;
    text-align: center;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="app">
    <div class="header">Orçamentos</div>

    <div class="busca">
        <input id="buscaCliente" placeholder="Buscar por cliente..." />
    </div>

    <div class="abas" id="abasPeriodo">
        <button class="aba-btn ativa" data-aba="atual">Mes atual</button>
        <button class="aba-btn" data-aba="fechados">Meses fechados</button>
    </div>

    <div class="filtros" id="filtrosStatus">
        <button class="filtro-btn ativo" data-status="">Todos</button>
        <button class="filtro-btn" data-status="enviado">Enviados</button>
        <button class="filtro-btn" data-status="aprovado">Aprovados</button>
        <button class="filtro-btn" data-status="recusado">Recusados</button>
    </div>

    <div class="content" id="conteudo"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/core/plans.js"></script>
<script src="../js/core/profile.js"></script>
<script src="../js/domains/mecanica/domain.js"></script>
<script src="../js/app.js"></script>

<script>
const conteudo = document.getElementById("conteudo");
const busca = document.getElementById("buscaCliente");
const abasPeriodo = document.getElementById("abasPeriodo");
const filtrosStatus = document.getElementById("filtrosStatus");
let statusAtivo = "";
let abaAtiva = "atual";

function parseDataSeguro(value) {
    const d = new Date(value || "");
    return Number.isNaN(d.getTime()) ? null : d;
}

function getDataReferenciaOrcamento(o) {
    return (
        parseDataSeguro(o.criadoEm) ||
        parseDataSeguro(o.aprovadoEm) ||
        parseDataSeguro(o.recusadoEm) ||
        new Date()
    );
}

function getTodos(data) {
    const todosOrdenados = (data.orcamentos || [])
        .slice()
        .sort((a, b) => getDataReferenciaOrcamento(b) - getDataReferenciaOrcamento(a));

    const vistosPorServico = new Set();
    return todosOrdenados.filter(o => {
        const chave = o.origemServicoId || o.id;
        if (vistosPorServico.has(chave)) return false;
        vistosPorServico.add(chave);
        return true;
    });
}

const agora = new Date();
const mesAtual = agora.getMonth();
const anoAtual = agora.getFullYear();

function render(lista, totalFechados = 0) {
    conteudo.innerHTML = "";

    if (abaAtiva === "fechados" && totalFechados > 0) {
        const aviso = document.createElement("div");
        aviso.className = "aviso-meses-fechados";
        aviso.textContent = "Meses encerrados ficam arquivados aqui para consulta. A aba Mes atual mostra apenas os orcamentos do mes em andamento.";
        conteudo.appendChild(aviso);
    }

    if (!lista.length) {
        const textoVazio = abaAtiva === "atual"
            ? "Nenhum orçamento no mês atual"
            : "Nenhum orçamento em meses fechados";
        const vazio = document.createElement("div");
        vazio.className = "vazio";
        vazio.textContent = textoVazio;
        conteudo.appendChild(vazio);
        return;
    }

    let ultimoGrupo = "";

    lista.forEach(o => {
        const d = getDataReferenciaOrcamento(o);
        const grupo = d.toLocaleDateString("pt-BR", {
            month: "long",
            year: "numeric"
        });

        if (grupo !== ultimoGrupo) {
            const bloco = document.createElement("div");
            bloco.className = "grupo";
            bloco.innerHTML = `
                <div class="grupo-titulo">${grupo}</div>
                <div class="lista"></div>
            `;
            conteudo.appendChild(bloco);
            ultimoGrupo = grupo;
        }

        const listaEl =
            conteudo.querySelector(".grupo:last-child .lista");

        const card = document.createElement("div");
        card.className = `card ${o.status || ""}`;
        card.onclick = () => {
            location.href = "orcamento.html?id=" + o.id;
        };

        card.innerHTML = `
            <div class="card-numero">📄 ${escapeHtml(o.numero)}</div>
            <div class="card-cliente">${escapeHtml(o.cliente?.nome || "")}</div>
            <div class="card-data">
                ${d.toLocaleDateString("pt-BR")}
            </div>
            <div class="card-valor">
                R$ ${formatarMoedaBR(o.total)}
            </div>

            ${o.status
                ? `<div class="card-status status-${o.status}">
                    ${o.status === "enviado" ? "📤 Enviado" :
                      o.status === "aprovado" ? "✅ Aprovado" :
                      o.status === "recusado" ? "❌ Recusado" : ""}
                   </div>`
                : ""
            }
        `;

        listaEl.appendChild(card);
    });
}

function aplicarFiltros() {
    const data = getData();
    const todos = getTodos(data);
    const termo = busca.value.toLowerCase().trim();
    const mesesFechados = todos.filter(o => {
        const dataOrc = getDataReferenciaOrcamento(o);
        return !(
            dataOrc.getMonth() === mesAtual &&
            dataOrc.getFullYear() === anoAtual
        );
    });

    const filtrados = todos.filter(o => {
        const dataOrc = getDataReferenciaOrcamento(o);
        const isMesAtual = (
            dataOrc.getMonth() === mesAtual &&
            dataOrc.getFullYear() === anoAtual
        );
        const passaAba = abaAtiva === "atual"
            ? isMesAtual
            : !isMesAtual;
        const passaStatus = !statusAtivo || o.status === statusAtivo;
        const passaBusca = !termo ||
            String(o.cliente?.nome || "").toLowerCase().includes(termo);
        return passaAba && passaStatus && passaBusca;
    });

    render(filtrados, mesesFechados.length);
}

/* ===== BUSCA ===== */
busca.oninput = () => {
    aplicarFiltros();
};

/* ===== FILTRO STATUS ===== */
filtrosStatus.onclick = (event) => {
    const btn = event.target.closest(".filtro-btn");
    if (!btn) return;

    statusAtivo = btn.dataset.status || "";

    filtrosStatus.querySelectorAll(".filtro-btn").forEach(el =>
        el.classList.toggle("ativo", el === btn)
    );
    aplicarFiltros();
};

/* ===== ABAS DE PERIODO ===== */
abasPeriodo.onclick = (event) => {
    const btn = event.target.closest(".aba-btn");
    if (!btn) return;

    abaAtiva = btn.dataset.aba || "atual";

    abasPeriodo.querySelectorAll(".aba-btn").forEach(el =>
        el.classList.toggle("ativa", el === btn)
    );

    aplicarFiltros();
};

/* ===== INIT ===== */
window.addEventListener("senso-live-update", () => {
    aplicarFiltros();
});

aplicarFiltros();
</script>

</body>
</html>
