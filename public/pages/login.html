<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com; style-src 'unsafe-inline' 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
    <title>Entrar - Senso</title>
    <link rel="stylesheet" href="../css/style.css?v=20260629-brasil-mobile">
    <style>
        :root {
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            color: #0f172a;
            padding: 16px;
            pointer-events: auto;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            position: relative;
            z-index: 2;
            pointer-events: auto;
        }
        h1 {
            margin: 0 0 14px;
            font-size: 24px;
        }
        p {
            margin: 0 0 14px;
            font-size: 14px;
            color: #475569;
        }
        label {
            display: block;
            margin: 12px 0 6px;
            font-size: 13px;
            font-weight: bold;
        }
        input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            pointer-events: auto;
        }
        button {
            margin-top: 14px;
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 11px 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary {
            background: #0f766e;
            color: #ffffff;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .status {
            margin-top: 10px;
            min-height: 20px;
            font-size: 13px;
            color: #b91c1c;
        }
        .privacy-note {
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.4;
            color: #64748b;
            text-align: center;
        }
        .privacy-note a {
            color: #0f766e;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Senso</h1>
        <p>Entre com sua conta para acessar seus dados.</p>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" maxlength="120" spellcheck="false" />

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" maxlength="128" />

        <div class="actions">
            <button class="btn-primary" id="btnEntrar">Entrar</button>
            <button class="btn-secondary" id="btnCriar">Criar conta</button>
        </div>
        <p class="privacy-note">
            Ao entrar ou criar conta, você declara que leu a
            <a href="privacidade.html">Política de Privacidade</a>.
        </p>
        <div class="status" id="status"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script>
        const emailEl = document.getElementById("email");
        const senhaEl = document.getElementById("senha");
        const statusEl = document.getElementById("status");
        const btnEntrar = document.getElementById("btnEntrar");
        const btnCriar = document.getElementById("btnCriar");
        const nextParam = new URLSearchParams(window.location.search).get("next");
        const DANGEROUS_INPUT = [
            /<\s*\/?\s*(script|iframe|object|embed|link|meta|style|svg|img|form|input|button)[\s>/]/i,
            /\bjavascript\s*:/i,
            /\bon[a-z]+\s*=/i,
            /\b(select|insert|update|delete|drop|alter|create|truncate|union|exec)\b[\s\S]*(\bfrom\b|\bwhere\b|\btable\b|\binto\b|;|--|\/\*)/i,
            /['"]\s*(or|and)\s+['"]?\w+['"]?\s*=\s*['"]?\w+/i
        ];

        function getDefaultHomePath() {
            return "../index.html";
        }

        function getSafeNext() {
            if (nextParam && nextParam.startsWith("/") && !nextParam.startsWith("//")) return nextParam;
            return getDefaultHomePath();
        }

        function emailSeguro() {
            const email = emailEl.value.trim().normalize("NFKC");
            const formatoEmail = /^[^\s@<>()[\]'"`;]+@[^\s@<>()[\]'"`;]+\.[^\s@<>()[\]'"`;]+$/;

            if (DANGEROUS_INPUT.some(regex => regex.test(email))) {
                setStatus("Entrada bloqueada por segurança.");
                return "";
            }

            if (!formatoEmail.test(email)) {
                setStatus("Informe um email válido.");
                return "";
            }

            return email;
        }

        function initFirebaseAuth() {
            const cfg = window.SENSO_FIREBASE_CONFIG;
            if (!cfg || !cfg.apiKey || !cfg.projectId) {
                setStatus("Firebase não configurado em public/js/firebase-config.js.");
                return false;
            }

            if (!firebase.apps.length) {
                firebase.initializeApp(cfg);
            }

            firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {
                // Mantém fluxo mesmo se o navegador limitar persistência.
            });

            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    window.location.replace(getSafeNext());
                }
            });

            return true;
        }

        function setStatus(msg) {
            statusEl.textContent = msg || "";
        }

        if (new URLSearchParams(window.location.search).get("access") === "pending") {
            setStatus("Conta criada. Aguarde a autorização do administrador para acessar.");
        }

        async function login() {
            const email = emailSeguro();
            const senha = senhaEl.value;

            if (!email || !senha) {
                if (!email) return;
                setStatus("Informe email e senha.");
                return;
            }

            setStatus("Entrando...");
            try {
                await firebase.auth().signInWithEmailAndPassword(email, senha);
                setStatus("");
            } catch (err) {
                setStatus("Email ou senha inválidos.");
            }
        }

        async function criarConta() {
            const email = emailSeguro();
            const senha = senhaEl.value;

            if (!email || !senha) {
                if (!email) return;
                setStatus("Informe email e senha.");
                return;
            }

            if (senha.length < 6) {
                setStatus("A senha precisa ter pelo menos 6 caracteres.");
                return;
            }

            setStatus("Criando conta...");
            try {
                await firebase.auth().createUserWithEmailAndPassword(email, senha);
                setStatus("");
            } catch (err) {
                setStatus("Não foi possível criar a conta com esses dados.");
            }
        }

        btnEntrar.addEventListener("click", login);
        btnCriar.addEventListener("click", criarConta);
        initFirebaseAuth();
    </script>
</body>
</html>
