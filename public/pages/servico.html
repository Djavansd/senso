<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serviço</title>

<link rel="stylesheet" href="../css/style.css?v=20260629-brasil-mobile" />
<link rel="stylesheet" href="../css/assistente-senso.css" />
<link rel="stylesheet" href="../css/assistente-ajuda.css" />

<style>
.hidden { display:none; }

.resumo-card {
    background:#fff;
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.06);
    font-size:14px;
}

.servicos-mes {
    margin-bottom: 10px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.04);
    overflow: hidden;
}

.servicos-mes summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    cursor: pointer;
    font-weight: 700;
    color: #111827;
    list-style: none;
}

.servicos-mes summary::-webkit-details-marker {
    display: none;
}

.servicos-mes summary::after {
    content: "";
    width: 8px;
    height: 8px;
    border-right: 2px solid #6b7280;
    border-bottom: 2px solid #6b7280;
    flex: 0 0 8px;
    margin-right: 2px;
    transform: rotate(45deg);
    transition: transform .2s ease;
}

.servicos-mes:not([open]) summary::after {
    transform: rotate(-45deg);
}

.servicos-mes-meta {
    font-size: 12px;
    color: #6b7280;
    font-weight: 600;
    text-align: right;
}

.servicos-mes-lista {
    padding: 0 10px 10px;
}

.servicos-mes-lista .resumo-card {
    margin-bottom: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,.05);
}

.resumo-card.servico-em-aberto {
    position: relative;
    border: 1px solid #f59e0b;
    background: #fffbeb;
    box-shadow: 0 8px 18px rgba(245, 158, 11, 0.16);
}

.resumo-card.servico-em-aberto::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 5px;
    background: #f59e0b;
    border-radius: 14px 0 0 14px;
}

.servico-cadastrado-card {
    --servico-card-cor: #1687f8;
    --servico-card-rgb: 22, 135, 248;
    position: relative;
    overflow: hidden;
    padding: 14px 13px 14px 17px;
    border: 1px solid rgba(var(--servico-card-rgb), .30);
    background: linear-gradient(145deg, #ffffff 48%, rgba(var(--servico-card-rgb), .065));
    box-shadow:
        0 11px 24px rgba(15, 23, 42, .11),
        0 3px 9px rgba(var(--servico-card-rgb), .13);
    transition: transform .18s ease, box-shadow .18s ease;
}

.servico-cadastrado-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 5px;
    border-radius: 14px 0 0 14px;
    background: linear-gradient(180deg, var(--servico-card-cor), rgba(var(--servico-card-rgb), .58));
}

.servico-cadastrado-card:hover {
    transform: translateY(-1px);
    box-shadow:
        0 14px 28px rgba(15, 23, 42, .14),
        0 4px 11px rgba(var(--servico-card-rgb), .16);
}

.servico-cadastrado-card.card-servico-executado {
    --servico-card-cor: #16a56f;
    --servico-card-rgb: 22, 165, 111;
}

.servico-cadastrado-card.card-servico-recusado {
    --servico-card-cor: #e5484d;
    --servico-card-rgb: 229, 72, 77;
}

.servico-cadastrado-card.servico-em-aberto {
    --servico-card-cor: #f59e0b;
    --servico-card-rgb: 245, 158, 11;
}

.servicos-mes {
    border-color: rgba(22, 135, 248, .20);
    box-shadow: 0 9px 22px rgba(15, 23, 42, .09);
}

.servicos-mes[open] > summary {
    background: linear-gradient(90deg, rgba(22, 135, 248, .075), rgba(255, 255, 255, .96));
    border-bottom: 1px solid rgba(22, 135, 248, .12);
}

.servico-alerta-aprovacao {
    display: inline-block;
    margin: 5px 0 4px;
    padding: 4px 7px;
    border-radius: 8px;
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    font-weight: 700;
}

.servico-alerta-cadastro {
    display: inline-block;
    margin: 5px 0 4px;
    padding: 4px 7px;
    border-radius: 8px;
    background: #dff7f3;
    color: #0f766e;
    font-size: 12px;
    font-weight: 700;
}

.item-servico {
    background:#f5f5f5;
    border-radius:10px;
    padding:6px 8px;
    margin-bottom:4px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

.item-servico-info {
    min-width: 0;
    overflow-wrap: anywhere;
}

.item-servico-acoes {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.item-valor { font-weight:bold; color:#0f9d58; }

.btn-item {
    border: none;
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
}

.btn-item-editar {
    background: #e3f2fd;
    color: #0d47a1;
}

.btn-item-remover {
    background: #fdecea;
    color: #b42318;
}

.salvar-servico-alerta {
    margin-top: 8px;
    padding: 9px 10px;
    border-radius: 9px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
    font-size: 13px;
    font-weight: 700;
}

.problema-pro-box {
    margin: 10px 0;
    padding: 10px;
    border: 1px solid #99f6e4;
    border-radius: 12px;
    background: #f0fdfa;
}

.problema-pro-box small {
    display: block;
    margin-top: 4px;
    color: #0f766e;
    font-size: 12px;
    line-height: 1.35;
}

.problema-relatado {
    display: block;
    margin: 6px 0 4px;
    padding: 7px 8px;
    border-radius: 8px;
    background: #ecfdf5;
    color: #134e4a;
    font-size: 13px;
    line-height: 1.35;
}

.btn-salvar-pendente {
    outline: 3px solid rgba(245, 158, 11, 0.35);
    box-shadow: 0 0 0 6px rgba(245, 158, 11, 0.16), 0 10px 18px rgba(15, 23, 42, 0.14);
    filter: saturate(1.15);
}

.status-pendente { color:#f57c00; font-weight:bold; }
.status-executado { color:#0f9d58; font-weight:bold; }
.status-estornado { color:#777; }

.toggle-itens {
    font-size:12px;
    color:#1976d2;
    cursor:pointer;
    margin-top:6px;
    display:inline-block;
}

.cliente-mini {
    font-size:13px;
    color:#555;
    margin-top:4px;
}

.btn-corrigir {
    margin-top:6px;
    background:#fff3cd;
    color:#856404;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

.btn-orcamento {
    margin-top:6px;
    background:#e3f2fd;
    color:#0d47a1;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

.btn-editar {
    margin-top:6px;
    background:#e8f5e9;
    color:#1b5e20;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

button {
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

button:hover,
button:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 10px 18px rgba(15, 23, 42, 0.14);
    filter: saturate(1.05);
}

button:active {
    transform: scale(0.98);
    box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
    button,
    .btn-orcamento,
    .btn-editar,
    .btn-corrigir {
        transition: none;
    }
}

textarea {
    width: 100%;
    min-height: 70px;
    resize: vertical;
}

.servico-etapa-card {
    --etapa-cor: #1687f8;
    --etapa-rgb: 22, 135, 248;
    position: relative;
    margin: 4px 0 16px;
    padding: 14px 13px 15px 17px;
    overflow: hidden;
    border: 1px solid rgba(var(--etapa-rgb), .30);
    border-radius: 17px;
    background: linear-gradient(145deg, #ffffff 45%, rgba(var(--etapa-rgb), .055));
    box-shadow:
        0 11px 25px rgba(15, 23, 42, .10),
        0 3px 8px rgba(var(--etapa-rgb), .11);
}

.servico-etapa-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 5px;
    background: linear-gradient(180deg, var(--etapa-cor), rgba(var(--etapa-rgb), .58));
}

.servico-etapa-card--detalhes {
    --etapa-cor: #13a985;
    --etapa-rgb: 19, 169, 133;
}

.servico-etapa-card h3 {
    margin: 0 0 11px;
    color: #172033;
    font-size: 16px;
    letter-spacing: -.15px;
}

.servico-etapa-card > label,
.servico-etapa-card > div > label {
    color: #334155;
    font-weight: 700;
}

.servico-etapa-card input,
.servico-etapa-card select,
.servico-etapa-card textarea {
    border-color: #cbd5e1;
    background-color: rgba(255, 255, 255, .94);
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, .035);
    transition: border-color .18s ease, box-shadow .18s ease;
}

.servico-etapa-card input:focus,
.servico-etapa-card select:focus,
.servico-etapa-card textarea:focus {
    outline: none;
    border-color: var(--etapa-cor);
    box-shadow: 0 0 0 3px rgba(var(--etapa-rgb), .14);
}

.servico-etapa-card .servico-card,
.servico-etapa-card .problema-pro-box,
.servico-etapa-card .resumo-card {
    border-color: rgba(var(--etapa-rgb), .20);
    box-shadow: 0 5px 13px rgba(15, 23, 42, .065);
}

</style>
<script src="../js/auth-boot.js?v=20260630"></script>
</head>

<body>
<div class="app">
<div class="header">Serviço</div>

<div class="content">

<section class="servico-etapa-card" aria-labelledby="tituloServicoPasso1">
<h3 id="tituloServicoPasso1">Serviço • Passo 1</h3>

<label>Cliente</label>
<input id="clienteBusca" placeholder="Buscar cliente por nome, sobrenome ou telefone" autocomplete="off" />
<select id="clienteSelect">
    <option value="">Selecione um cliente</option>
</select>

<div id="clienteResumo" class="resumo-card hidden"></div>

<div id="veiculoServicoBox" class="resumo-card hidden">
    <label>Modelo do carro</label>
    <input id="servicoModeloCarro" list="sugestoesModeloCarroServico" placeholder="Opcional" autocomplete="on" maxlength="80" />
    <datalist id="sugestoesModeloCarroServico"></datalist>

    <label>Placa</label>
    <input id="servicoPlacaCarro" placeholder="Opcional" maxlength="8" />

    <label>Cor</label>
    <input id="servicoCorCarro" placeholder="Opcional" maxlength="40" />

    <label>KM</label>
    <input id="servicoKmCarro" type="text" inputmode="numeric" placeholder="Opcional" />
</div>
</section>

<section class="servico-etapa-card servico-etapa-card--detalhes" aria-labelledby="tituloServicoPasso2">
<h3 id="tituloServicoPasso2">Serviço • Passo 2</h3>

<div id="problemaRelatadoBox" class="problema-pro-box hidden">
    <label id="problemaRelatadoLabel">Problema relatado pelo cliente</label>
    <textarea id="problemaRelatadoServico"
        placeholder="Ex: descreva o que o cliente informou antes do atendimento..."></textarea>
</div>

<form id="formItem" class="servico-card" autocomplete="on">
    <label>Descrição do serviço</label>
    <input id="itemDescricao" name="descricaoServico" list="sugestoesServico" required autocomplete="on" />
    <datalist id="sugestoesServico"></datalist>

    <label>Valor unitário</label>
    <input
        id="itemValor"
        type="text"
        inputmode="decimal"
        pattern="^\d+([.,]\d{0,2})?$"
        placeholder="Ex: 10,50"
        required
    />

    <label>Quantidade</label>
    <input
        id="itemQtd"
        type="number"
        inputmode="numeric"
        pattern="^\d+$"
        min="1"
        step="1"
        value="1"
        required
    />

    <button type="submit">Adicionar Item</button>
</form>

<div id="itensResumo" class="hidden">
    <div id="listaItens"></div>
    <h4>Total do Serviço: R$ <span id="totalServico">0,00</span></h4>
</div>

<label style="margin-top:10px;">Observações do serviço (opcional)</label>
<textarea id="observacoesServico"
 placeholder="Ex: Equipamento muito sujo, acesso difícil, valor válido por 10 dias..."></textarea>

<!-- ✅ CAMPO QUE FALTAVA -->
<label style="margin-top:10px;">Forma de pagamento</label>
<select id="formaPagamento">
    <option value="">Não informado</option>
    <option>Pix</option>
    <option>Dinheiro</option>
    <option>Crédito</option>
    <option>Cartão de débito</option>
    <option>Transferência</option>
</select>

<div style="margin-top:12px;">
<label style="font-size:13px;">Retorno / Manutenção (opcional)</label>
<select id="intervaloSelect">
    <option value="">Padrão (6 meses)</option>
    <option value="nenhum">Nenhum</option>
    <option value="semanal">Semanal</option>
    <option value="mensal">Mensal</option>
    <option value="3">3 meses</option>
    <option value="6">6 meses</option>
    <option value="12">12 meses</option>
</select>

</div>

<button type="button" id="btnSalvarServico" style="margin-top:12px; margin-bottom:8px;">Salvar Serviço</button>
<div id="salvarServicoAlerta" class="salvar-servico-alerta hidden"></div>
</section>

<hr />

<h3>Serviços cadastrados</h3>
<div id="listaServicos"></div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js?v=20260702-leituras1"></script>
<script src="../js/core/plans.js?v=20260702-leituras1"></script>
<script src="../js/core/profile.js?v=20260702-negocios2"></script>
<script src="../js/domains/mecanica/domain.js"></script>
<script src="../js/app.js?v=20260702-negocio-ativo"></script>
<script src="../js/data-sync-v2.js?v=20260702-leituras1"></script>
<script src="../js/assistente-senso.js"></script>
<script src="../js/assistente-ajuda.js"></script>

<script>
const clienteBusca = document.getElementById("clienteBusca");
const clienteSelect = document.getElementById("clienteSelect");
const clienteResumo = document.getElementById("clienteResumo");
const listaItens = document.getElementById("listaItens");
const totalServicoEl = document.getElementById("totalServico");
const listaServicos = document.getElementById("listaServicos");
const intervaloSelect = document.getElementById("intervaloSelect");
const observacoesServico = document.getElementById("observacoesServico");
const problemaRelatadoBox = document.getElementById("problemaRelatadoBox");
const problemaRelatadoServico = document.getElementById("problemaRelatadoServico");
const formaPagamento = document.getElementById("formaPagamento");
const sugestoesServico = document.getElementById("sugestoesServico");
const veiculoServicoBox = document.getElementById("veiculoServicoBox");
const servicoModeloCarro = document.getElementById("servicoModeloCarro");
const sugestoesModeloCarroServico = document.getElementById("sugestoesModeloCarroServico");
const servicoPlacaCarro = document.getElementById("servicoPlacaCarro");
const servicoCorCarro = document.getElementById("servicoCorCarro");
const servicoKmCarro = document.getElementById("servicoKmCarro");
const formItem = document.getElementById("formItem");
const btnSalvarServico = document.getElementById("btnSalvarServico");
const salvarServicoAlerta = document.getElementById("salvarServicoAlerta");
const itemDescricao = document.getElementById("itemDescricao");
const itemValor = document.getElementById("itemValor");
const itemQtd = document.getElementById("itemQtd");
const btnAdicionarItem = formItem.querySelector("button[type='submit']");
let servicoEmEdicaoId = "";
let itemEmEdicaoIndex = -1;
const modoMecanica = window.SensoProfile?.usesVehicleFields?.() === true;
const negocioAtivo = window.SensoProfile?.getBusinessType?.();

function aplicarTextoProblemaRelatado() {
    if (!problemaRelatadoServico) return;
    const label = document.getElementById("problemaRelatadoLabel");
    if (label) label.textContent = negocioAtivo?.problemLabel || "Problema relatado pelo cliente";
    problemaRelatadoServico.placeholder = negocioAtivo?.problemPlaceholder || (modoMecanica
        ? "Ex: ar não gela, carro falhando, barulho ao frear, vazamento, luz acesa no painel..."
        : "Ex: cliente informou o problema, local do serviço, urgência, medidas, acesso ou detalhes do atendimento...");
}

function usuarioPodeUsarProblemaRelatado() {
    return !!(
        window.SensoPlans?.state?.ready &&
        window.SensoPlans?.isPro?.() &&
        window.SensoPlans?.isActive?.()
    );
}

function renderProblemaRelatadoPro() {
    const podeUsar = usuarioPodeUsarProblemaRelatado();
    problemaRelatadoBox?.classList.toggle("hidden", !podeUsar);
    if (!podeUsar && !servicoEmEdicaoId) {
        problemaRelatadoServico.value = "";
    }
}

function limparQtdInput(valor) {
    const normalizado = String(valor || "").normalize("NFKC");
    return normalizado.replace(/[^\d]/g, "");
}

function limparValorInput(valor) {
    const somentePermitidos = String(valor || "")
        .replace(/[^\d.,]/g, "")
        .replace(/\./g, ",");

    const indiceVirgula = somentePermitidos.indexOf(",");
    if (indiceVirgula < 0) {
        return somentePermitidos.replace(/\D/g, "");
    }

    const parteInteira = somentePermitidos.slice(0, indiceVirgula).replace(/\D/g, "");
    const parteDecimal = somentePermitidos
        .slice(indiceVirgula + 1)
        .replace(/\D/g, "")
        .slice(0, 2);

    return `${parteInteira},${parteDecimal}`;
}

function parseQtd(valor) {
    const limpo = limparQtdInput(valor);
    const numero = Number(limpo);
    return Number.isFinite(numero) && numero >= 1 ? Math.trunc(numero) : 0;
}

function parseValorBR(valor) {
    const limpo = limparValorInput(valor).replace(",", ".");
    const numero = Number(limpo);
    return Number.isFinite(numero) && numero >= 0 ? numero : 0;
}

itemQtd.addEventListener("input", () => {
    itemQtd.value = limparQtdInput(itemQtd.value);
});

itemQtd.addEventListener("blur", () => {
    const qtd = parseQtd(itemQtd.value);
    itemQtd.value = String(qtd >= 1 ? qtd : 1);
});

itemValor.addEventListener("input", () => {
    itemValor.value = limparValorInput(itemValor.value);
});

const itens = [];
const sugestoesDescricaoMap = new Map();
const clientesAtivos = listarClientesAtivos();
const activeProfileId = (
    window.SensoProfile &&
    typeof window.SensoProfile.getActiveProfile === "function" &&
    window.SensoProfile.getActiveProfile()?.id
) ? window.SensoProfile.getActiveProfile().id : "base";
const SUGESTOES_DESCRICAO_KEY = `servicoSugestoesDescricao:${activeProfileId}`;

function carregarSugestoesDescricaoSalvas() {
    try {
        const raw = localStorage.getItem(SUGESTOES_DESCRICAO_KEY);
        const lista = JSON.parse(raw || "[]");
        if (!Array.isArray(lista)) return [];
        return lista.map(v => String(v || "").trim()).filter(Boolean);
    } catch {
        return [];
    }
}

function salvarSugestoesDescricao() {
    const lista = Array.from(sugestoesDescricaoMap.values());
    localStorage.setItem(SUGESTOES_DESCRICAO_KEY, JSON.stringify(lista));
}

function registrarSugestaoDescricao(texto) {
    const valor = String(texto || "").trim();
    if (!valor) return;

    const chave = valor.toLocaleLowerCase("pt-BR");
    if (sugestoesDescricaoMap.has(chave)) return;
    sugestoesDescricaoMap.set(chave, valor);
    salvarSugestoesDescricao();
}

function renderSugestoesDescricao() {
    const opcoes = Array.from(sugestoesDescricaoMap.values())
        .sort((a, b) => a.localeCompare(b, "pt-BR"));

    sugestoesServico.innerHTML = opcoes
        .map(opcao => `<option value="${escapeHtml(opcao)}"></option>`)
        .join("");
}

function carregarSugestoesDescricao() {
    carregarSugestoesDescricaoSalvas().forEach(registrarSugestaoDescricao);

    const servicos = getData().servicos || [];

    servicos.forEach(servico => {
        (servico.itens || []).forEach(item => {
            registrarSugestaoDescricao(item.descricao);
        });
    });

    renderSugestoesDescricao();
}

carregarSugestoesDescricao();

function normalizarPlaca(value) {
    const raw = String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (!raw) return "";

    if (/^[A-Z]{3}[0-9]{4}$/.test(raw)) {
        return `${raw.slice(0, 3)}-${raw.slice(3)}`;
    }

    if (/^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(raw)) {
        return raw;
    }

    return raw;
}

function placaValida(value) {
    if (!value) return true;
    return /^[A-Z]{3}-[0-9]{4}$/.test(value) || /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(value);
}

function normalizarKm(value) {
    const digitos = String(value || "").replace(/\D/g, "");
    if (!digitos) return "";
    return String(Number(digitos));
}

function formatarKm(value) {
    const km = normalizarKm(value);
    return km ? Number(km).toLocaleString("pt-BR") : "";
}

function carregarSugestoesModeloCarroServico() {
    const modelosUnicos = new Map();

    listarClientesAtivos().forEach(cliente => {
        const modelo = String(cliente.modeloCarro || "").trim();
        if (!modelo) return;

        const chave = modelo.toLocaleLowerCase("pt-BR");
        if (!modelosUnicos.has(chave)) {
            modelosUnicos.set(chave, modelo);
        }
    });

    sugestoesModeloCarroServico.innerHTML = Array.from(modelosUnicos.values())
        .sort((a, b) => a.localeCompare(b, "pt-BR"))
        .map(modelo => `<option value="${escapeHtml(modelo)}"></option>`)
        .join("");
}

function renderClienteOptions(filtroTexto) {
    const filtro = String(filtroTexto || "").trim().toLocaleLowerCase("pt-BR");
    const selecionadoAtual = clienteSelect.value;

    clienteSelect.innerHTML = '<option value="">Selecione um cliente</option>';

    const filtrados = clientesAtivos.filter(c => {
        if (!filtro) return true;
        const nome = String(c.nome || "").toLocaleLowerCase("pt-BR");
        const telefone = String(c.telefone || "").toLocaleLowerCase("pt-BR");
        const telefone2 = String(c.telefone2 || "").toLocaleLowerCase("pt-BR");
        return nome.includes(filtro) || telefone.includes(filtro) || telefone2.includes(filtro);
    });

    filtrados.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        const telefones = listarTelefonesCliente(c).join(" / ");
        opt.textContent = telefones ? `${c.nome} - ${telefones}` : c.nome;
        clienteSelect.appendChild(opt);
    });

    const existeSelecionado = filtrados.some(c => c.id === selecionadoAtual);
    clienteSelect.value = existeSelecionado ? selecionadoAtual : "";
}

/* ITENS */
formItem.onsubmit = e => {
    e.preventDefault();
    const estavaEditandoItem = itemEmEdicaoIndex >= 0;

    let desc;
    try {
        desc = validarTextoUsuario(itemDescricao.value, "Descricao do servico", 120);
    } catch (err) {
        alert(err.message || "Texto bloqueado por seguranca.");
        return;
    }
    const valor = parseValorBR(itemValor.value);
    const qtd = parseQtd(itemQtd.value);

    if (!desc || valor < 0) return;
    if (qtd < 1) {
        alert("Quantidade deve ser um numero inteiro maior ou igual a 1.");
        itemQtd.focus();
        return;
    }

    const subtotal = Number.isFinite(valor * qtd) ? (valor * qtd) : 0;
    const itemAtualizado = {
        descricao: desc,
        quantidade: qtd,
        valorUnitario: valor,
        total: subtotal
    };

    if (itemEmEdicaoIndex >= 0 && itens[itemEmEdicaoIndex]) {
        itens[itemEmEdicaoIndex] = itemAtualizado;
    } else {
        itens.push(itemAtualizado);
    }

    registrarSugestaoDescricao(desc);
    renderSugestoesDescricao();

    formItem.reset();
    itemQtd.value = 1;
    itemEmEdicaoIndex = -1;
    btnAdicionarItem.textContent = "Adicionar Item";
    renderItens();

    if (estavaEditandoItem) {
        sinalizarSalvarServico();
    }
};

function sinalizarSalvarServico() {
    const acao = btnSalvarServico.textContent.trim() || "Salvar Serviço";
    salvarServicoAlerta.textContent = `Alteração feita. Clique em "${acao}" para atualizar o orçamento.`;
    salvarServicoAlerta.classList.remove("hidden");
    btnSalvarServico.classList.add("btn-salvar-pendente");
}

function limparSinalizacaoSalvarServico() {
    salvarServicoAlerta.textContent = "";
    salvarServicoAlerta.classList.add("hidden");
    btnSalvarServico.classList.remove("btn-salvar-pendente");
}

function editarItemServico(index) {
    const item = itens[index];
    if (!item) return;

    const quantidade = Number(item?.quantidade);
    const valorUnitario = Number(item?.valorUnitario);
    const subtotal = Number(item?.total);
    const qtd = Number.isFinite(quantidade) && quantidade > 0 ? quantidade : 1;
    const unit = Number.isFinite(valorUnitario) && valorUnitario >= 0
        ? valorUnitario
        : (qtd > 0 && Number.isFinite(subtotal) ? (subtotal / qtd) : 0);

    itemEmEdicaoIndex = index;
    itemDescricao.value = item.descricao || "";
    itemValor.value = formatarMoedaBR(unit);
    itemQtd.value = String(qtd);
    btnAdicionarItem.textContent = "Salvar Item";
    itemDescricao.focus();
}

function removerItemServico(index) {
    if (!itens[index]) return;
    if (!confirm("Remover este item do serviço?")) return;

    itens.splice(index, 1);
    if (itemEmEdicaoIndex === index) {
        formItem.reset();
        itemQtd.value = 1;
        itemEmEdicaoIndex = -1;
        btnAdicionarItem.textContent = "Adicionar Item";
    } else if (itemEmEdicaoIndex > index) {
        itemEmEdicaoIndex -= 1;
    }
    renderItens();
    sinalizarSalvarServico();
}

function renderItens() {
    let total = 0;
    listaItens.innerHTML = "";

    if (!itens.length) {
        document.getElementById("itensResumo").classList.add("hidden");
        totalServicoEl.textContent = "0,00";
        return;
    }

    itens.forEach((i, index) => {
        const subtotal = Number(i?.total);
        const quantidade = Number(i?.quantidade);
        const valorUnitario = Number(i?.valorUnitario);
        const qtd = Number.isFinite(quantidade) && quantidade > 0 ? quantidade : 1;
        const unit = Number.isFinite(valorUnitario) && valorUnitario >= 0
            ? valorUnitario
            : (qtd > 0 && Number.isFinite(subtotal) ? (subtotal / qtd) : 0);
        total += Number.isFinite(subtotal) ? subtotal : 0;
        listaItens.innerHTML += `
            <div class="item-servico">
                <span class="item-servico-info">${escapeHtml(i.descricao)} (${qtd} x R$ ${formatarMoedaBR(unit)})</span>
                <span class="item-servico-acoes">
                    <span class="item-valor">R$ ${formatarMoedaBR(Number.isFinite(subtotal) ? subtotal : 0)}</span>
                    <button class="btn-item btn-item-editar" type="button" data-item-index="${index}">Editar</button>
                    <button class="btn-item btn-item-remover" type="button" data-item-index="${index}">Remover</button>
                </span>
            </div>
        `;
    });

    totalServicoEl.textContent = formatarMoedaBR(total);
    document.getElementById("itensResumo").classList.remove("hidden");

    listaItens.querySelectorAll(".btn-item-editar").forEach(btn => {
        btn.onclick = () => editarItemServico(Number(btn.dataset.itemIndex));
    });

    listaItens.querySelectorAll(".btn-item-remover").forEach(btn => {
        btn.onclick = () => removerItemServico(Number(btn.dataset.itemIndex));
    });
}

function getValorIntervaloSelect(servico) {

    if (servico.intervaloTipo === "nenhum") return "nenhum";
    if (servico.intervaloTipo === "semanas" && Number(servico.intervaloValor) === 1) return "semanal";
    if (servico.intervaloTipo === "meses" && Number(servico.intervaloValor) === 1) return "mensal";
    if (servico.intervaloTipo === "meses" && servico.intervaloValor) return String(servico.intervaloValor);

function atualizarOrcamentoDoServico(data, servico) {
    const orcamento = (data.orcamentos || []).find(
        o => o.id === servico.orcamentoId || o.origemServicoId === servico.id
    );
    if (!orcamento || orcamento.status === "aprovado") return;

    orcamento.cliente = servico.cliente;
    orcamento.itens = servico.itens;
    orcamento.total = servico.totalGeral;
    orcamento.observacoes = servico.observacoes || "";
    orcamento.formaPagamento = servico.formaPagamento || "";
    servico.orcamentoId = orcamento.id;
}

function iniciarEdicaoServico(servicoId) {
    const servico = (getData().servicos || []).find(s => s.id === servicoId);
    if (!servico || servico.status !== "pendente") return;

    const orcamento = (getData().orcamentos || []).find(
        o => o.id === servico.orcamentoId || o.origemServicoId === servico.id
    );
    if (orcamento?.status === "aprovado") {
        alert("Este orçamento já foi aprovado e não pode ser editado por aqui.");
        return;
    }

    servicoEmEdicaoId = servico.id;
    itens.length = 0;
    (servico.itens || []).forEach(item => itens.push({ ...item }));

    const clienteId = servico.cliente?.id || "";
    const cliente = clientesAtivos.find(c => c.id === clienteId);
    clienteBusca.value = cliente?.nome || servico.cliente?.nome || "";
    renderClienteOptions(clienteBusca.value);
    clienteSelect.value = clienteId;
    renderResumoClienteSelecionado();
    if (modoMecanica) {
        servicoModeloCarro.value = servico.cliente?.modeloCarro || "";
        servicoPlacaCarro.value = servico.cliente?.placaCarro || "";
        servicoCorCarro.value = servico.cliente?.corCarro || "";
        servicoKmCarro.value = formatarKm(servico.cliente?.kmCarro);
        veiculoServicoBox.classList.remove("hidden");
    }

    observacoesServico.value = servico.observacoes || "";
    problemaRelatadoServico.value = servico.problemaRelatado || "";
    formaPagamento.value = servico.formaPagamento || "";
    intervaloSelect.value = getValorIntervaloSelect(servico);
    btnSalvarServico.textContent = "Salvar alterações";
    renderItens();
    renderProblemaRelatadoPro();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

    let intervaloTipo = "meses";
let intervaloValor = 6;

    const clienteServico = {

        nome: c.nome,
        telefone: c.telefone || "",

        placaCarro: modoMecanica ? placaCarroServico : "",
        corCarro: modoMecanica ? corCarroServico : "",

    };

    if (servicoEmEdicaoId) {

        const clienteCadastro = (data.clientes || []).find(cliente => cliente.id === c.id && !cliente.arquivado);
        if (dadosVeiculoAtualizados && clienteCadastro) {

        servico.cliente = clienteServico;

        servico.totalGeral = totalGeral;
        if (usuarioPodeUsarProblemaRelatado()) {
            servico.problemaRelatado = problemaRelatadoSeguro;

        servico.observacoes = observacoesSeguras;
        servico.formaPagamento = formaPagamento.value || "";

        saveData(data);

        limparFormularioServico();

    const data = getData();

    });

};

/* LISTA */
function renderServicos() {
    listaServicos.innerHTML = "";
    const data = getData();
    const servicos = data.servicos || [];
    const orcamentos = data.orcamentos || [];

    if (!servicos.length) {
        listaServicos.innerHTML = "<p>Nenhum serviço cadastrado</p>";
        return;
    }

    function getDataServicoValor(servico) {
        const dataBase = new Date(servico.criadoEm || servico.atualizadoEm || Date.now());
        return Number.isNaN(dataBase.getTime()) ? new Date() : dataBase;
    }

    function getChaveMes(dataServico) {
        return `${dataServico.getFullYear()}-${String(dataServico.getMonth() + 1).padStart(2, "0")}`;
    }

    function getTituloMes(dataServico) {
        const titulo = dataServico.toLocaleDateString("pt-BR", {
            month: "long",
            year: "numeric"
        });
        return titulo.charAt(0).toLocaleUpperCase("pt-BR") + titulo.slice(1);
    }

    function getOrcamentoDoServico(servico) {
        return orcamentos.find(o => o.origemServicoId === servico.id);
    }

    function servicoPrecisaAtencao(servico) {
        const orcamento = getOrcamentoDoServico(servico);
        return servico.status === "pendente" && orcamento?.status !== "aprovado";
    }

    const servicosOrdenados = servicos
        .slice()
        .sort((a, b) => getDataServicoValor(b) - getDataServicoValor(a));

    const gruposPorMes = new Map();

    servicosOrdenados.forEach(s => {
        const dataServicoValor = getDataServicoValor(s);
        const chaveMes = getChaveMes(dataServicoValor);
        if (!gruposPorMes.has(chaveMes)) {
            gruposPorMes.set(chaveMes, {
                titulo: getTituloMes(dataServicoValor),
                servicos: [],
                total: 0,
                emAberto: 0,
                maisRecente: dataServicoValor
            });
        }

        const grupo = gruposPorMes.get(chaveMes);
        grupo.servicos.push(s);
        grupo.total += Number(s.totalGeral) || 0;
        if (servicoPrecisaAtencao(s)) grupo.emAberto += 1;
        if (dataServicoValor > grupo.maisRecente) grupo.maisRecente = dataServicoValor;
    });

    Array.from(gruposPorMes.values())
        .sort((a, b) => b.maisRecente - a.maisRecente)
        .forEach(grupo => {
            const deveAbrir = grupo.emAberto > 0;
            const totalServicos = grupo.servicos.length;
            const textoServicos = `${totalServicos} ${totalServicos === 1 ? "serviço" : "serviços"}`;
            const textoAbertos = grupo.emAberto
                ? ` • ${grupo.emAberto} ${grupo.emAberto === 1 ? "em aberto" : "em aberto"}`
                : "";

            listaServicos.innerHTML += `
                <details class="servicos-mes" ${deveAbrir ? "open" : ""}>
                    <summary>
                        <span>${escapeHtml(grupo.titulo)}</span>
                        <span class="servicos-mes-meta">
                            ${textoServicos}${textoAbertos}<br>
                            R$ ${formatarMoedaBR(grupo.total)}
                        </span>
                    </summary>
                    <div class="servicos-mes-lista">
                        ${grupo.servicos.map(s => {
        const dataServico = getDataServicoValor(s).toLocaleDateString("pt-BR");
        const orcamentoExistente = getOrcamentoDoServico(s);
        const orcamentoRecusado = orcamentoExistente?.status === "recusado";
        const podeEditar = s.status === "pendente" && orcamentoExistente?.status !== "aprovado";
        const aguardandoAprovacao = servicoPrecisaAtencao(s);
        const temItensServico = Array.isArray(s.itens) && s.itens.length > 0;
        const textoBotaoOrcamento = orcamentoExistente
            ? "📄 Abrir orçamento"
            : "📄 Gerar orçamento";
        const servicoIdAttr = escapeHtml(s.id);
        const orcamentoIdAttr = escapeHtml(orcamentoExistente?.id || "");

        return `
            <div class="resumo-card servico-cadastrado-card ${
                aguardandoAprovacao
                    ? "servico-em-aberto"
                    : orcamentoRecusado
                    ? "card-servico-recusado"
                    : s.status === "executado"
                    ? "card-servico-executado"
                    : "card-servico-pendente"
            }">
                <strong>${escapeHtml(s.cliente.nome)}</strong><br>
                <small>${dataServico}</small><br>
                Total: <strong>R$ ${formatarMoedaBR(s.totalGeral)}</strong><br>

                ${
                    usuarioPodeUsarProblemaRelatado() && s.problemaRelatado
                    ? `<span class="problema-relatado"><strong>Problema:</strong> ${escapeHtml(s.problemaRelatado)}</span>`
                    : ""
                }
                ${s.observacoes ? `<em>📝 ${escapeHtml(s.observacoes)}</em><br>` : ""}
                ${s.formaPagamento ? `<em>💳 ${escapeHtml(s.formaPagamento)}</em><br>` : ""}
                ${!temItensServico ? `<span class="servico-alerta-cadastro">Cadastro inicial: complete os itens e valores antes do orçamento</span><br>` : ""}
                ${aguardandoAprovacao ? `<span class="servico-alerta-aprovacao">Aguardando aprovação do cliente</span><br>` : ""}

                <span class="status-${s.status}">
                    ${orcamentoRecusado ? "❌ Recusado" :
                      s.status === "pendente" ? "⏳ Pendente" :
                      s.status === "executado" ? "✔ Executado" :
                      "🔁 Corrigido"}
                </span><br>

                ${
                    temItensServico
                    ? `<button class="btn-orcamento btn-gerar-orcamento"
                        data-servico-id="${servicoIdAttr}"
                        data-orcamento-id="${orcamentoIdAttr}">
                        ${textoBotaoOrcamento}
                    </button>`
                    : ""
                }

                ${
                    podeEditar
                    ? `<button class="btn-editar" data-servico-id="${servicoIdAttr}">
                        ✏️ Editar serviço
                       </button>`
                    : ""
                }

                ${
                    s.status === "pendente" && !orcamentoRecusado
                    ? `<button class="btn-executar-servico" data-servico-id="${servicoIdAttr}">
                        ▶️ Executar serviço
                       </button>`
                    : (s.status === "executado" || orcamentoRecusado)
                    ? `<button class="btn-corrigir"
                        data-servico-id="${servicoIdAttr}">
                        🗑️ Apagar serviço
                       </button>`
                    : ""
                }
            </div>
        `;
                        }).join("")}
                    </div>
                </details>
            `;
        });

    listaServicos.querySelectorAll(".btn-gerar-orcamento").forEach(btn => {
        btn.onclick = () => {
            const orcamentoId = btn.dataset.orcamentoId || "";
            if (orcamentoId) {
                location.href = "orcamento.html?id=" + encodeURIComponent(orcamentoId);
                return;
            }

            const n = gerarOrcamentoDoServico(btn.dataset.servicoId);
            if (n) {
                const o = getData().orcamentos.find(x => x.numero === n);
                if (o) location.href = "orcamento.html?id=" + encodeURIComponent(o.id);
            }
        };
    });

    listaServicos.querySelectorAll(".btn-editar").forEach(btn => {
        btn.onclick = () => iniciarEdicaoServico(btn.dataset.servicoId);
    });

    listaServicos.querySelectorAll(".btn-executar-servico").forEach(btn => btn.remove());

    listaServicos.querySelectorAll(".btn-corrigir").forEach(btn => {
        btn.onclick = () => {
            const confirmar = confirm(
                "Apagar este serviço?\n\n" +
                "O serviço sairá da lista e os registros ligados a ele serão removidos. " +
                "Esta ação ficará registrada no histórico de correções."
            );
            if (!confirmar) return;
            estornarServico(btn.dataset.servicoId);
            renderServicos();
        };
    });
}

window.addEventListener("senso-live-update", () => {
    renderClienteOptions(clienteBusca.value || "");
    renderServicos();
    renderProblemaRelatadoPro();
});

window.addEventListener("senso-plan-ready", () => {
    renderProblemaRelatadoPro();
    renderServicos();
});

renderProblemaRelatadoPro();
aplicarTextoProblemaRelatado();
renderServicos();

const servicoEditarParam = new URLSearchParams(location.search).get("editar");
if (servicoEditarParam) {
    iniciarEdicaoServico(servicoEditarParam);
}
</script>
</body>
</html>
