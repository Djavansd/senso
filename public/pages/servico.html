<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Serviço</title>

<link rel="stylesheet" href="../css/style.css" />

<style>
.hidden { display:none; }

.resumo-card {
    background:#fff;
    border-radius:14px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.06);
    font-size:14px;
}

.item-servico {
    background:#f5f5f5;
    border-radius:10px;
    padding:6px 8px;
    margin-bottom:4px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

.item-valor { font-weight:bold; color:#0f9d58; }

.status-pendente { color:#f57c00; font-weight:bold; }
.status-executado { color:#0f9d58; font-weight:bold; }
.status-estornado { color:#777; }

.toggle-itens {
    font-size:12px;
    color:#1976d2;
    cursor:pointer;
    margin-top:6px;
    display:inline-block;
}

.cliente-mini {
    font-size:13px;
    color:#555;
    margin-top:4px;
}

.btn-corrigir {
    margin-top:6px;
    background:#fff3cd;
    color:#856404;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

.btn-orcamento {
    margin-top:6px;
    background:#e3f2fd;
    color:#0d47a1;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

button {
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
}

button:hover,
button:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 10px 18px rgba(15, 23, 42, 0.14);
    filter: saturate(1.05);
}

button:active {
    transform: scale(0.98);
    box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
    button,
    .btn-orcamento,
    .btn-corrigir {
        transition: none;
    }
}

textarea {
    width: 100%;
    min-height: 70px;
    resize: vertical;
}
</style>
</head>

<body>
<div class="app">
<div class="header">Serviço</div>

<div class="content">

<h3>Serviço • Passo 1</h3>

<label>Cliente</label>
<input id="clienteBusca" placeholder="Buscar cliente por nome, sobrenome ou telefone" autocomplete="off" />
<select id="clienteSelect">
    <option value="">Selecione um cliente</option>
</select>

<div id="clienteResumo" class="resumo-card hidden"></div>

<hr />

<h3>Serviço • Passo 2</h3>

<form id="formItem" class="servico-card" autocomplete="on">
    <label>Descrição do serviço</label>
    <input id="itemDescricao" name="descricaoServico" list="sugestoesServico" required autocomplete="on" />
    <datalist id="sugestoesServico"></datalist>

    <label>Valor unitário</label>
    <input id="itemValor" required />

    <label>Quantidade</label>
    <input id="itemQtd" type="number" value="1" min="1" required />

    <button type="submit">Adicionar Item</button>
</form>

<div id="itensResumo" class="hidden">
    <div id="listaItens"></div>
    <h4>Total do Serviço: R$ <span id="totalServico">0,00</span></h4>
</div>

<label style="margin-top:10px;">Observações do serviço (opcional)</label>
<textarea id="observacoesServico"
 placeholder="Ex: Equipamento muito sujo, acesso difícil, valor válido por 10 dias..."></textarea>

<!-- ✅ CAMPO QUE FALTAVA -->
<label style="margin-top:10px;">Forma de pagamento</label>
<select id="formaPagamento">
    <option value="">Não informado</option>
    <option>Pix</option>
    <option>Dinheiro</option>
    <option>Crédito</option>
    <option>Cartão de débito</option>
    <option>Transferência</option>
</select>

<div style="margin-top:12px;">
<label style="font-size:13px;">Retorno / Manutenção (opcional)</label>
<select id="intervaloSelect">
    <option value="">Padrão (6 meses)</option>
    <option value="nenhum">Nenhum</option>
    <option value="semanal">Semanal</option>
    <option value="mensal">Mensal</option>
    <option value="3">3 meses</option>
    <option value="6">6 meses</option>
    <option value="12">12 meses</option>
</select>

</div>

<button type="button" id="btnSalvarServico">Salvar Serviço</button>

<hr />

<h3>Serviços cadastrados</h3>
<div id="listaServicos"></div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/core/profile.js"></script>
<script src="../js/domains/mecanica/domain.js"></script>
<script src="../js/app.js"></script>

<script>
const clienteBusca = document.getElementById("clienteBusca");
const clienteSelect = document.getElementById("clienteSelect");
const clienteResumo = document.getElementById("clienteResumo");
const listaItens = document.getElementById("listaItens");
const totalServicoEl = document.getElementById("totalServico");
const listaServicos = document.getElementById("listaServicos");
const intervaloSelect = document.getElementById("intervaloSelect");
const observacoesServico = document.getElementById("observacoesServico");
const formaPagamento = document.getElementById("formaPagamento");
const sugestoesServico = document.getElementById("sugestoesServico");
const itemDescricao = document.getElementById("itemDescricao");
const itemValor = document.getElementById("itemValor");
const itemQtd = document.getElementById("itemQtd");

const itens = [];
const sugestoesDescricaoMap = new Map();
const clientesAtivos = listarClientesAtivos();
const activeProfileId = (
    window.SensoProfile &&
    typeof window.SensoProfile.getActiveProfile === "function" &&
    window.SensoProfile.getActiveProfile()?.id
) ? window.SensoProfile.getActiveProfile().id : "base";
const SUGESTOES_DESCRICAO_KEY = `servicoSugestoesDescricao:${activeProfileId}`;

function carregarSugestoesDescricaoSalvas() {
    try {
        const raw = localStorage.getItem(SUGESTOES_DESCRICAO_KEY);
        const lista = JSON.parse(raw || "[]");
        if (!Array.isArray(lista)) return [];
        return lista.map(v => String(v || "").trim()).filter(Boolean);
    } catch {
        return [];
    }
}

function salvarSugestoesDescricao() {
    const lista = Array.from(sugestoesDescricaoMap.values());
    localStorage.setItem(SUGESTOES_DESCRICAO_KEY, JSON.stringify(lista));
}

function registrarSugestaoDescricao(texto) {
    const valor = String(texto || "").trim();
    if (!valor) return;

    const chave = valor.toLocaleLowerCase("pt-BR");
    if (sugestoesDescricaoMap.has(chave)) return;
    sugestoesDescricaoMap.set(chave, valor);
    salvarSugestoesDescricao();
}

function renderSugestoesDescricao() {
    const opcoes = Array.from(sugestoesDescricaoMap.values())
        .sort((a, b) => a.localeCompare(b, "pt-BR"));

    sugestoesServico.innerHTML = opcoes
        .map(opcao => `<option value="${opcao.replace(/"/g, "&quot;")}"></option>`)
        .join("");
}

function carregarSugestoesDescricao() {
    carregarSugestoesDescricaoSalvas().forEach(registrarSugestaoDescricao);

    const servicos = getData().servicos || [];

    servicos.forEach(servico => {
        (servico.itens || []).forEach(item => {
            registrarSugestaoDescricao(item.descricao);
        });
    });

    renderSugestoesDescricao();
}

carregarSugestoesDescricao();

/* CLIENTES */
function renderClienteOptions(filtroTexto) {
    const filtro = String(filtroTexto || "").trim().toLocaleLowerCase("pt-BR");
    const selecionadoAtual = clienteSelect.value;

    clienteSelect.innerHTML = '<option value="">Selecione um cliente</option>';

    const filtrados = clientesAtivos.filter(c => {
        if (!filtro) return true;
        const nome = String(c.nome || "").toLocaleLowerCase("pt-BR");
        const telefone = String(c.telefone || "").toLocaleLowerCase("pt-BR");
        return nome.includes(filtro) || telefone.includes(filtro);
    });

    filtrados.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.telefone ? `${c.nome} - ${c.telefone}` : c.nome;
        clienteSelect.appendChild(opt);
    });

    const existeSelecionado = filtrados.some(c => c.id === selecionadoAtual);
    clienteSelect.value = existeSelecionado ? selecionadoAtual : "";
}

function renderResumoClienteSelecionado() {
    const c = clientesAtivos.find(x => x.id === clienteSelect.value);
    if (!c) {
        clienteResumo.classList.add("hidden");
        return;
    }

    clienteResumo.innerHTML = `
        <strong>${c.nome}</strong><br>
        <div class="cliente-mini">
            📞 ${c.telefone || "—"}<br>
            📍 ${c.endereco || "—"}<br>
            📄 ${formatarDocumentoBR(c.documento) || "—"}<br>
            🚗 ${c.modeloCarro || "—"}<br>
            🔖 ${c.placaCarro || "—"}<br>
            🎨 ${c.corCarro || "—"}
        </div>
    `;
    clienteResumo.classList.remove("hidden");
}

renderClienteOptions("");

clienteBusca.addEventListener("input", () => {
    renderClienteOptions(clienteBusca.value);
    renderResumoClienteSelecionado();
});

clienteSelect.onchange = () => {
    renderResumoClienteSelecionado();
};

/* ITENS */
formItem.onsubmit = e => {
    e.preventDefault();

    const desc = itemDescricao.value.trim();
    const valor = Number(itemValor.value.replace(",", "."));
    const qtd = Number(itemQtd.value);

    if (!desc || valor <= 0 || qtd <= 0) return;

    itens.push({ descricao: desc, total: valor * qtd });
    registrarSugestaoDescricao(desc);
    renderSugestoesDescricao();

    formItem.reset();
    itemQtd.value = 1;
    renderItens();
};

function renderItens() {
    let total = 0;
    listaItens.innerHTML = "";

    itens.forEach(i => {
        total += i.total;
        listaItens.innerHTML += `
            <div class="item-servico">
                <span>${i.descricao}</span>
                <span class="item-valor">R$ ${formatarMoedaBR(i.total)}</span>
            </div>
        `;
    });

    totalServicoEl.textContent = formatarMoedaBR(total);
    document.getElementById("itensResumo").classList.remove("hidden");
}

/* SALVAR SERVIÇO */
btnSalvarServico.onclick = () => {
    if (!clienteSelect.value || itens.length === 0) return;

    let intervaloTipo = "meses";
let intervaloValor = 6;

// 👇 exceção explícita
if (intervaloSelect.value === "nenhum") {
    intervaloTipo = "nenhum";
    intervaloValor = 0;

} else if (intervaloSelect.value === "semanal") {
    intervaloTipo = "semanas";
    intervaloValor = 1;

} else if (intervaloSelect.value === "mensal") {
    intervaloTipo = "meses";
    intervaloValor = 1;

} else if (intervaloSelect.value) {
    intervaloTipo = "meses";
    intervaloValor = Number(intervaloSelect.value);
}


    const c = clientesAtivos.find(x => x.id === clienteSelect.value);

    salvarServico({
        id: gerarId(),
        cliente: {
            id: c.id,
            nome: c.nome,
            telefone: c.telefone || "",
            endereco: c.endereco || "",
            documento: c.documento || "",
            modeloCarro: c.modeloCarro || "",
            placaCarro: c.placaCarro || "",
            corCarro: c.corCarro || ""
        },
        itens: itens.slice(),
        totalGeral: itens.reduce((s,i)=>s+i.total,0),
        observacoes: observacoesServico.value.trim(),
        formaPagamento: formaPagamento.value || "",
        status: "pendente",
        intervaloTipo,
        intervaloValor,
        criadoEm: new Date().toISOString()
    });

    itens.length = 0;
    observacoesServico.value = "";
    formaPagamento.value = "";
    clienteBusca.value = "";
    clienteSelect.value = "";
    clienteResumo.classList.add("hidden");
    document.getElementById("itensResumo").classList.add("hidden");
    intervaloSelect.value = "";
    renderClienteOptions("");

    renderServicos();
};

/* LISTA */
function renderServicos() {
    listaServicos.innerHTML = "";
    const servicos = getData().servicos;

    if (!servicos.length) {
        listaServicos.innerHTML = "<p>Nenhum serviço cadastrado</p>";
        return;
    }

    servicos.forEach(s => {
        const data = new Date(s.criadoEm).toLocaleDateString("pt-BR");
        const orcamentoExistente = (getData().orcamentos || [])
            .find(o => o.origemServicoId === s.id);
        const orcamentoRecusado = orcamentoExistente?.status === "recusado";
        const acaoOrcamento = orcamentoExistente
            ? `location.href='orcamento.html?id=${orcamentoExistente.id}'`
            : `
                        const n = gerarOrcamentoDoServico('${s.id}');
                        if(n){
                          const o = getData().orcamentos.find(x=>x.numero===n);
                          if(o) location.href='orcamento.html?id='+o.id;
                        }
                    `;
        const textoBotaoOrcamento = orcamentoExistente
            ? "📄 Abrir orçamento"
            : "📄 Gerar orçamento";

        listaServicos.innerHTML += `
            <div class="resumo-card">
                <strong>${s.cliente.nome}</strong><br>
                <small>${data}</small><br>
                Total: <strong>R$ ${formatarMoedaBR(s.totalGeral)}</strong><br>

                ${s.observacoes ? `<em>📝 ${s.observacoes}</em><br>` : ""}
                ${s.formaPagamento ? `<em>💳 ${s.formaPagamento}</em><br>` : ""}

                <span class="status-${s.status}">
                    ${orcamentoRecusado ? "❌ Recusado" :
                      s.status === "pendente" ? "⏳ Pendente" :
                      s.status === "executado" ? "✔ Executado" :
                      "🔁 Corrigido"}
                </span><br>

                <button class="btn-orcamento"
                    onclick="${acaoOrcamento}">
                    ${textoBotaoOrcamento}
                </button>

                ${
                    s.status === "pendente" && !orcamentoRecusado
                    ? `<button onclick="executarServico('${s.id}'); renderServicos();">
                        ▶️ Executar serviço
                       </button>`
                    : (s.status === "executado" || orcamentoRecusado)
                    ? `<button class="btn-corrigir"
                        onclick="estornarServico('${s.id}'); renderServicos();">
                        ⚠️ Corrigir serviço
                       </button>`
                    : ""
                }
            </div>
        `;
    });

    listaServicos
        .querySelectorAll('button[onclick*="executarServico("]')
        .forEach(btn => btn.remove());
}

window.addEventListener("senso-live-update", () => {
    renderClienteOptions(clienteBusca.value || "");
    renderServicos();
});

renderServicos();
</script>
</body>
</html>
