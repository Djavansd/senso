<html lang="pt-BR">
<head>

<style>
body { background:#eee; }
.orcamento {
    background:#fff;
    max-width:800px;
    margin:16px auto;
    padding:16px;
    border:1px solid #ccc;
    font-size:14px;
    box-sizing:border-box;
}
.cabecalho {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    border-bottom:1px solid #000;
    padding-bottom:10px;
}
.empresa {
    font-size:14px;
    line-height:1.45;
    flex:1;
    min-width:0;
}
.empresa strong {
    font-size:15px;
}
#orcamentoLogo {
    height:120px !important;
    max-height:120px !important;
    max-width:340px !important;
    margin-bottom:10px !important;
}
.caixa-data {
    flex-shrink:0;
    border:1px solid #000;
    padding:6px 10px;
    text-align:center;
    font-size:13px;
}
.cabecalho-lateral {
    width:240px;
    flex-shrink:0;
}
.info-opcionais {
    display:none;
    position:relative;
    border:1px solid #c9c9c9;
    border-radius:6px;
    margin-top:8px;
    padding:7px 8px 8px 12px;
    font-size:11px;
    line-height:1.35;
    background:#fff;
    overflow:hidden;
}
.info-opcionais::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:var(--app-primary);
}
.info-opcionais strong {
    display:inline-block;
    margin:0 0 5px;
    padding:2px 7px;
    background:var(--app-primary);
    color:#fff;
    border-radius:999px;
    font-size:11px;
    line-height:1.2;
}
.bloco {
    border:1px solid #000;
    margin-top:10px;
    padding:8px;
    font-size:13px;
}
.bloco-flex {
    display:flex;
    justify-content:space-between;
    gap:10px;
}
.bloco-flex .bloco {
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
    word-break:break-word;
}
.titulo {
    background:var(--app-primary);
    color:#fff;
    padding:6px;
    margin-top:12px;
    text-align:center;
    font-weight:bold;
}
table {
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    table-layout: fixed;
}
th, td {
    border:1px solid #000;
    padding:6px;
    font-size:13px;
    word-break:break-word;
    overflow-wrap:anywhere;
}
th { background:#e6eef6; }
.total {
    background:var(--app-primary);
    color:#fff;
    padding:8px;
    font-weight:bold;
    text-align:right;
    margin-top:6px;
}
.observacoes {
    border:1px solid #000;
    min-height:120px;
    height:auto;
    margin-top:8px;
    padding:6px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.4;
    break-inside:auto;
    page-break-inside:auto;
}
.cabecalho,
.bloco-flex,
.titulo,
.total,
table tr {
    break-inside: avoid;
    page-break-inside: avoid;
}
.botoes {
    margin-top:12px;
    display:flex;
    gap:10px;
}
.btn {
    flex:1;
    min-height:46px;
    padding:10px 12px;
    border-radius:12px;
    border:none;
    font-weight:bold;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
.btn[hidden],
#btnAgendarDepois[hidden] {
    display:none !important;
}
.btn:not(:disabled):hover,
.btn:not(:disabled):focus-visible {
    transform:translateY(-1px);
    filter:brightness(1.03);
}
.btn-voltar {
    background:#f8fafc;
    color:#334155;
    border:1px solid #cbd5e1;
    box-shadow:0 3px 8px rgba(15,23,42,.08);
}
.btn-pdf {
    background:linear-gradient(135deg, #1677e8, #2563eb);
    color:#fff;
    box-shadow:0 6px 13px rgba(37,99,235,.23);
}
.btn-whatsapp {
    background:linear-gradient(135deg, #20b95b, #16a34a);
    color:#fff;
    box-shadow:0 6px 13px rgba(22,163,74,.22);
}
#btnEditar:not(:disabled) {
    background:#2563eb;
    color:#fff;
    box-shadow:0 0 0 0 rgba(37,99,235,.42), 0 5px 12px rgba(37,99,235,.28);
    animation:botao-disponivel-azul 2.2s ease-in-out infinite;
}
#btnAprovar:not(:disabled) {
    background:#15803d;
    color:#fff;
    box-shadow:0 0 0 0 rgba(21,128,61,.42), 0 5px 12px rgba(21,128,61,.28);
    animation:botao-disponivel-verde 2.2s ease-in-out infinite;
}
#btnRecusar:not(:disabled) {
    background:#dc2626;
    color:#fff;
    border-color:#b91c1c;
}
#btnAgendarDepois {
    min-height:40px;
    padding:9px 16px;
    border:1px solid #34a879;
    border-radius:999px;
    background:linear-gradient(135deg, #ecfdf5, #d1fae5);
    color:#08754d;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(16,185,129,.14);
    transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
#btnAgendarDepois:hover,
#btnAgendarDepois:focus-visible {
    transform:translateY(-1px);
    filter:brightness(1.02);
    box-shadow:0 6px 14px rgba(16,185,129,.20);
}
.btn-disabled {
    background:#ddd !important;
    cursor:not-allowed;
}
#btnEditar.btn-disabled {
    background:#dbeafe !important;
    color:#1d4ed8 !important;
    border:1px solid #93c5fd;
    opacity:1;
    box-shadow:none;
    animation:none;
}
#btnAprovar.btn-disabled {
    background:#dcfce7 !important;
    color:#15803d !important;
    border:1px solid #86efac;
    opacity:1;
    box-shadow:none;
    animation:none;
}
#btnRecusar.btn-disabled {
    background:#fee2e2 !important;
    color:#b91c1c !important;
    border:1px solid #fca5a5;
    opacity:1;
}
@keyframes botao-disponivel-azul {
    50% { box-shadow:0 0 0 5px rgba(37,99,235,.10), 0 6px 14px rgba(37,99,235,.32); }
}
@keyframes botao-disponivel-verde {
    50% { box-shadow:0 0 0 5px rgba(21,128,61,.10), 0 6px 14px rgba(21,128,61,.32); }
}
@media (prefers-reduced-motion:reduce) {
    #btnEditar:not(:disabled),
    #btnAprovar:not(:disabled) { animation:none; }
}
#statusPdf {
    display:none !important;
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:#f1f3f4;
    font-size:13px;
}
.loader {
    width:16px;
    height:16px;
    border:3px solid #ccc;
    border-top:3px solid #1976d2;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

@media (max-width: 480px) {
    .empresa {
        font-size:13px;
        line-height:1.4;
    }

    .empresa strong {
        font-size:14px;
    }

    #orcamentoLogo {
        height:96px !important;
        max-height:96px !important;
        max-width:260px !important;
        margin-bottom:8px !important;
    }

    .cabecalho {
        flex-wrap:wrap;
    }

    .cabecalho-lateral {
        width:100%;
    }

    .botoes {
        display:grid;
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:8px;
    }

    .botoes .btn {
        min-width:0;
        padding:10px 6px;
        font-size:13px;
        line-height:1.2;
    }

    .botoes .btn-voltar:last-child {
        grid-column:1 / -1;
    }
}

@media print {
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    body {
        background: #fff !important;
    }

    .orcamento {
        background: #fff !important;
        border: none !important;
        margin: 0 !important;
        max-width: 100% !important;
    }

    .titulo,
    .total {
        background: var(--app-primary) !important;
        color: #fff !important;
    }

    th {
        background: #e6eef6 !important;
        color: #000 !important;
    }

    .botoes,
    #statusPdf {
        display: none !important;
    }
}

</style>

<script>
const id = new URLSearchParams(location.search).get("id");
const data = getData();
const orc = data.orcamentos.find(o => o.id === id);
const clienteCadastro = (data.clientes || []).find(c => c.id === orc?.cliente?.id);
const clienteDados = {
    ...(orc?.cliente || {}),
    ...(clienteCadastro || {})
};
["modeloCarro", "placaCarro", "corCarro"].forEach(campo => {
    if (orc?.cliente && Object.prototype.hasOwnProperty.call(orc.cliente, campo)) {
        clienteDados[campo] = orc.cliente[campo] || "";
    }
});
const modoMecanica = window.SensoProfile?.usesVehicleFields?.() === true;
const settingsOrcamento = getAppSettings();
const servicosCabecalhoOrcamento = String(settingsOrcamento.headerServices || "").trim().slice(0, 120);

window.addEventListener("senso-live-update", event => {
    if (event?.detail?.source !== "cloud-settings-hydrate" && event?.detail?.source !== "save-settings") return;
    const settingsAtualizados = getAppSettings();
    applyBudgetCompanyInfo(settingsAtualizados);
    applyBudgetLogo(settingsAtualizados.logoDataUrl);
});

function resolverValoresItem(item) {
    const toNumberFlexible = (value) => {
        if (typeof value === "number") return value;
        if (typeof value === "string") {
            const normalized = value.trim().replace(/\s+/g, "").replace(",", ".");
            const num = Number(normalized);
            return Number.isFinite(num) ? num : NaN;
        }
        const num = Number(value);
        return Number.isFinite(num) ? num : NaN;
    };

    const subtotalRaw = toNumberFlexible(item?.total);
    const subtotal = Number.isFinite(subtotalRaw) && subtotalRaw >= 0 ? subtotalRaw : 0;

    const qtdRaw = toNumberFlexible(item?.quantidade ?? item?.qtd);
    const quantidade = Number.isFinite(qtdRaw) && qtdRaw > 0 ? Math.trunc(qtdRaw) : 1;

    const unitRaw = toNumberFlexible(item?.valorUnitario ?? item?.valor);
    const valorUnitario = Number.isFinite(unitRaw) && unitRaw >= 0
        ? unitRaw
        : (quantidade > 0 ? (subtotal / quantidade) : subtotal);

    return { quantidade, valorUnitario, subtotal };
}

function formatarQuantidade(qtd) {
    const inteira = Math.trunc(Number(qtd) || 0);
    return String(inteira > 0 ? inteira : 1);
}

function sincronizarItensOrcamentoComServico() {
    const servicoOrigem = (data.servicos || []).find(s => s.id === orc?.origemServicoId);
    if (!servicoOrigem || !Array.isArray(servicoOrigem.itens) || !Array.isArray(orc?.itens)) return;

    let alterou = false;
    orc.itens = orc.itens.map((itemOrc, idx) => {
        const itemServico = servicoOrigem.itens[idx];
        if (!itemServico) return itemOrc;

        const qtdFaltando = itemOrc?.quantidade == null && itemOrc?.qtd == null;
        const valorFaltando = itemOrc?.valorUnitario == null && itemOrc?.valor == null;
        if (!qtdFaltando && !valorFaltando) return itemOrc;

        alterou = true;
        return {
            ...itemOrc,
            quantidade: qtdFaltando ? itemServico?.quantidade ?? itemServico?.qtd : itemOrc.quantidade,
            valorUnitario: valorFaltando ? itemServico?.valorUnitario ?? itemServico?.valor : itemOrc.valorUnitario
        };
    });

    if (alterou) saveData(data);
}

sincronizarItensOrcamentoComServico();


if (!orc) {
    alert("Orçamento não encontrado");
    history.back();
    throw new Error("Orcamento nao encontrado");
}

dataEmissao.textContent = new Date(orc.criadoEm).toLocaleDateString("pt-BR");
clienteNome.textContent = clienteDados.nome || "—";
clienteDoc.textContent = formatarDocumentoBR(clienteDados.documento) || "—";
clienteEndereco.textContent = clienteDados.endereco || "—";
clienteTelefone.textContent = listarTelefonesCliente(clienteDados).join(" / ") || "—";
clienteModeloCarro.textContent = clienteDados.modeloCarro || "—";
clientePlacaCarro.textContent = clienteDados.placaCarro || "—";
clienteCorCarro.textContent = clienteDados.corCarro || "—";
formaPagamento.textContent = orc.formaPagamento || "—";

if (!modoMecanica) {
    linhaClienteModelo.style.display = "none";
    linhaClientePlaca.style.display = "none";
    linhaClienteCor.style.display = "none";
}

if (servicosCabecalhoOrcamento) {
    infoOpcionaisBox.style.display = "block";
    infoOpcionaisTexto.textContent = servicosCabecalhoOrcamento;
}

tabelaItens.innerHTML = "";
orc.itens.forEach(i => {
    const { quantidade, valorUnitario, subtotal } = resolverValoresItem(i);
    tabelaItens.innerHTML += `
        <tr>
            <td>${i.descricao}</td>
            <td>${formatarQuantidade(quantidade)}</td>
            <td>R$ ${formatarMoedaBR(valorUnitario)}</td>
            <td>R$ ${formatarMoedaBR(subtotal)}</td>
        </tr>
    `;
});

valorTotal.textContent = formatarMoedaBR(orc.total);
const textoObs = (orc.observacoes || "—");
obsBox.innerHTML = "<strong>OBSERVAÇÕES:</strong><br>";
obsBox.appendChild(document.createTextNode(textoObs));

function atualizarAcoesOrcamentoDecidido() {
    const dadosAtuais = getData();
    const servicoOrigem = (dadosAtuais.servicos || []).find(servico => servico.id === orc.origemServicoId);
    const statusOrcamento = String(orc.status || "").trim().toLowerCase();
    const aprovado = statusOrcamento === "aprovado" || !!orc.aprovadoEm || servicoOrigem?.status === "executado";
    const decidido = aprovado || statusOrcamento === "recusado" || !!orc.recusadoEm;
    const semRetornoManutencao = servicoOrigem?.semRetornoManutencao === true;
    const jaTemAgendamento = (dadosAtuais.agenda || []).some(item =>
        item.status === "agendado" &&
        (item.servicoOrigemId === orc.origemServicoId || item.origemServicoId === orc.origemServicoId)
    );

    if (decidido) {
        [btnEditar, btnAprovar, btnRecusar].forEach(botao => {
            botao.disabled = true;
            botao.classList.add("btn-disabled");
            botao.hidden = true;
            botao.style.display = "none";
        });
    } else {
        [btnEditar, btnAprovar, btnRecusar].forEach(botao => {
            botao.hidden = false;
            botao.style.display = "inline-flex";
        });
    }

    if (aprovado && !jaTemAgendamento && !semRetornoManutencao) {
        btnAgendarDepois.hidden = false;
        btnAgendarDepois.style.display = "inline-flex";
    } else {
        btnAgendarDepois.hidden = true;
        btnAgendarDepois.style.display = "none";
    }
}

atualizarAcoesOrcamentoDecidido();

if (!orc.origemServicoId) {
    btnEditar.disabled = true;
    btnEditar.classList.add("btn-disabled");
}

function gerarPDF() {
    gerarArquivoPdf();
}

function editarOrcamento() {
    if (orc.status !== "enviado" || !orc.origemServicoId) return;
    location.href = "servico.html?editar=" + encodeURIComponent(orc.origemServicoId);
}


function normalizarTelefoneWhats(telefone) {
    const digitos = String(telefone || "").replace(/\D/g, "");
    if (!digitos) return "";
    if (digitos.startsWith("55")) return digitos;
    if (digitos.length >= 10 && digitos.length <= 11) return `55${digitos}`;
    return digitos;
}

function obterTelefoneWhatsCliente(cliente) {
    return [
        cliente?.telefone,
        cliente?.telefone2
    ]
        .map(normalizarTelefoneWhats)
        .find(Boolean) || "";
}

function baixarBlob(blob, fileName) {
    const link = document.createElement("a");
    const blobUrl = URL.createObjectURL(blob);
    link.href = blobUrl;
    link.download = fileName;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
        link.remove();
        URL.revokeObjectURL(blobUrl);
    }, 3000);
}

async function gerarBlobPdfOrcamento() {
    const originalStatus = statusPdf.innerHTML;
    statusPdf.innerHTML = '<span class="loader"></span> Gerando PDF para WhatsApp...';
    statusPdf.style.display = "flex";

    try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
            if (window.html2pdf) {
                const clone = document.querySelector(".orcamento").cloneNode(true);
                const cloneBotoes = clone.querySelector(".botoes");
                const cloneStatus = clone.querySelector("#statusPdf");
                if (cloneBotoes) cloneBotoes.remove();
                if (cloneStatus) cloneStatus.remove();

                clone.style.width = "760px";
                clone.style.maxWidth = "760px";
                clone.style.margin = "0 auto";
                clone.style.boxSizing = "border-box";
                clone.style.background = "#fff";

                const worker = window.html2pdf().set({
                    margin: [8, 8, 8, 8],
                    image: { type: "jpeg", quality: 0.96 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#ffffff",
                        scrollX: 0,
                        scrollY: 0,
                        windowWidth: 760
                    },
                    pagebreak: { mode: ["css", "legacy"] },
                    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
                }).from(clone).toPdf();

                const pdfFallback = await worker.get("pdf");
                return pdfFallback.output("blob");
            }

            throw new Error("Bibliotecas de PDF indisponiveis.");
        }

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            unit: "mm",
            format: "a4",
            orientation: "portrait"
        });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const compactPdf = (orc.itens || []).length > 12;
        const m = compactPdf ? 7 : 9;
        const contentW = pageW - (m * 2);
        const rightColW = compactPdf ? 68 : 72;
        const leftColW = contentW - rightColW - 6;
        const rowH = compactPdf ? 6.6 : 10.5;
        const lineGap = compactPdf ? 3.4 : 5;
        const lineGapObs = compactPdf ? 3.6 : 5.2;
        const settings = getAppSettings();
        const colorAccent = hexToRgb(settings.primaryColor, [13, 59, 102]);
        const colorHead = lightenRgb(colorAccent, 0.84);

        let y = m;

        function ensureSpace(heightNeeded) {
            if (y + heightNeeded <= pageH - m) return;
            pdf.addPage();
            drawPageFrame();
            y = m;
        }

        function drawRect(x, yy, w, h) {
            pdf.setDrawColor(80, 80, 80);
            pdf.rect(x, yy, w, h);
        }

        function drawPageFrame() {
            pdf.setDrawColor(120, 120, 120);
            pdf.setLineWidth(0.35);
            pdf.rect(4.5, 4.5, pageW - 9, pageH - 9);
        }

        function money(v) {
            return `R$ ${formatarMoedaBR(Number(v || 0))}`;
        }

        function hexToRgb(hex, fallback) {
            const raw = String(hex || "").trim().replace("#", "");
            if (!/^[0-9a-fA-F]{3,6}$/.test(raw)) return fallback;
            const full = raw.length === 3
                ? raw.split("").map(ch => ch + ch).join("")
                : raw.padStart(6, "0").slice(0, 6);
            const n = parseInt(full, 16);
            return [
                (n >> 16) & 255,
                (n >> 8) & 255,
                n & 255
            ];
        }

        function lightenRgb(rgb, ratio) {
            const r = Math.max(0, Math.min(1, Number(ratio || 0)));
            return rgb.map(v => Math.round(v + ((255 - v) * r)));
        }

        drawPageFrame();

        // Cabecalho empresa
        y += compactPdf ? 1 : 3;

        const headerBaseY = y;
        const logoBoxW = compactPdf ? 34 : 46;
        const logoBoxH = compactPdf ? 24 : 34;
        const logoBoxY = headerBaseY + 2;
        let textX = m;
        if (settings.logoDataUrl) {
            try {
                pdf.addImage(settings.logoDataUrl, "PNG", m + 1, logoBoxY + 1, logoBoxW - 2, logoBoxH - 2);
                textX = m + logoBoxW + 4;
            } catch {}
        }

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 9.6 : 13.5);
        pdf.text((settings.companyName || "Senso"), m, headerBaseY + logoBoxH + 10);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(compactPdf ? 6.8 : 8.8);
        const companyDocType = ["cpf", "cnpj", "none"].includes(settings.companyDocumentType)
            ? settings.companyDocumentType
            : inferCompanyDocumentType(settings.companyDocument || "");
        const companyDocLabel = companyDocType === "cpf" ? "CPF" : "CNPJ";
        const companyDocValue = formatarDocumentoPorTipo(settings.companyDocument || "", companyDocType);
        const companyLines = [];
        if (companyDocType !== "none" && companyDocValue) {
            companyLines.push(`${companyDocLabel}: ${companyDocValue}`);
        }
        companyLines.push(`Endereco: ${settings.companyAddress || "—"}`);
        companyLines.push(`Telefone: ${listarTelefonesEmpresa(settings).join(" / ") || "—"}`);
        companyLines.forEach((line, idx) => {
            pdf.text(line, m, headerBaseY + logoBoxH + (compactPdf ? 13.6 : 15.2) + (idx * (compactPdf ? 3.4 : 4.5)));
        });

        drawRect(pageW - m - rightColW, headerBaseY + 2, rightColW, compactPdf ? 15 : 23);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 5.8 : 7.2);
        const dataBoxCenterX = pageW - m - rightColW + (rightColW / 2);
        pdf.text("DATA DE EMISSAO", dataBoxCenterX, headerBaseY + (compactPdf ? 7 : 10), { align: "center" });
        pdf.setFontSize(compactPdf ? 8.4 : 11.8);
        pdf.text(new Date(orc.criadoEm).toLocaleDateString("pt-BR"), dataBoxCenterX, headerBaseY + (compactPdf ? 12.5 : 18), { align: "center" });

        y = headerBaseY + logoBoxH + (compactPdf ? 21 : 27);
        pdf.setDrawColor(100, 100, 100);
        pdf.line(m, y, pageW - m, y);

        const servicosCabecalhoPdf = String(settings.headerServices || "").trim().slice(0, 120);
        if (servicosCabecalhoPdf) {
            y += 4;
            const servicosLabelW = 24;
            const servicosLines = pdf.splitTextToSize(
                servicosCabecalhoPdf,
                contentW - servicosLabelW - 9
            ).slice(0, 2);
            const servicosBoxH = compactPdf ? (servicosLines.length > 1 ? 9 : 6.5) : (servicosLines.length > 1 ? 12.5 : 8.5);

            pdf.setFillColor(255, 255, 255);
            pdf.roundedRect(m, y, contentW, servicosBoxH, 1.5, 1.5, "F");
            pdf.setDrawColor(190, 190, 190);
            pdf.setLineWidth(0.3);
            pdf.roundedRect(m, y, contentW, servicosBoxH, 1.5, 1.5);
            pdf.setFillColor(...colorAccent);
            pdf.rect(m, y, 1.7, servicosBoxH, "F");
            pdf.roundedRect(m + 4, y + 2, servicosLabelW - 5, 4.8, 2, 2, "F");

            pdf.setFont("helvetica", "bold");
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(6.8);
            pdf.text("SERVICOS", m + 13.5, y + 5.3, { align: "center" });
            pdf.setFont("helvetica", "normal");
            pdf.setTextColor(0, 0, 0);
            pdf.setFontSize(7.8);
            pdf.text(servicosLines, m + servicosLabelW + 2, y + 5.6);
            y += servicosBoxH + (compactPdf ? 3 : 5);
        } else {
            y += compactPdf ? 4 : 7;
        }

        // Dados cliente
        const clienteGap = 6;
        const clienteTelefonesParaAltura = listarTelefonesCliente(clienteDados);
        const clienteBoxH = compactPdf
            ? (modoMecanica ? 28 : (clienteTelefonesParaAltura.length > 1 ? 23 : 19))
            : (modoMecanica
            ? 40
            : (clienteTelefonesParaAltura.length > 1 ? 32 : 26));
        drawRect(m, y, leftColW, clienteBoxH);
        drawRect(m + leftColW + clienteGap, y, rightColW, clienteBoxH);

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 7.4 : 10.5);
        pdf.text(`CLIENTE: ${clienteDados?.nome || "—"}`, m + 4, y + (compactPdf ? 5.2 : 8));
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(compactPdf ? 7 : 9.6);
        pdf.text(`CPF/CNPJ: ${formatarDocumentoBR(String(clienteDados?.documento || "").trim()) || "—"}`, m + 4, y + (compactPdf ? 9.4 : 13.8));
        const endCli = String(clienteDados?.endereco || "—");
        const endCliText = pdf.splitTextToSize(`ENDERECO: ${endCli}`, leftColW - 8);
        pdf.text(endCliText, m + 4, y + (compactPdf ? 13.6 : 19.5));

        if (modoMecanica) {
            pdf.text(`MODELO: ${String(clienteDados?.modeloCarro || "—")}`, m + 4, y + (compactPdf ? 19.2 : 27.2));
            pdf.text(`PLACA: ${String(clienteDados?.placaCarro || "—")}`, m + 4, y + (compactPdf ? 23.2 : 32.8));
            pdf.text(`COR: ${String(clienteDados?.corCarro || "—")}`, m + 4, y + (compactPdf ? 27.2 : 38.4));
        }

        const telefonesCli = clienteTelefonesParaAltura.length ? clienteTelefonesParaAltura : ["—"];
        const fp = String(orc?.formaPagamento || "").trim() || "—";
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 7.4 : 10.5);
        pdf.text("TELEFONE:", m + leftColW + clienteGap + 4, y + (compactPdf ? 5.2 : 8));
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(compactPdf ? 7 : 9.8);
        telefonesCli.forEach((tel, idx) => {
            pdf.text(String(tel), m + leftColW + clienteGap + 4, y + (compactPdf ? 9.4 : 14) + (idx * (compactPdf ? 3.8 : 5)));
        });
        const formaPagamentoY = y + (compactPdf ? 9.4 : 14) + (telefonesCli.length * (compactPdf ? 3.8 : 5)) + (compactPdf ? 0.8 : 1);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 7.4 : 10.5);
        pdf.text("FORMA PGTO:", m + leftColW + clienteGap + 4, formaPagamentoY);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(compactPdf ? 7 : 9.8);
        pdf.text(String(fp), m + leftColW + clienteGap + (compactPdf ? 24 : 34), formaPagamentoY);

        y += clienteBoxH + (compactPdf ? 5 : 8);

        // Titulo
        pdf.setFillColor(...colorAccent);
        pdf.rect(m, y, contentW, compactPdf ? 6 : 9, "F");
        pdf.setTextColor(255, 255, 255);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 8 : 12);
        pdf.text("ORCAMENTO", pageW / 2, y + (compactPdf ? 4.2 : 6.2), { align: "center" });
        pdf.setTextColor(0, 0, 0);
        y += compactPdf ? 7.5 : 12;

        // Tabela
        const colQtd = 18;
        const colValor = 44;
        const colSub = 44;
        const colDesc = contentW - colQtd - colValor - colSub;

        function drawTableHeader() {
            ensureSpace(compactPdf ? 8 : 14);
            drawRect(m, y, contentW, rowH);
            drawRect(m, y, colDesc, rowH);
            drawRect(m + colDesc, y, colQtd, rowH);
            drawRect(m + colDesc + colQtd, y, colValor, rowH);
            drawRect(m + colDesc + colQtd + colValor, y, colSub, rowH);
            pdf.setFillColor(...colorHead);
            pdf.rect(m, y, contentW, rowH, "F");
            drawRect(m, y, colDesc, rowH);
            drawRect(m + colDesc, y, colQtd, rowH);
            drawRect(m + colDesc + colQtd, y, colValor, rowH);
            drawRect(m + colDesc + colQtd + colValor, y, colSub, rowH);
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(compactPdf ? 7.2 : 11);
            const headerTextY = y + (compactPdf ? 4.4 : 6.8);
            pdf.text("DESCRICAO", m + 3, headerTextY);
            pdf.text("QTD", m + colDesc + colQtd / 2, headerTextY, { align: "center" });
            pdf.text("VALOR", m + colDesc + colQtd + colValor / 2, headerTextY, { align: "center" });
            pdf.text("SUBTOTAL", m + colDesc + colQtd + colValor + colSub / 2, headerTextY, { align: "center" });
            y += rowH;
        }

        drawTableHeader();
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(compactPdf ? 7.2 : 10.8);

        (orc.itens || []).forEach(item => {
            const descricao = String(item?.descricao || "—");
            const { quantidade, valorUnitario, subtotal } = resolverValoresItem(item);
            const lines = pdf.splitTextToSize(descricao, colDesc - 5);
            const cellH = Math.max(rowH, lines.length * lineGap + (compactPdf ? 2.4 : 4));

            ensureSpace(cellH + (compactPdf ? 1 : 2));
            if (y > pageH - m - (compactPdf ? 18 : 30)) {
                pdf.addPage();
                y = m;
                drawTableHeader();
            }

            drawRect(m, y, colDesc, cellH);
            drawRect(m + colDesc, y, colQtd, cellH);
            drawRect(m + colDesc + colQtd, y, colValor, cellH);
            drawRect(m + colDesc + colQtd + colValor, y, colSub, cellH);

            const baselineY = y + Math.min(cellH - (compactPdf ? 1.8 : 3.5), compactPdf ? 4.4 : 7.5);
            pdf.text(lines, m + 3, y + (compactPdf ? 4.2 : 6.2));
            pdf.text(formatarQuantidade(quantidade), m + colDesc + (colQtd / 2), baselineY, { align: "center" });
            pdf.text(money(valorUnitario), m + colDesc + colQtd + 2, baselineY);
            pdf.text(money(subtotal), m + colDesc + colQtd + colValor + 2, baselineY);
            y += cellH;
        });

        // Total
        ensureSpace(compactPdf ? 9 : 14);
        pdf.setFillColor(...colorAccent);
        pdf.rect(m, y, contentW, compactPdf ? 7 : 10, "F");
        pdf.setFont("helvetica", "bold");
        pdf.setTextColor(255, 255, 255);
        pdf.setFontSize(compactPdf ? 8 : 12);
        pdf.text(`VALOR TOTAL ${money(orc.total)}`, pageW - m - 3, y + (compactPdf ? 4.9 : 6.8), { align: "right" });
        pdf.setTextColor(0, 0, 0);
        y += compactPdf ? 9 : 14;

        // Observacoes
        const obsTitulo = "OBSERVACOES:";
        const obsTexto = String(orc.observacoes || "—");
        const obsLinhas = pdf.splitTextToSize(obsTexto, contentW - 4);

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(compactPdf ? 8 : 12);
        ensureSpace(compactPdf ? 8 : 12);
        pdf.text(obsTitulo, m + 4, y + (compactPdf ? 4.8 : 6));
        y += compactPdf ? 6 : 9;

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(compactPdf ? 7.2 : 10.8);

        let idx = 0;
        while (idx < obsLinhas.length) {
            ensureSpace(10);
            const linhasRestantes = Math.floor((pageH - m - y - 8) / lineGapObs);
            const qtd = Math.max(1, linhasRestantes);
            const bloco = obsLinhas.slice(idx, idx + qtd);
            const boxH = Math.max(compactPdf ? 12 : 24, (bloco.length * lineGapObs) + (compactPdf ? 7 : 12));

            drawRect(m, y - (compactPdf ? 5 : 7), contentW, boxH + (compactPdf ? 2 : 4));
            pdf.text(bloco, m + 4, y + (compactPdf ? 2.2 : 3));

            idx += bloco.length;
            y += boxH + (compactPdf ? 1 : 2);
            if (idx < obsLinhas.length) {
                pdf.addPage();
                drawPageFrame();
                y = m;
                pdf.setFont("helvetica", "bold");
                pdf.setFontSize(11);
                pdf.text("OBSERVACOES (contin.)", m + 4, y + 6);
                y += 8.5;
                pdf.setFont("helvetica", "normal");
                pdf.setFontSize(10.8);
            }
        }

        return pdf.output("blob");
    } finally {
        statusPdf.innerHTML = originalStatus;
        statusPdf.style.display = "none";
    }
}

async function gerarArquivoPdf() {
    try {
        const blob = await gerarBlobPdfOrcamento();
        const fileName = `orcamento-${orc.numero || orc.id}.pdf`;
        baixarBlob(blob, fileName);
    } catch (err) {
        statusPdf.style.display = "none";
        console.error(err);
        alert("Nao foi possivel gerar o PDF.");
    }
}

    return [

        `Estou enviando o PDF do orcamento${numeroOrcamento ? ` ${numeroOrcamento}` : ""}${nomeEmpresa ? ` da ${nomeEmpresa}` : ""} para sua analise e aprovacao.`,

    ].join("\n");

async function enviarWhatsAppPDF() {
    try {
        const telefone = obterTelefoneWhatsCliente(clienteDados);
        if (!telefone) {
            alert("Cliente sem telefone valido para WhatsApp. Atualize o cadastro do cliente e tente novamente.");
            return;
        }

        const msg = montarMensagemOrcamentoWhatsApp();
        const waUrl = `https://api.whatsapp.com/send?phone=${telefone}&text=${encodeURIComponent(msg)}`;

        location.href = waUrl;
    } catch (err) {
        statusPdf.style.display = "none";
        console.error(err);
        alert("Nao foi possivel abrir o WhatsApp.");
    }
}

function abrirModalProximoAgendamento(servico, aoContinuar, removerAgendamentoAoCancelar = false) {
    const exemploProximoServico = obterExemploProximoServico();
    const mensagemFinalizacao = window.SensoProfile?.usesVehicleFields?.() === true
        ? "O veículo foi finalizado."
        : "O serviço foi finalizado.";
    const modal = document.createElement("div");
    modal.style.cssText = "position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:rgba(15,23,42,.48)";
    modal.innerHTML = `<div style="position:relative;width:min(420px,100%);padding:18px 22px 22px;border-radius:18px;background:#fff;box-shadow:0 24px 60px rgba(15,23,42,.25);text-align:center"><button type="button" data-fechar aria-label="Fechar" style="position:absolute;right:10px;top:8px;border:0;background:transparent;color:#64748b;font-size:24px;cursor:pointer">×</button><img src="../assets/assistente-senso/agendamento-instrucoes.png" alt="Mascote mostrando instruções" style="display:block;width:145px;height:145px;object-fit:contain;margin:-4px auto 2px"><h3 style="margin:0 0 8px;color:#0f766e">Agendar próximo serviço?</h3><p style="margin:0 0 18px;color:#52635c;line-height:1.45">${mensagemFinalizacao}<br>Deseja criar um lembrete para um próximo serviço deste cliente?</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button type="button" data-nao style="padding:12px;border:1px solid #94a3b8;border-radius:10px;background:#f1f5f9;color:#334155;font-weight:800">Não agendar agora</button><button type="button" data-sem-retorno style="padding:12px;border:1px solid #fbbf24;border-radius:10px;background:#fffbeb;color:#92400e;font-weight:800">Não precisa de retorno</button><button type="button" data-sim style="grid-column:1 / -1;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:800">Sim, Agendar</button></div></div>`;
    document.body.appendChild(modal);
    const fechar = () => modal.remove();
    const continuarSemAgendamento = () => {
        if (removerAgendamentoAoCancelar) {
            const data = getData();
            const agendaAntes = (data.agenda || []).length;
            data.agenda = (data.agenda || []).filter(item =>
                item.servicoOrigemId !== servico.id && item.origemServicoId !== servico.id
            );
            if (data.agenda.length !== agendaAntes) saveData(data);
        }
        fechar();
        aoContinuar();
    };
    modal.querySelector("[data-fechar]").onclick = continuarSemAgendamento;
    modal.querySelector("[data-nao]").onclick = continuarSemAgendamento;
    modal.querySelector("[data-sem-retorno]").onclick = () => {
        const data = getData();
        const servicoAtual = (data.servicos || []).find(item => item.id === servico.id);
        if (servicoAtual) {
            servicoAtual.semRetornoManutencao = true;
            servicoAtual.semRetornoManutencaoEm = new Date().toISOString();
            data.agenda = (data.agenda || []).filter(item =>
                item.servicoOrigemId !== servico.id && item.origemServicoId !== servico.id
            );
            saveData(data);
        }
        atualizarAcoesOrcamentoDecidido();
        fechar();
        aoContinuar();
    };
    modal.querySelector("[data-sim]").onclick = () => {
        modal.innerHTML = `<div style="width:min(440px,100%);padding:22px;border-radius:18px;background:#fff;box-shadow:0 24px 60px rgba(15,23,42,.25)"><h3 style="margin:0 0 16px;color:#0f766e">Próximo serviço</h3><label style="display:grid;gap:6px;margin-bottom:12px;font-weight:700">Próximo serviço<input data-descricao required placeholder="Ex.: ${exemploProximoServico}" style="padding:11px;border:1px solid #cbd5e1;border-radius:9px"></label><label style="display:grid;gap:6px;margin-bottom:12px;font-weight:700">Quando deverá retornar<select data-prazo style="padding:11px;border:1px solid #cbd5e1;border-radius:9px"><option value="1">1 mês</option><option value="3">3 meses</option><option value="6">6 meses</option><option value="12">12 meses</option><option value="custom">Escolher data personalizada</option></select></label><input data-data type="date" hidden style="width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin-bottom:12px"><label style="display:grid;gap:6px;font-weight:700">Observação (opcional)<textarea data-observacao placeholder="Ex.: detalhes importantes para o próximo atendimento." style="padding:11px;border:1px solid #cbd5e1;border-radius:9px"></textarea></label><div style="display:flex;gap:9px;margin-top:16px"><button data-nao-agendar type="button" style="flex:1;padding:13px;border:1px solid #94a3b8;border-radius:10px;background:#f1f5f9;color:#334155;font-weight:800">Não agendar agora</button><button data-criar type="button" style="flex:1;padding:13px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:800">Criar Agendamento</button></div></div>`;
        const prazo = modal.querySelector("[data-prazo]"), dataInput = modal.querySelector("[data-data]");
        prazo.onchange = () => { dataInput.hidden = prazo.value !== "custom"; };
        modal.querySelector("[data-nao-agendar]").onclick = continuarSemAgendamento;
        modal.querySelector("[data-criar]").onclick = () => {
            const criarButton = modal.querySelector("[data-criar]");
            if (criarButton.disabled) return;
            criarButton.disabled = true;
            const descricao = modal.querySelector("[data-descricao]").value.trim();
            if (!descricao) { criarButton.disabled = false; alert("Informe o próximo serviço."); return; }
            const data = getData(); const retorno = new Date();
            if (prazo.value === "custom") { if (!dataInput.value) { criarButton.disabled = false; alert("Escolha a data de retorno."); return; } retorno.setTime(new Date(`${dataInput.value}T12:00:00`).getTime()); }
            else retorno.setMonth(retorno.getMonth() + Number(prazo.value));
            data.agenda ||= [];
            const dataRetorno = retorno.toISOString();
            const duplicado = data.agenda.find(a => a.status === "agendado" && a.servicoOrigemId === servico.id && a.descricaoProximoServico === descricao && String(a.dataRetorno).slice(0, 10) === dataRetorno.slice(0, 10));
            if (duplicado) { fechar(); aoContinuar(); return; }
            data.agenda.push({ id: gerarId(), clienteId: servico.cliente?.id || "", servicoOrigemId: servico.id, cliente: servico.cliente, descricaoProximoServico: descricao, observacao: modal.querySelector("[data-observacao]").value.trim(), dataRetorno, dataExecucao: servico.executadoEm, valorServico: servico.totalGeral, status: "agendado", criadoEm: new Date().toISOString() });
            saveData(data);
            atualizarAcoesOrcamentoDecidido();
            modal.innerHTML = `<div style="width:min(420px,100%);padding:18px 22px 22px;border-radius:18px;background:#fff;box-shadow:0 24px 60px rgba(15,23,42,.25);text-align:center"><img src="../assets/assistente-senso/agendamento-concluido.png" alt="Mascote comemorando agendamento" style="display:block;width:170px;height:170px;object-fit:contain;margin:-4px auto 2px"><h3 style="margin:0 0 8px;color:#0f766e">Agendamento criado!</h3><p style="margin:0;color:#52635c;line-height:1.45">O próximo serviço foi salvo na Agenda.</p><button type="button" data-continuar style="width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:800">Continuar</button></div>`;
            modal.querySelector("[data-continuar]").onclick = () => { fechar(); aoContinuar(); };
        };
    };
}

function aprovar() {
    const aprovado = marcarOrcamentoComoAprovado(orc.id);
    if (!aprovado) return;
    orc.status = "aprovado";
    orc.aprovadoEm ||= new Date().toISOString();
    atualizarAcoesOrcamentoDecidido();

    const servicoId = orc.origemServicoId;
    AssistenteSenso.criarPendencia(servicoId);

    let destinoDefinido = false;
    const irParaOrcamentos = () => {
        if (destinoDefinido) return;
        destinoDefinido = true;
        location.href = "orcamentos.html";
    };

    const continuarAposAgendamento = () => AssistenteSenso.abrir({
        imagem: "/assets/assistente-senso/gasto-do-servico.png",
        mensagens: [
            "Parabéns!",
            "Seu serviço foi aprovado e o valor foi registrado automaticamente no Financeiro.",
            "Você teve algum gasto relacionado a este serviço?",
            "Registrar ajuda a calcular seu lucro real."
        ],
        acoes: [
            {
                texto: "Registrar gasto",
                estilo: "primaria",
                aoClicar: () => {
                    destinoDefinido = true;
                    location.href = `financeiro.html?assistente=gasto&servico=${encodeURIComponent(servicoId)}#novo-gasto`;
                }
            },
            {
                texto: "Não tive gastos",
                aoClicar: ({ fechar }) => {
                    AssistenteSenso.informarSemGastos(servicoId);
                    fechar("sem-gastos");
                    AssistenteSenso.abrir({
                        imagem: "/assets/assistente-senso/gasto-do-servico.png",
                        mensagens: [
                            "Perfeito! Este serviço continuará apenas com o valor recebido.",
                            "Bom trabalho!"
                        ],
                        aoFechar: irParaOrcamentos
                    });
                }
            },
            {
                texto: "Lembrar depois",
                estilo: "sutil",
                aoClicar: ({ fechar }) => {
                    AssistenteSenso.lembrarDepois(servicoId);
                    fechar("lembrar-depois");
                }
            }
        ],
        aoFechar: motivo => {
            if (motivo === "sem-gastos" || motivo === "substituido") return;
            AssistenteSenso.lembrarDepois(servicoId);
            irParaOrcamentos();
        }
    });
    abrirModalProximoAgendamento(getData().servicos.find(s => s.id === servicoId) || { id: servicoId, cliente: clienteDados }, continuarAposAgendamento, true);
}

function agendarDepois() {
    const servico = (getData().servicos || []).find(s => s.id === orc.origemServicoId);
    if (!servico) {
        alert("Serviço de origem não encontrado para este orçamento.");
        return;
    }
    abrirModalProximoAgendamento(servico, () => location.reload(), false);
}

function recusar() {
    const recusado = marcarOrcamentoComoRecusado(orc.id);
    if (!recusado) return;
    alert("Orçamento recusado");
    location.href = "orcamentos.html";
}
</script>
