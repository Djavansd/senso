<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento</title>

<link rel="stylesheet" href="../css/style.css">

<style>
body { background:#eee; }
.orcamento {
    background:#fff;
    max-width:800px;
    margin:16px auto;
    padding:16px;
    border:1px solid #ccc;
    font-size:14px;
    box-sizing:border-box;
}
.cabecalho {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    border-bottom:1px solid #000;
    padding-bottom:10px;
}
.empresa {
    font-size:14px;
    line-height:1.45;
    flex:1;
    min-width:0;
}
.empresa strong {
    font-size:15px;
}
#orcamentoLogo {
    height:120px !important;
    max-height:120px !important;
    max-width:340px !important;
    margin-bottom:10px !important;
}
.caixa-data {
    flex-shrink:0;
    border:1px solid #000;
    padding:6px 10px;
    text-align:center;
    font-size:13px;
}
.cabecalho-lateral {
    width:240px;
    flex-shrink:0;
}
.info-opcionais {
    display:none;
    position:relative;
    border:1px solid #c9c9c9;
    border-radius:6px;
    margin-top:8px;
    padding:7px 8px 8px 12px;
    font-size:11px;
    line-height:1.35;
    background:#fff;
    overflow:hidden;
}
.info-opcionais::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:var(--app-primary);
}
.info-opcionais strong {
    display:inline-block;
    margin:0 0 5px;
    padding:2px 7px;
    background:var(--app-primary);
    color:#fff;
    border-radius:999px;
    font-size:11px;
    line-height:1.2;
}
.bloco {
    border:1px solid #000;
    margin-top:10px;
    padding:8px;
    font-size:13px;
}
.bloco-flex {
    display:flex;
    justify-content:space-between;
    gap:10px;
}
.bloco-flex .bloco {
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
    word-break:break-word;
}
.titulo {
    background:var(--app-primary);
    color:#fff;
    padding:6px;
    margin-top:12px;
    text-align:center;
    font-weight:bold;
}
table {
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
    table-layout: fixed;
}
th, td {
    border:1px solid #000;
    padding:6px;
    font-size:13px;
    word-break:break-word;
    overflow-wrap:anywhere;
}
th { background:#e6eef6; }
.total {
    background:var(--app-primary);
    color:#fff;
    padding:8px;
    font-weight:bold;
    text-align:right;
    margin-top:6px;
}
.observacoes {
    border:1px solid #000;
    min-height:120px;
    height:auto;
    margin-top:8px;
    padding:6px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    line-height:1.4;
    break-inside:auto;
    page-break-inside:auto;
}
.cabecalho,
.bloco-flex,
.titulo,
.total,
table tr {
    break-inside: avoid;
    page-break-inside: avoid;
}
.botoes {
    margin-top:12px;
    display:flex;
    gap:10px;
}
.btn {
    flex:1;
    padding:10px;
    border-radius:8px;
    border:none;
    font-weight:bold;
    cursor:pointer;
}
.btn-voltar { background:#ccc; }
.btn-pdf {
    background: var(--app-primary);
    color: var(--app-button-text);
}
.btn-disabled {
    background:#ddd !important;
    cursor:not-allowed;
}
#statusPdf {
    display:none;
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:#f1f3f4;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
}
.loader {
    width:16px;
    height:16px;
    border:3px solid #ccc;
    border-top:3px solid #1976d2;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

@media (max-width: 480px) {
    .empresa {
        font-size:13px;
        line-height:1.4;
    }

    .empresa strong {
        font-size:14px;
    }

    #orcamentoLogo {
        height:96px !important;
        max-height:96px !important;
        max-width:260px !important;
        margin-bottom:8px !important;
    }

    .cabecalho {
        flex-wrap:wrap;
    }

    .cabecalho-lateral {
        width:100%;
    }
}

@media print {
    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    body {
        background: #fff !important;
    }

    .orcamento {
        background: #fff !important;
        border: none !important;
        margin: 0 !important;
        max-width: 100% !important;
    }

    .titulo,
    .total {
        background: var(--app-primary) !important;
        color: #fff !important;
    }

    th {
        background: #e6eef6 !important;
        color: #000 !important;
    }

    .botoes,
    #statusPdf {
        display: none !important;
    }
}

</style>
</head>

<body>

<div class="orcamento">

<div class="cabecalho">
    <div class="empresa">
        <strong>PROICE CLIMATIZAÇÃO</strong><br>
        CNPJ: 42.937.499/0001-08<br>
        Endereço: São Paulo<br>
        📞 (11) 99284-1312
    </div>
    <div class="cabecalho-lateral">
        <div class="caixa-data">
            DATA DE EMISSÃO<br>
            <strong id="dataEmissao">—</strong>
        </div>
        <div class="info-opcionais" id="infoOpcionaisBox">
            <strong>SERVICOS</strong>
            <span id="infoOpcionaisTexto"></span>

</div>

<div class="bloco-flex">
    <div class="bloco">
        <strong>CLIENTE:</strong> <span id="clienteNome"></span><br>
        CPF/CNPJ: <span id="clienteDoc"></span><br>
        ENDEREÇO: <span id="clienteEndereco"></span><br>
        <span id="linhaClienteModelo">MODELO: <span id="clienteModeloCarro"></span><br></span>
        <span id="linhaClientePlaca">PLACA: <span id="clientePlacaCarro"></span><br></span>
        <span id="linhaClienteCor">COR: <span id="clienteCorCarro"></span></span>
    </div>
    <div class="bloco">
        <strong>TELEFONE:</strong> <span id="clienteTelefone"></span><br>
        FORMA PGTO: <span id="formaPagamento">—</span>
    </div>
</div>

<div class="titulo">ORÇAMENTO</div>

<table>
<thead>
<tr>
    <th>DESCRIÇÃO</th>
    <th>QTD</th>
    <th>VALOR</th>
    <th>SUBTOTAL</th>
</tr>
</thead>
<tbody id="tabelaItens"></tbody>
</table>

<div class="total">
    VALOR TOTAL R$ <span id="valorTotal">0,00</span>
</div>

<div class="observacoes" id="obsBox"></div>

<div class="botoes">
    <button class="btn btn-pdf" onclick="gerarPDF()">📄 PDF</button>
    <button class="btn btn-pdf" onclick="enviarWhatsAppPDF()">📲 WhatsApp</button>
    <button id="btnEditar" class="btn btn-pdf" onclick="editarOrcamento()">✏️ Editar</button>
    <button id="btnAprovar" class="btn btn-pdf" onclick="aprovar()">✅ Aprovar</button>
    <button id="btnRecusar" class="btn btn-voltar" onclick="recusar()">❌ Recusar</button>
    <button class="btn btn-voltar" onclick="history.back()">← Voltar</button>
</div>

<div id="statusPdf">
    <span class="loader"></span> Gerando PDF...
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js"></script>
<script src="../js/core/plans.js"></script>
<script src="../js/core/profile.js"></script>
<script src="../js/domains/mecanica/domain.js"></script>
<script src="../js/app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
const id = new URLSearchParams(location.search).get("id");
const data = getData();
const orc = data.orcamentos.find(o => o.id === id);
const clienteCadastro = (data.clientes || []).find(c => c.id === orc?.cliente?.id);
const clienteDados = {
    ...(orc?.cliente || {}),
    ...(clienteCadastro || {})
};
const modoMecanica = (
    window.SensoProfile &&
    typeof window.SensoProfile.getActiveProfile === "function" &&
    window.SensoProfile.getActiveProfile()?.id === "mecanica"
);
const settingsOrcamento = getAppSettings();
const servicosCabecalhoOrcamento = String(settingsOrcamento.headerServices || "").trim().slice(0, 120);

function resolverValoresItem(item) {
    const toNumberFlexible = (value) => {
        if (typeof value === "number") return value;
        if (typeof value === "string") {
            const normalized = value.trim().replace(/\s+/g, "").replace(",", ".");
            const num = Number(normalized);
            return Number.isFinite(num) ? num : NaN;
        }
        const num = Number(value);
        return Number.isFinite(num) ? num : NaN;
    };

    const subtotalRaw = toNumberFlexible(item?.total);
    const subtotal = Number.isFinite(subtotalRaw) && subtotalRaw >= 0 ? subtotalRaw : 0;

    const qtdRaw = toNumberFlexible(item?.quantidade ?? item?.qtd);
    const quantidade = Number.isFinite(qtdRaw) && qtdRaw > 0 ? Math.trunc(qtdRaw) : 1;

    const unitRaw = toNumberFlexible(item?.valorUnitario ?? item?.valor);
    const valorUnitario = Number.isFinite(unitRaw) && unitRaw >= 0
        ? unitRaw
        : (quantidade > 0 ? (subtotal / quantidade) : subtotal);

    return { quantidade, valorUnitario, subtotal };
}

function formatarQuantidade(qtd) {
    const inteira = Math.trunc(Number(qtd) || 0);
    return String(inteira > 0 ? inteira : 1);
}

function sincronizarItensOrcamentoComServico() {
    const servicoOrigem = (data.servicos || []).find(s => s.id === orc?.origemServicoId);
    if (!servicoOrigem || !Array.isArray(servicoOrigem.itens) || !Array.isArray(orc?.itens)) return;

    let alterou = false;
    orc.itens = orc.itens.map((itemOrc, idx) => {
        const itemServico = servicoOrigem.itens[idx];
        if (!itemServico) return itemOrc;

        const qtdFaltando = itemOrc?.quantidade == null && itemOrc?.qtd == null;
        const valorFaltando = itemOrc?.valorUnitario == null && itemOrc?.valor == null;
        if (!qtdFaltando && !valorFaltando) return itemOrc;

        alterou = true;
        return {
            ...itemOrc,
            quantidade: qtdFaltando ? itemServico?.quantidade ?? itemServico?.qtd : itemOrc.quantidade,
            valorUnitario: valorFaltando ? itemServico?.valorUnitario ?? itemServico?.valor : itemOrc.valorUnitario
        };
    });

    if (alterou) saveData(data);
}

sincronizarItensOrcamentoComServico();


if (!orc) {
    alert("Orçamento não encontrado");
    history.back();
    throw new Error("Orcamento nao encontrado");
}

dataEmissao.textContent = new Date(orc.criadoEm).toLocaleDateString("pt-BR");
clienteNome.textContent = clienteDados.nome || "—";
clienteDoc.textContent = formatarDocumentoBR(clienteDados.documento) || "—";
clienteEndereco.textContent = clienteDados.endereco || "—";
clienteTelefone.textContent = listarTelefonesCliente(clienteDados).join(" / ") || "—";
clienteModeloCarro.textContent = clienteDados.modeloCarro || "—";
clientePlacaCarro.textContent = clienteDados.placaCarro || "—";
clienteCorCarro.textContent = clienteDados.corCarro || "—";
formaPagamento.textContent = orc.formaPagamento || "—";

if (!modoMecanica) {
    linhaClienteModelo.style.display = "none";
    linhaClientePlaca.style.display = "none";
    linhaClienteCor.style.display = "none";
}

if (servicosCabecalhoOrcamento) {
    infoOpcionaisBox.style.display = "block";
    infoOpcionaisTexto.textContent = servicosCabecalhoOrcamento;
}

tabelaItens.innerHTML = "";
orc.itens.forEach(i => {
    const { quantidade, valorUnitario, subtotal } = resolverValoresItem(i);
    tabelaItens.innerHTML += `
        <tr>
            <td>${i.descricao}</td>
            <td>${formatarQuantidade(quantidade)}</td>
            <td>R$ ${formatarMoedaBR(valorUnitario)}</td>
            <td>R$ ${formatarMoedaBR(subtotal)}</td>
        </tr>
    `;
});

valorTotal.textContent = formatarMoedaBR(orc.total);
const textoObs = (orc.observacoes || "—");
obsBox.innerHTML = "<strong>OBSERVAÇÕES:</strong><br>";
obsBox.appendChild(document.createTextNode(textoObs));

// 🔒 trava botões se já decidido
if (orc.status !== "enviado") {
    btnAprovar.disabled = true;
    btnRecusar.disabled = true;
    btnEditar.disabled = true;
    btnAprovar.classList.add("btn-disabled");
    btnRecusar.classList.add("btn-disabled");
    btnEditar.classList.add("btn-disabled");
}

if (!orc.origemServicoId) {
    btnEditar.disabled = true;
    btnEditar.classList.add("btn-disabled");
}

function gerarPDF() {
    gerarArquivoPdf();
}

function editarOrcamento() {
    if (orc.status !== "enviado" || !orc.origemServicoId) return;
    location.href = "servico.html?editar=" + encodeURIComponent(orc.origemServicoId);
}


function normalizarTelefoneWhats(telefone) {
    const digitos = String(telefone || "").replace(/\D/g, "");
    if (!digitos) return "";
    if (digitos.startsWith("55")) return digitos;
    if (digitos.length >= 10 && digitos.length <= 11) return `55${digitos}`;
    return digitos;
}

async function gerarBlobPdfOrcamento() {
    const originalStatus = statusPdf.innerHTML;
    statusPdf.innerHTML = '<span class="loader"></span> Gerando PDF para WhatsApp...';
    statusPdf.style.display = "flex";

    try {
        if (!window.jspdf || !window.jspdf.jsPDF) {
            if (window.html2pdf) {
                const clone = document.querySelector(".orcamento").cloneNode(true);
                const cloneBotoes = clone.querySelector(".botoes");
                const cloneStatus = clone.querySelector("#statusPdf");
                if (cloneBotoes) cloneBotoes.remove();
                if (cloneStatus) cloneStatus.remove();

                clone.style.width = "760px";
                clone.style.maxWidth = "760px";
                clone.style.margin = "0 auto";
                clone.style.boxSizing = "border-box";
                clone.style.background = "#fff";

                const worker = window.html2pdf().set({
                    margin: [8, 8, 8, 8],
                    image: { type: "jpeg", quality: 0.96 },
                    html2canvas: {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: "#ffffff",
                        scrollX: 0,
                        scrollY: 0,
                        windowWidth: 760
                    },
                    pagebreak: { mode: ["css", "legacy"] },
                    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
                }).from(clone).toPdf();

                const pdfFallback = await worker.get("pdf");
                return pdfFallback.output("blob");
            }

            throw new Error("Bibliotecas de PDF indisponiveis.");
        }

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
            unit: "mm",
            format: "a4",
            orientation: "portrait"
        });

        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        const m = 9;
        const contentW = pageW - (m * 2);
        const rightColW = 72;
        const leftColW = contentW - rightColW - 6;
        const rowH = 10.5;
        const lineGap = 5;
        const lineGapObs = 5.2;
        const settings = getAppSettings();
        const colorAccent = hexToRgb(settings.primaryColor, [13, 59, 102]);
        const colorHead = lightenRgb(colorAccent, 0.84);

        let y = m;

        function ensureSpace(heightNeeded) {
            if (y + heightNeeded <= pageH - m) return;
            pdf.addPage();
            drawPageFrame();
            y = m;
        }

        function drawRect(x, yy, w, h) {
            pdf.setDrawColor(80, 80, 80);
            pdf.rect(x, yy, w, h);
        }

        function drawPageFrame() {
            pdf.setDrawColor(120, 120, 120);
            pdf.setLineWidth(0.35);
            pdf.rect(4.5, 4.5, pageW - 9, pageH - 9);
        }

        function money(v) {
            return `R$ ${formatarMoedaBR(Number(v || 0))}`;
        }

        function hexToRgb(hex, fallback) {
            const raw = String(hex || "").trim().replace("#", "");
            if (!/^[0-9a-fA-F]{3,6}$/.test(raw)) return fallback;
            const full = raw.length === 3
                ? raw.split("").map(ch => ch + ch).join("")
                : raw.padStart(6, "0").slice(0, 6);
            const n = parseInt(full, 16);
            return [
                (n >> 16) & 255,
                (n >> 8) & 255,
                n & 255
            ];
        }

        function lightenRgb(rgb, ratio) {
            const r = Math.max(0, Math.min(1, Number(ratio || 0)));
            return rgb.map(v => Math.round(v + ((255 - v) * r)));
        }

        drawPageFrame();

        // Cabecalho empresa
        y += 3;

        const headerBaseY = y;
        const logoBoxW = 46;
        const logoBoxH = 34;
        const logoBoxY = headerBaseY + 2;
        let textX = m;
        if (settings.logoDataUrl) {
            try {
                pdf.addImage(settings.logoDataUrl, "PNG", m + 1, logoBoxY + 1, logoBoxW - 2, logoBoxH - 2);
                textX = m + logoBoxW + 4;
            } catch {}
        }

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(13.5);
        pdf.text((settings.companyName || "PROICE CLIMATIZACAO"), m, headerBaseY + logoBoxH + 10);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(8.8);
        const companyDocType = ["cpf", "cnpj", "none"].includes(settings.companyDocumentType)
            ? settings.companyDocumentType
            : inferCompanyDocumentType(settings.companyDocument || "");
        const companyDocLabel = companyDocType === "cpf" ? "CPF" : "CNPJ";
        const companyDocValue = formatarDocumentoPorTipo(settings.companyDocument || "", companyDocType);
        const companyLines = [];
        if (companyDocType !== "none" && companyDocValue) {
            companyLines.push(`${companyDocLabel}: ${companyDocValue}`);
        }
        companyLines.push(`Endereco: ${settings.companyAddress || "—"}`);
        companyLines.push(`Telefone: ${listarTelefonesEmpresa(settings).join(" / ") || "—"}`);
        companyLines.forEach((line, idx) => {
            pdf.text(line, m, headerBaseY + logoBoxH + 15.2 + (idx * 4.5));
        });

        drawRect(pageW - m - rightColW, headerBaseY + 2, rightColW, 23);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(7.2);
        const dataBoxCenterX = pageW - m - rightColW + (rightColW / 2);
        pdf.text("DATA DE EMISSAO", dataBoxCenterX, headerBaseY + 10, { align: "center" });
        pdf.setFontSize(11.8);
        pdf.text(new Date(orc.criadoEm).toLocaleDateString("pt-BR"), dataBoxCenterX, headerBaseY + 18, { align: "center" });

        y = headerBaseY + logoBoxH + 27;
        pdf.setDrawColor(100, 100, 100);
        pdf.line(m, y, pageW - m, y);

        const servicosCabecalhoPdf = String(settings.headerServices || "").trim().slice(0, 120);
        if (servicosCabecalhoPdf) {
            y += 4;
            const servicosLabelW = 24;
            const servicosLines = pdf.splitTextToSize(
                servicosCabecalhoPdf,
                contentW - servicosLabelW - 9
            ).slice(0, 2);
            const servicosBoxH = servicosLines.length > 1 ? 12.5 : 8.5;

            pdf.setFillColor(255, 255, 255);
            pdf.roundedRect(m, y, contentW, servicosBoxH, 1.5, 1.5, "F");
            pdf.setDrawColor(190, 190, 190);
            pdf.setLineWidth(0.3);
            pdf.roundedRect(m, y, contentW, servicosBoxH, 1.5, 1.5);
            pdf.setFillColor(...colorAccent);
            pdf.rect(m, y, 1.7, servicosBoxH, "F");
            pdf.roundedRect(m + 4, y + 2, servicosLabelW - 5, 4.8, 2, 2, "F");

            pdf.setFont("helvetica", "bold");
            pdf.setTextColor(255, 255, 255);
            pdf.setFontSize(6.8);
            pdf.text("SERVICOS", m + 13.5, y + 5.3, { align: "center" });
            pdf.setFont("helvetica", "normal");
            pdf.setTextColor(0, 0, 0);
            pdf.setFontSize(7.8);
            pdf.text(servicosLines, m + servicosLabelW + 2, y + 5.6);
            y += servicosBoxH + 5;
        } else {
            y += 7;
        }

        // Dados cliente
        const clienteGap = 6;
        const clienteTelefonesParaAltura = listarTelefonesCliente(clienteDados);
        const clienteBoxH = modoMecanica
            ? 40
            : (clienteTelefonesParaAltura.length > 1 ? 32 : 26);
        drawRect(m, y, leftColW, clienteBoxH);
        drawRect(m + leftColW + clienteGap, y, rightColW, clienteBoxH);

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10.5);
        pdf.text(`CLIENTE: ${clienteDados?.nome || "—"}`, m + 4, y + 8);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(9.6);
        pdf.text(`CPF/CNPJ: ${formatarDocumentoBR(String(clienteDados?.documento || "").trim()) || "—"}`, m + 4, y + 13.8);
        const endCli = String(clienteDados?.endereco || "—");
        const endCliText = pdf.splitTextToSize(`ENDERECO: ${endCli}`, leftColW - 8);
        pdf.text(endCliText, m + 4, y + 19.5);

        if (modoMecanica) {
            pdf.text(`MODELO: ${String(clienteDados?.modeloCarro || "—")}`, m + 4, y + 27.2);
            pdf.text(`PLACA: ${String(clienteDados?.placaCarro || "—")}`, m + 4, y + 32.8);
            pdf.text(`COR: ${String(clienteDados?.corCarro || "—")}`, m + 4, y + 38.4);
        }

        const telefonesCli = clienteTelefonesParaAltura.length ? clienteTelefonesParaAltura : ["—"];
        const fp = String(orc?.formaPagamento || "").trim() || "—";
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10.5);
        pdf.text("TELEFONE:", m + leftColW + clienteGap + 4, y + 8);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(9.8);
        telefonesCli.forEach((tel, idx) => {
            pdf.text(String(tel), m + leftColW + clienteGap + 4, y + 14 + (idx * 5));
        });
        const formaPagamentoY = y + 14 + (telefonesCli.length * 5) + 1;
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10.5);
        pdf.text("FORMA PGTO:", m + leftColW + clienteGap + 4, formaPagamentoY);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(9.8);
        pdf.text(String(fp), m + leftColW + clienteGap + 34, formaPagamentoY);

        y += clienteBoxH + 8;

        // Titulo
        pdf.setFillColor(...colorAccent);
        pdf.rect(m, y, contentW, 9, "F");
        pdf.setTextColor(255, 255, 255);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(12);
        pdf.text("ORCAMENTO", pageW / 2, y + 6.2, { align: "center" });
        pdf.setTextColor(0, 0, 0);
        y += 12;

        // Tabela
        const colQtd = 18;
        const colValor = 44;
        const colSub = 44;
        const colDesc = contentW - colQtd - colValor - colSub;

        function drawTableHeader() {
            ensureSpace(14);
            drawRect(m, y, contentW, rowH);
            drawRect(m, y, colDesc, rowH);
            drawRect(m + colDesc, y, colQtd, rowH);
            drawRect(m + colDesc + colQtd, y, colValor, rowH);
            drawRect(m + colDesc + colQtd + colValor, y, colSub, rowH);
            pdf.setFillColor(...colorHead);
            pdf.rect(m, y, contentW, rowH, "F");
            drawRect(m, y, colDesc, rowH);
            drawRect(m + colDesc, y, colQtd, rowH);
            drawRect(m + colDesc + colQtd, y, colValor, rowH);
            drawRect(m + colDesc + colQtd + colValor, y, colSub, rowH);
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(11);
            pdf.text("DESCRICAO", m + 4, y + 6.8);
            pdf.text("QTD", m + colDesc + colQtd / 2, y + 6.8, { align: "center" });
            pdf.text("VALOR", m + colDesc + colQtd + colValor / 2, y + 6.8, { align: "center" });
            pdf.text("SUBTOTAL", m + colDesc + colQtd + colValor + colSub / 2, y + 6.8, { align: "center" });
            y += rowH;
        }

        drawTableHeader();
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(10.8);

        (orc.itens || []).forEach(item => {
            const descricao = String(item?.descricao || "—");
            const { quantidade, valorUnitario, subtotal } = resolverValoresItem(item);
            const lines = pdf.splitTextToSize(descricao, colDesc - 5);
            const cellH = Math.max(10.5, lines.length * lineGap + 4);

            ensureSpace(cellH + 2);
            if (y > pageH - m - 30) {
                pdf.addPage();
                y = m;
                drawTableHeader();
            }

            drawRect(m, y, colDesc, cellH);
            drawRect(m + colDesc, y, colQtd, cellH);
            drawRect(m + colDesc + colQtd, y, colValor, cellH);
            drawRect(m + colDesc + colQtd + colValor, y, colSub, cellH);

            const baselineY = y + Math.min(cellH - 3.5, 7.5);
            pdf.text(lines, m + 4, y + 6.2);
            pdf.text(formatarQuantidade(quantidade), m + colDesc + (colQtd / 2), baselineY, { align: "center" });
            pdf.text(money(valorUnitario), m + colDesc + colQtd + 3, baselineY);
            pdf.text(money(subtotal), m + colDesc + colQtd + colValor + 3, baselineY);
            y += cellH;
        });

        // Total
        ensureSpace(14);
        pdf.setFillColor(...colorAccent);
        pdf.rect(m, y, contentW, 10, "F");
        pdf.setFont("helvetica", "bold");
        pdf.setTextColor(255, 255, 255);
        pdf.setFontSize(12);
        pdf.text(`VALOR TOTAL ${money(orc.total)}`, pageW - m - 3, y + 6.8, { align: "right" });
        pdf.setTextColor(0, 0, 0);
        y += 14;

        // Observacoes
        const obsTitulo = "OBSERVACOES:";
        const obsTexto = String(orc.observacoes || "—");
        const obsLinhas = pdf.splitTextToSize(obsTexto, contentW - 4);

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(12);
        ensureSpace(12);
        pdf.text(obsTitulo, m + 4, y + 6);
        y += 9;

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(10.8);

        let idx = 0;
        while (idx < obsLinhas.length) {
            ensureSpace(10);
            const linhasRestantes = Math.floor((pageH - m - y - 8) / lineGapObs);
            const qtd = Math.max(1, linhasRestantes);
            const bloco = obsLinhas.slice(idx, idx + qtd);
            const boxH = Math.max(24, (bloco.length * lineGapObs) + 12);

            drawRect(m, y - 7, contentW, boxH + 4);
            pdf.text(bloco, m + 4, y + 3);

            idx += bloco.length;
            y += boxH + 2;
            if (idx < obsLinhas.length) {
                pdf.addPage();
                drawPageFrame();
                y = m;
                pdf.setFont("helvetica", "bold");
                pdf.setFontSize(11);
                pdf.text("OBSERVACOES (contin.)", m + 4, y + 6);
                y += 8.5;
                pdf.setFont("helvetica", "normal");
                pdf.setFontSize(10.8);
            }
        }

        return pdf.output("blob");
    } finally {
        statusPdf.innerHTML = originalStatus;
        statusPdf.style.display = "none";
    }
}

async function gerarArquivoPdf() {
    try {
        const blob = await gerarBlobPdfOrcamento();
        const fileName = `orcamento-${orc.numero || orc.id}.pdf`;
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    } catch (err) {
        statusPdf.style.display = "none";
        console.error(err);
        alert("Nao foi possivel gerar o PDF.");
    }
}

async function enviarWhatsAppPDF() {
    try {
        const blob = await gerarBlobPdfOrcamento();
        const fileName = `orcamento-${orc.numero || orc.id}.pdf`;
        const file = typeof File === "function"
            ? new File([blob], fileName, { type: "application/pdf" })
            : null;
        const telefone = normalizarTelefoneWhats(clienteDados?.telefone) || normalizarTelefoneWhats(clienteDados?.telefone2);
        const msg = `Ola ${clienteDados?.nome || ""}, segue seu orcamento ${orc?.numero || ""}.`;
        const waUrl = telefone
            ? `https://wa.me/${telefone}?text=${encodeURIComponent(msg)}`
            : `https://wa.me/?text=${encodeURIComponent(msg)}`;

        if (
            file &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {
            await navigator.share({
                files: [file],
                title: `Orcamento ${orc?.numero || ""}`,
                text: msg
            });
            return;
        }

        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = fileName;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);

        window.open(waUrl, "_blank");
        alert("PDF baixado. O WhatsApp foi aberto para voce anexar o arquivo.");
    } catch (err) {
        statusPdf.style.display = "none";
        console.error(err);
        alert("Nao foi possivel gerar o PDF para WhatsApp.");
    }
}

    const aprovado = marcarOrcamentoComoAprovado(orc.id);
    if (!aprovado) return;
    alert("Orçamento aprovado");
    location.href = "orcamentos.html";
}

function recusar() {
    const recusado = marcarOrcamentoComoRecusado(orc.id);
    if (!recusado) return;
    alert("Orçamento recusado");
    location.href = "orcamentos.html";
}
