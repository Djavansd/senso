<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Cliente</title>
    <link rel="stylesheet" href="../css/style.css?v=20260629-brasil-mobile" />
    <link rel="stylesheet" href="../css/assistente-senso.css" />
    <link rel="stylesheet" href="../css/assistente-ajuda.css" />
<script src="../js/auth-boot.js?v=20260630"></script>
</head>

<body>

    <div class="app">
        <div class="header">Novo Cliente</div>

        <div class="content">
            <div class="form-card">
                <form id="formCliente">

                    <div class="form-group">
                        <label>Nome *</label>
                        <input id="nome" required maxlength="120" />
                    </div>

                    <div class="form-group">
                        <label>Telefone *</label>
                        <input id="telefone" required maxlength="20" />
                    </div>

                    <div class="form-group">
                        <label>Telefone 2</label>
                        <input id="telefone2" placeholder="Opcional" maxlength="20" />
                    </div>

                    <div class="form-group">
                        <label>Endereço</label>
                        <input id="endereco" placeholder="Opcional" maxlength="180" />
                    </div>

                    <div class="form-group">
                        <label>CPF / CNPJ</label>
                        <input id="documento" placeholder="000.000.000-00 ou 00.000.000/0000-00" maxlength="18" inputmode="numeric" autocomplete="off" />
                    </div>

                    <div class="form-group campo-veiculo">
                        <label>Modelo do carro</label>
                        <input id="modeloCarro" name="modeloCarro" list="sugestoesModeloCarro" placeholder="Opcional" autocomplete="on" maxlength="80" />
                        <datalist id="sugestoesModeloCarro"></datalist>
                    </div>

                    <div class="form-group campo-veiculo">
                        <label>Placa</label>
                        <input id="placaCarro" placeholder="Opcional" maxlength="8" />
                    </div>

                    <div class="form-group campo-veiculo">
                        <label>Cor</label>
                        <input id="corCarro" placeholder="Opcional" maxlength="40" />
                    </div>

                    <div class="form-group campo-veiculo">
                        <label>KM</label>
                        <input id="kmCarro" type="text" inputmode="numeric" placeholder="Opcional" />
                    </div>

                    <p class="privacy-note">
                        Usamos estes dados apenas para atendimento, orçamento, agenda e histórico do cliente.
                        <a href="privacidade.html">Veja a Política de Privacidade.</a>
                    </p>

                    <button class="btn-primary" type="submit">Salvar</button>

                </form>
            </div>
        </div>
    </div>

    <!-- JS GLOBAL -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth-guard.js?v=20260702-leituras1"></script>
    <script src="../js/core/plans.js?v=20260702-leituras1"></script>
    <script src="../js/core/profile.js?v=20260702-negocios2"></script>
    <script src="../js/domains/mecanica/domain.js"></script>
    <script src="../js/app.js?v=20260702-negocio-ativo"></script>
<script src="../js/data-sync-v2.js?v=20260702-leituras1"></script>
    <script src="../js/assistente-senso.js"></script>
    <script src="../js/assistente-ajuda.js"></script>

    <!-- JS DA TELA -->
    <script>
        const form = document.getElementById("formCliente");

        const nome = document.getElementById("nome");
        const telefone = document.getElementById("telefone");
        const telefone2 = document.getElementById("telefone2");
        const endereco = document.getElementById("endereco");
        const documento = document.getElementById("documento");
        const modeloCarro = document.getElementById("modeloCarro");
        const sugestoesModeloCarro = document.getElementById("sugestoesModeloCarro");
        const placaCarro = document.getElementById("placaCarro");
        const corCarro = document.getElementById("corCarro");
        const kmCarro = document.getElementById("kmCarro");
        const camposVeiculo = document.querySelectorAll(".campo-veiculo");
        const clienteEditarId = new URLSearchParams(location.search).get("editar") || "";
        const clienteEmEdicao = clienteEditarId
            ? (getData().clientes || []).find(c => c.id === clienteEditarId && !c.arquivado)
            : null;
        const modoMecanica = window.SensoProfile?.usesVehicleFields?.() === true;

        function aplicarModoFormularioCliente() {
            camposVeiculo.forEach(campo => {
                campo.style.display = modoMecanica ? "" : "none";
            });

            if (!modoMecanica) {
                modeloCarro.value = "";
                placaCarro.value = "";
                corCarro.value = "";
                kmCarro.value = "";
            }
        }

        function normalizarKm(value) {
            const digitos = String(value || "").replace(/\D/g, "");
            if (!digitos) return "";
            return String(Number(digitos));
        }

        function formatarKm(value) {
            const km = normalizarKm(value);
            return km ? Number(km).toLocaleString("pt-BR") : "";
        }

        function formatarDocumentoCliente(value) {
            const digitos = String(value || "").replace(/\D/g, "").slice(0, 14);
            if (!digitos) return "";
            return formatarDocumentoPorTipo(digitos, digitos.length <= 11 ? "cpf" : "cnpj");
        }

        function carregarSugestoesModeloCarro() {
            const modelosUnicos = new Map();

            listarClientesAtivos().forEach(cliente => {
                const modelo = String(cliente.modeloCarro || "").trim();
                if (!modelo) return;

                const chave = modelo.toLocaleLowerCase("pt-BR");
                if (!modelosUnicos.has(chave)) {
                    modelosUnicos.set(chave, modelo);
                }
            });

            const opcoes = Array.from(modelosUnicos.values())
                .sort((a, b) => a.localeCompare(b, "pt-BR"));

            sugestoesModeloCarro.innerHTML = opcoes
                .map(modelo => `<option value="${escapeHtml(modelo)}"></option>`)
                .join("");
        }

        function normalizarPlaca(value) {
            const raw = String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
            if (!raw) return "";

            if (/^[A-Z]{3}[0-9]{4}$/.test(raw)) {
                return `${raw.slice(0, 3)}-${raw.slice(3)}`;
            }

            if (/^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(raw)) {
                return raw;
            }

            return raw;
        }

        function placaValida(value) {
            if (!value) return true;
            return /^[A-Z]{3}-[0-9]{4}$/.test(value) || /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/.test(value);
        }

        function preencherClienteEdicao() {
            if (!clienteEditarId) return;

            if (!clienteEmEdicao) {
                alert("Cliente não encontrado para edição.");
                window.location.replace("clientes.html");
                return;
            }

            document.title = "Editar Cliente";
            document.querySelector(".header").textContent = "Editar Cliente";
            form.querySelector("button[type='submit']").textContent = "Salvar alterações";

            nome.value = clienteEmEdicao.nome || "";
            telefone.value = clienteEmEdicao.telefone || "";
            telefone2.value = clienteEmEdicao.telefone2 || "";
            endereco.value = clienteEmEdicao.endereco || "";
            documento.value = formatarDocumentoCliente(clienteEmEdicao.documento);
            modeloCarro.value = clienteEmEdicao.modeloCarro || "";
            placaCarro.value = clienteEmEdicao.placaCarro || "";
            corCarro.value = clienteEmEdicao.corCarro || "";
            kmCarro.value = formatarKm(clienteEmEdicao.kmCarro);
        }

        aplicarModoFormularioCliente();
        preencherClienteEdicao();
        documento.addEventListener("input", () => {
            documento.value = formatarDocumentoCliente(documento.value);
        });
        if (modoMecanica) {
            carregarSugestoesModeloCarro();
            placaCarro.addEventListener("input", () => {
                placaCarro.value = normalizarPlaca(placaCarro.value);
            });
            kmCarro.addEventListener("input", () => {
                kmCarro.value = formatarKm(kmCarro.value);
            });
        }

        form.onsubmit = function (e) {
            e.preventDefault();

            let nomeSeguro;
            let enderecoSeguro;
            let documentoSeguro;
            let modeloSeguro;
            let corSegura;

            try {
                nomeSeguro = validarTextoUsuario(nome.value, "Nome", 120);
                enderecoSeguro = validarTextoUsuario(endereco.value, "Endereço", 180);
                documentoSeguro = validarTextoUsuario(documento.value, "Documento", 24);
                modeloSeguro = validarTextoUsuario(modeloCarro.value, "Modelo do carro", 80);
                corSegura = validarTextoUsuario(corCarro.value, "Cor", 40);
            } catch (err) {
                alert(err.message || "Texto bloqueado por segurança.");
                return;
            }

            if (!nomeSeguro) {
                alert("Informe o nome do cliente.");
                nome.focus();
                return;
            }

            const telefoneFormatado = formatarTelefoneBR(telefone.value);
            const telefone2Formatado = formatarTelefoneBR(telefone2.value);

            if (telefoneJaExiste(telefoneFormatado, clienteEditarId)) {
                alert("Cliente já cadastrado com esse telefone.");
                return;
            }

            if (telefone2Formatado && telefone2Formatado === telefoneFormatado) {
                alert("O telefone 2 precisa ser diferente do telefone principal.");
                telefone2.focus();
                return;
            }

            if (telefone2Formatado && telefoneJaExiste(telefone2Formatado, clienteEditarId)) {
                alert("Cliente já cadastrado com esse telefone 2.");
                return;
            }

            const placaNormalizada = modoMecanica
                ? normalizarPlaca(placaCarro.value)
                : "";
            const kmNormalizado = modoMecanica
                ? normalizarKm(kmCarro.value)
                : "";
            if (modoMecanica && !placaValida(placaNormalizada)) {
                alert("Placa inválida. Use ABC-1234 ou ABC1D23 (Mercosul).");
                placaCarro.focus();
                return;
            }

            const dadosCliente = {
                nome: nomeSeguro,
                telefone: telefoneFormatado,
                telefone2: telefone2Formatado,
                endereco: enderecoSeguro || "",
                documento: documentoSeguro || "",
                modeloCarro: modoMecanica ? (modeloSeguro || "") : "",
                placaCarro: modoMecanica ? (placaNormalizada || "") : "",
                corCarro: modoMecanica ? (corSegura || "") : "",
                kmCarro: modoMecanica ? (kmNormalizado || "") : ""
            };

            const clienteSalvo = clienteEditarId
                ? atualizarCliente(clienteEditarId, dadosCliente)
                : adicionarCliente({
                    id: gerarId(),
                    ...dadosCliente
                });
            if (!clienteSalvo) return;

            // Envia direto para a tela inicial sem empilhar retornos no histórico.
            window.location.replace(clienteEditarId ? "clientes.html" : "../index.html");
        };
    </script>

</body>

</html>
