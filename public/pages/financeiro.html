<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro</title>

<link rel="stylesheet" href="../css/style.css">

<style>
.hidden{display:none}

.bank-card{
  background:linear-gradient(135deg,#1cb978,#0f9d58);
  color:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}

.bank-saldo{
  font-size:28px;
  font-weight:bold
}

.btn{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer
}

.btn-extrato{
  margin-top:10px;
  background:rgba(0,0,0,.25);
  color:#fff
}

.form-card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}

/* ===== EXTRATO ===== */
.item{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  font-size:13px;
  margin-bottom:6px;
  padding:8px 10px;
  border-radius:8px;
}

.item-left{
  flex:1;
  min-width:0;
}

.item-titulo{
  font-weight:600;
  line-height:1.3;
  word-break:break-word;
}

.item-sub{
  margin-top:3px;
  font-size:12px;
  opacity:.85;
  word-break:break-word;
}

.item-right{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  font-weight:700;
}

/* GANHO */
.item.entrada{
  color:#0f9d58;
  background:#e6f4ea;
  border-left:4px solid #0f9d58;
}

/* GASTO */
.item.saida{
  color:#d93025;
  background:#fdecea;
  border-left:4px solid #d93025;
}
/* BOTÃO GANHO */
.btn-ganho{
  background:#0f9d58;
  color:#fff;
}

/* BOTÃO GASTO */
.btn-gasto{
  background:#d93025;
  color:#fff;
}


.btn-del{
  background:none;
  border:none;
  color:#d93025;
  font-weight:bold;
  cursor:pointer;
  margin-left:6px;
}
</style>
</head>

<body>
<div class="app">
<div class="header">Financeiro</div>
<div class="content">

<div id="modoNormal">

<select id="filtroMes"></select>

<div class="bank-card">
  <small>Saldo do mês</small>
  <div class="bank-saldo" id="saldo">R$ 0,00</div>
  <button class="btn btn-extrato" id="btnExtrato">Extrato</button>
</div>

<!-- LANÇAMENTO MANUAL -->
<div class="form-card">
  <h3>Lançamento manual</h3>
  <input id="valorManual" placeholder="Ex: 100 ou -50">
  <button class="btn" id="btnManual">Salvar</button>
</div>

<!-- NOVO GANHO -->
<div class="form-card">
  <h3>Novo ganho</h3>
  <input id="ganhoDescricao" placeholder="Descrição">
  <input id="ganhoValor" placeholder="Valor">
  <button class="btn btn-ganho" id="btnGanho">
  Adicionar ganho
</button>

</div>

<!-- NOVO GASTO -->
<div class="form-card">
  <h3>Novo gasto</h3>
  <input id="gastoDescricao" placeholder="Descrição">
  <input id="gastoValor" placeholder="Valor">
  <button class="btn btn-gasto" id="btnGasto">
  Adicionar gasto
</button>

</div>

</div>

<div id="modoExtrato" class="hidden">
  <button class="btn" id="btnVoltar">← Voltar</button>
  <div id="listaExtrato"></div>
</div>

</div>
</div>

<script src="../js/app.js"></script>

<script>
const saldoEl = document.getElementById("saldo");
const filtroMes = document.getElementById("filtroMes");
const listaExtrato = document.getElementById("listaExtrato");
const modoNormal = document.getElementById("modoNormal");
const modoExtrato = document.getElementById("modoExtrato");

let mesAtual;

/* MESES */
function carregarMeses(){
  const meses=new Set();
  listarFinanceiroValido().forEach(f=>{
    const d=new Date(f.data);
    meses.add(`${d.getFullYear()}-${d.getMonth()}`);
  });
  if(!meses.size){
    const h=new Date();
    meses.add(`${h.getFullYear()}-${h.getMonth()}`);
  }
  filtroMes.innerHTML="";
  [...meses].sort().reverse().forEach(m=>{
    const [a,me]=m.split("-");
    const opt=document.createElement("option");
    opt.value=m;
    opt.textContent=new Date(a,me).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    filtroMes.appendChild(opt);
  });
  mesAtual=filtroMes.value;
}

/* SALDO */
function calcularSaldo(){
  const [a,m]=mesAtual.split("-").map(Number);
  let saldo=0;
  listarFinanceiroValido().forEach(f=>{
    const d=new Date(f.data);
    if(d.getMonth()===m && d.getFullYear()===a){
      saldo += f.tipo==="saida"? -f.valor : f.valor;
    }
  });
  saldoEl.textContent="R$ "+formatarMoedaBR(saldo);
}

/* LANÇAMENTO MANUAL */
btnManual.onclick=()=>{
  const v=Number(valorManual.value.replace(",",".")); 
  if(!v)return;
  const data=getData();
  data.financeiro.push({
    id:gerarId(),
    tipo:v>0?"entrada":"saida",
    descricao:"Lançamento manual",
    valor:Math.abs(v),
    data:new Date().toISOString()
  });
  saveData(data);
  valorManual.value="";
  renderTudo();
};

/* GANHO */
btnGanho.onclick=()=>{
  const d=ganhoDescricao.value.trim();
  const v=Number(ganhoValor.value.replace(",",".")); 
  if(!d||v<=0)return;

  const data=getData();
  data.financeiro.push({
    id:gerarId(),
    tipo:"entrada",
    descricao:d,
    valor:v,
    data:new Date().toISOString()
  });
  saveData(data);

  ganhoDescricao.value="";
  ganhoValor.value="";
  renderTudo();
};

/* GASTO */
btnGasto.onclick=()=>{
  const d=gastoDescricao.value.trim();
  const v=Number(gastoValor.value.replace(",",".")); 
  if(!d||v<=0)return;

  const data=getData();
  data.financeiro.push({
    id:gerarId(),
    tipo:"saida",
    descricao:d,
    valor:v,
    data:new Date().toISOString()
  });
  saveData(data);

  gastoDescricao.value="";
  gastoValor.value="";
  renderTudo();
};

/* EXTRATO */
btnExtrato.onclick=()=>{
  modoNormal.classList.add("hidden");
  modoExtrato.classList.remove("hidden");
  renderExtrato();
};

btnVoltar.onclick=()=>{
  modoExtrato.classList.add("hidden");
  modoNormal.classList.remove("hidden");
};

function apagarLancamento(id){
  if(!confirm("Apagar este lançamento?"))return;
  const data=getData();
  data.financeiro=data.financeiro.filter(f=>f.id!==id);
  saveData(data);
  renderTudo();
  renderExtrato();
}

function descricaoExtrato(f) {
  if (f?.origem !== "servico" || !f?.origemServicoId) {
    return {
      titulo: f?.descricao || "Sem descricao",
      sub: ""
    };
  }

  const servico = (getData().servicos || []).find(s => s.id === f.origemServicoId);
  if (!servico || !Array.isArray(servico.itens) || !servico.itens.length) {
    return {
      titulo: f?.descricao || "Servico",
      sub: servico?.cliente?.nome || ""
    };
  }

  const descricoes = servico.itens
    .map(i => String(i?.descricao || "").trim())
    .filter(Boolean);

  if (!descricoes.length) {
    return {
      titulo: f?.descricao || "Servico",
      sub: servico?.cliente?.nome || ""
    };
  }

  const contador = new Map();
  descricoes.forEach(d => {
    contador.set(d, (contador.get(d) || 0) + 1);
  });

  const resumoItens = [...contador.entries()]
    .map(([desc, qtd]) => qtd > 1 ? `${desc} (${qtd}x)` : desc)
    .join(" • ");

  return {
    titulo: resumoItens,
    sub: servico?.cliente?.nome || ""
  };
}

function renderExtrato(){
  listaExtrato.innerHTML="";
  const [a,m]=mesAtual.split("-").map(Number);
  listarFinanceiroValido()
    .filter(f=>{
      const d=new Date(f.data);
      return d.getMonth()===m && d.getFullYear()===a;
    })
    .sort((a,b)=>new Date(b.data)-new Date(a.data))
    .forEach(f=>{
      const info = descricaoExtrato(f);
      listaExtrato.innerHTML+=`
        <div class="item ${f.tipo}">
          <div class="item-left">
            <div class="item-titulo">${info.titulo}</div>
            ${info.sub ? `<div class="item-sub">${info.sub}</div>` : ""}
          </div>
          <div class="item-right">
            ${f.tipo==="saida"?"-":"+"} R$ ${formatarMoedaBR(f.valor)}
            <button class="btn-del" onclick="apagarLancamento('${f.id}')">🗑️</button>
          </div>
        </div>`;
    });
}

/* GERAL */
function renderTudo(){carregarMeses();calcularSaldo();}
filtroMes.onchange=()=>{mesAtual=filtroMes.value;renderTudo();}
renderTudo();
</script>
</body>
</html>
