<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro</title>

<link rel="stylesheet" href="../css/style.css?v=20260629-brasil-mobile">
<link rel="stylesheet" href="../css/assistente-senso.css">
<link rel="stylesheet" href="../css/assistente-ajuda.css">

<style>
.hidden{display:none}

.abas{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.aba-btn{
  border:1px solid #d0d7de;
  background:#fff;
  color:#444;
  border-radius:999px;
  padding:8px 12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.aba-btn.ativa{
  background:#0f9d58;
  color:#fff;
  border-color:#0f9d58;
}

.bank-card{
  background:linear-gradient(135deg,#1cb978,#0f9d58);
  color:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}

.bank-saldo{
  font-size:28px;
  font-weight:bold
}

.btn{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer
}

.btn-extrato{
  margin-top:10px;
  background:rgba(0,0,0,.25);
  color:#fff
}

.form-card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px
}

/* ===== EXTRATO ===== */
#modoExtrato {
  padding-bottom: 18px;
}

#modoExtrato > .btn {
  margin-bottom: 16px;
  box-shadow: 0 8px 18px rgba(10,124,255,.16);
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  font-size:14px;
  margin-bottom:14px;
  padding:14px;
  border-radius:14px;
  color:#172033;
  transition:transform .18s ease,box-shadow .18s ease;
}

.item-left{
  flex:1;
  min-width:0;
}

.item-titulo{
  color:#172033;
  font-size:15px;
  font-weight:800;
  line-height:1.3;
  word-break:break-word;
}

.item-sub{
  margin-top:3px;
  font-size:12px;
  color:#52635c;
  word-break:break-word;
}

.item-data{
  margin-top:6px;
  color:#7a8983;
  font-size:11px;
}

.item-right{
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
  font-size:14px;
  font-weight:800;
}

/* GANHO */
.item.entrada{
  background:linear-gradient(145deg,#fff,#ecfdf3);
  border:2px solid #22a85a;
  box-shadow:0 10px 24px rgba(15,23,42,.09),0 4px 14px rgba(34,168,90,.18);
}

.item.entrada .item-right{
  color:#168243;
}

/* GASTO */
.item.saida{
  background:linear-gradient(145deg,#fff,#fff1f1);
  border:2px solid #dc3f3f;
  box-shadow:0 10px 24px rgba(15,23,42,.09),0 4px 14px rgba(220,63,63,.18);
}

.item.saida .item-right{
  color:#bd2929;
}

.item:hover,
.item:focus-within{
  transform:translateY(-1px);
}
/* BOTÃO GANHO */
.btn-ganho{
  background:#0f9d58;
  color:#fff;
}

/* BOTÃO GASTO */
.btn-gasto{
  background:#d93025;
  color:#fff;
}


.btn-del{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(148,163,184,.38);
  border-radius:9px;
  color:#d93025;
  font-weight:bold;
  cursor:pointer;
  margin-left:4px;
}

@media(max-width:420px){
  .item{align-items:flex-start;padding:13px;}
  .item-right{flex-direction:column;align-items:flex-end;gap:6px;}
}

.vazio{
  padding:14px;
  text-align:center;
  color:#666;
  font-size:14px;
}
</style>
<script src="../js/auth-boot.js?v=20260630"></script>
</head>

<body>
<div class="app">
<div class="header">Financeiro</div>
<div class="content">

<div id="modoNormal">

<div class="abas" id="abasPeriodo">
  <button class="aba-btn ativa" data-aba="atual">Mês atual</button>
  <button class="aba-btn" data-aba="fechados">Meses fechados</button>
</div>

<select id="filtroMes"></select>

<div class="bank-card">
  <small>Saldo do mês</small>
  <div class="bank-saldo" id="saldo">R$ 0,00</div>
  <button class="btn btn-extrato" id="btnExtrato">Extrato</button>
</div>

<!-- LANÇAMENTO MANUAL -->
<div class="form-card">
  <h3>Lançamento manual</h3>
  <input id="valorManual" placeholder="Ex: 100 ou -50">
  <button class="btn" id="btnManual">Salvar</button>
</div>

<!-- NOVO GANHO -->
<div class="form-card">
  <h3>Novo ganho</h3>
  <input id="ganhoDescricao" placeholder="Descrição">
  <input id="ganhoValor" placeholder="Valor">
  <button class="btn btn-ganho" id="btnGanho">
  Adicionar ganho
</button>

</div>

<!-- NOVO GASTO -->
<div class="form-card" id="novo-gasto">
  <h3>Novo gasto</h3>
  <input id="gastoDescricao" placeholder="Descrição">
  <input id="gastoValor" placeholder="Valor">
  <button class="btn btn-gasto" id="btnGasto">
  Adicionar gasto
</button>

</div>

</div>

<div id="modoExtrato" class="hidden">
  <button class="btn" id="btnVoltar">← Voltar</button>
  <div id="listaExtrato"></div>
</div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth-guard.js?v=20260702-leituras1"></script>
<script src="../js/core/plans.js?v=20260702-leituras1"></script>
<script src="../js/core/profile.js?v=20260702-negocios2"></script>
<script src="../js/domains/mecanica/domain.js"></script>
<script src="../js/app.js?v=20260702-negocio-ativo"></script>
<script src="../js/data-sync-v2.js?v=20260702-leituras1"></script>
<script src="../js/assistente-senso.js"></script>
<script src="../js/assistente-ajuda.js"></script>

<script>
const saldoEl = document.getElementById("saldo");
const filtroMes = document.getElementById("filtroMes");
const listaExtrato = document.getElementById("listaExtrato");
const modoNormal = document.getElementById("modoNormal");
const modoExtrato = document.getElementById("modoExtrato");
const abasPeriodo = document.getElementById("abasPeriodo");

let mesAtual;
let abaAtiva = "atual";
let assistenteServicoAtivo = new URLSearchParams(location.search).get("servico") || "";
let assistenteDirecionamentoAplicado = false;

function focarNovoGasto() {
  const card = document.getElementById("novo-gasto");
  if (!card) return;
  card.scrollIntoView({behavior:"smooth", block:"center"});
  card.classList.add("senso-assistente-destaque");
  setTimeout(() => gastoDescricao.focus(), 350);
}

function mesmoMesFinanceiro(f, ano, mes){
  if(!f?.data)return false;
  const d = new Date(f.data);
  if(Number.isNaN(d.getTime()))return false;
  return d.getMonth() === mes && d.getFullYear() === ano;
}

function getFinanceiroFiltradoPorAba(data){
  const hoje = new Date();
  const mesHoje = hoje.getMonth();
  const anoHoje = hoje.getFullYear();

  return listarFinanceiroValido(data).filter(f => {
    const d = new Date(f.data);
    if(Number.isNaN(d.getTime()))return false;
    const isMesAtual = d.getMonth() === mesHoje && d.getFullYear() === anoHoje;

    return abaAtiva === "atual"
      ? isMesAtual
      : !isMesAtual;
  });
}

/* MESES */
function carregarMeses(){
  const hoje = new Date();
  const mesHoje = hoje.getMonth();
  const anoHoje = hoje.getFullYear();
  const meses=new Set();
  const data = getData();
  getFinanceiroFiltradoPorAba(data).forEach(f=>{
    const d=new Date(f.data);
    meses.add(`${d.getFullYear()}-${d.getMonth()}`);
  });

  if(!meses.size && abaAtiva==="atual"){
    meses.add(`${anoHoje}-${mesHoje}`);
  }

  filtroMes.innerHTML="";
  [...meses].sort().reverse().forEach(m=>{
    const [a,me]=m.split("-");
    const opt=document.createElement("option");
    opt.value=m;
    opt.textContent=new Date(a,me).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    filtroMes.appendChild(opt);
  });

  if(mesAtual && [...filtroMes.options].some(opt => opt.value === mesAtual)){
    filtroMes.value = mesAtual;
  }

  if(!filtroMes.options.length){
    const opt=document.createElement("option");
    opt.value="";
    opt.textContent="Sem meses fechados";
    filtroMes.appendChild(opt);
    filtroMes.disabled=true;
  }else{
    filtroMes.disabled=false;
  }

  mesAtual=filtroMes.value;
}

/* SALDO */
function calcularSaldo(){
  if(!mesAtual){
    saldoEl.textContent="R$ 0,00";
    return;
  }
  const [a,m]=mesAtual.split("-").map(Number);
  let saldo=0;
  const data = getData();

  getFinanceiroFiltradoPorAba(data).forEach(f=>{
    if(mesmoMesFinanceiro(f, a, m)){
      saldo += f.tipo==="saida"? -f.valor : f.valor;
    }
  });
  saldoEl.textContent="R$ "+formatarMoedaBR(saldo);
}

/* LANÇAMENTO MANUAL */
btnManual.onclick=()=>{
  const v=Number(valorManual.value.replace(",",".")); 
  if(!v)return;
  const data=getData();
  data.financeiro.push({
    id:gerarId(),
    tipo:v>0?"entrada":"saida",
    descricao:"Lançamento manual",
    valor:Math.abs(v),
    data:new Date().toISOString()
  });
  saveData(data);
  valorManual.value="";
  renderTudo();
};

/* GANHO */
btnGanho.onclick=()=>{
  let d;
  try {
    d=validarTextoUsuario(ganhoDescricao.value, "Descrição do ganho", 120);
  } catch (err) {
    alert(err.message || "Texto bloqueado por segurança.");
    return;
  }
  const v=Number(ganhoValor.value.replace(",",".")); 
  if(!d||v<=0)return;

  const data=getData();
  data.financeiro.push({
    id:gerarId(),
    tipo:"entrada",
    descricao:d,
    valor:v,
    data:new Date().toISOString()
  });
  saveData(data);

  ganhoDescricao.value="";
  ganhoValor.value="";
  renderTudo();
};

/* GASTO */
btnGasto.onclick=()=>{
  let d;
  try {
    d=validarTextoUsuario(gastoDescricao.value, "Descrição do gasto", 120);
  } catch (err) {
    alert(err.message || "Texto bloqueado por segurança.");
    return;
  }
  const v=Number(gastoValor.value.replace(",",".")); 
  if(!d||v<=0)return;

  const data=getData();
  data.financeiro.push({
    id:gerarId(),
    tipo:"saida",
    descricao:d,
    valor:v,
    data:new Date().toISOString(),
    ...(assistenteServicoAtivo ? {
      origem:"assistente-servico",
      origemServicoId:assistenteServicoAtivo
    } : {})
  });
  saveData(data);

  if(assistenteServicoAtivo){
    const servicoConcluido = assistenteServicoAtivo;
    assistenteServicoAtivo = "";
    AssistenteSenso.concluirGasto(servicoConcluido);
    AssistenteSenso.abrir({
      imagem:"/assets/assistente-senso/gasto-do-servico.png",
      mensagens:[
        "Perfeito! O gasto foi registrado.",
        "Seu lucro foi atualizado automaticamente."
      ]
    });
  }

  gastoDescricao.value="";
  gastoValor.value="";
  renderTudo();
};

function iniciarAssistenteGastos(){
  const params = new URLSearchParams(location.search);
  if(params.get("assistente") === "gasto"){
    if(!assistenteDirecionamentoAplicado){
      assistenteDirecionamentoAplicado = true;
      focarNovoGasto();
    }
    return;
  }

  const pendencia = AssistenteSenso.listarPendencias()[0];
  if(!pendencia) return;

  const chaveSessao = `senso-assistente-gasto-${pendencia.servicoId}`;
  if(sessionStorage.getItem(chaveSessao)) return;
  sessionStorage.setItem(chaveSessao, "1");

  AssistenteSenso.abrir({
    imagem:"/assets/assistente-senso/gasto-do-servico.png",
    mensagens:[
      "Lembrete rápido.",
      "Você deixou um gasto pendente deste serviço. Deseja registrá-lo agora?"
    ],
    acoes:[
      {
        texto:"Sim",
        estilo:"primaria",
        aoClicar:({fechar})=>{
          assistenteServicoAtivo = pendencia.servicoId;
          fechar("registrar");
          focarNovoGasto();
        }
      },
      {
        texto:"Depois",
        estilo:"sutil",
        aoClicar:({fechar})=>fechar("depois")
      }
    ]
  });
}

/* EXTRATO */
btnExtrato.onclick=()=>{
  modoNormal.classList.add("hidden");
  modoExtrato.classList.remove("hidden");
  renderExtrato();
};

btnVoltar.onclick=()=>{
  modoExtrato.classList.add("hidden");
  modoNormal.classList.remove("hidden");
};

function apagarLancamento(id){
  if(!confirm("Apagar este lançamento?"))return;
  const data=getData();
  data.financeiro=data.financeiro.filter(f=>f.id!==id);
  saveData(data);
  renderTudo();
  renderExtrato();
}

function descricaoExtrato(f) {
  if (f?.origem !== "servico" || !f?.origemServicoId) {
    return {
      titulo: f?.descricao || "Sem descrição",
      sub: ""
    };
  }

  const servico = (getData().servicos || []).find(s => s.id === f.origemServicoId);
  if (!servico || !Array.isArray(servico.itens) || !servico.itens.length) {
    return {
      titulo: f?.descricao || "Serviço",
      sub: servico?.cliente?.nome || ""
    };
  }

  const descricoes = servico.itens
    .map(i => String(i?.descricao || "").trim())
    .filter(Boolean);

  if (!descricoes.length) {
    return {
      titulo: f?.descricao || "Serviço",
      sub: servico?.cliente?.nome || ""
    };
  }

  const contador = new Map();
  descricoes.forEach(d => {
    contador.set(d, (contador.get(d) || 0) + 1);
  });

  const resumoItens = [...contador.entries()]
    .map(([desc, qtd]) => qtd > 1 ? `${desc} (${qtd}x)` : desc)
    .join(" • ");

  return {
    titulo: resumoItens,
    sub: servico?.cliente?.nome || ""
  };
}

function renderExtrato(){
  if(!mesAtual){
    listaExtrato.innerHTML = '<div class="vazio">Sem lançamentos para este período</div>';
    return;
  }
  listaExtrato.innerHTML="";
  const [a,m]=mesAtual.split("-").map(Number);
  const data = getData();

  getFinanceiroFiltradoPorAba(data)
    .filter(f=>mesmoMesFinanceiro(f, a, m))
    .sort((a,b)=>new Date(b.data)-new Date(a.data))
    .forEach(f=>{
      const info = descricaoExtrato(f);
      const dataLancamento = new Date(f.data);
      const dataTexto = Number.isNaN(dataLancamento.getTime())
        ? "Data não informada"
        : dataLancamento.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" });
      listaExtrato.innerHTML+=`
        <div class="item ${f.tipo}">
          <div class="item-left">
            <div class="item-titulo">${escapeHtml(info.titulo)}</div>
            ${info.sub ? `<div class="item-sub">${escapeHtml(info.sub)}</div>` : ""}
            <div class="item-data">${escapeHtml(dataTexto)}</div>
          </div>
          <div class="item-right">
            ${f.tipo==="saida"?"-":"+"} R$ ${formatarMoedaBR(f.valor)}
            <button class="btn-del" onclick="apagarLancamento('${escapeHtml(f.id)}')">🗑️</button>
          </div>
        </div>`;
    });

  if(!listaExtrato.innerHTML.trim()){
    listaExtrato.innerHTML = '<div class="vazio">Sem lançamentos para este período</div>';
  }
}

/* GERAL */
function renderTudo(){carregarMeses();calcularSaldo();}
filtroMes.onchange=()=>{mesAtual=filtroMes.value;calcularSaldo();}
abasPeriodo.onclick=(event)=>{
  const btn = event.target.closest(".aba-btn");
  if(!btn)return;
  abaAtiva = btn.dataset.aba || "atual";
  abasPeriodo.querySelectorAll(".aba-btn").forEach(el =>
    el.classList.toggle("ativa", el===btn)
  );
  renderTudo();
  if(!modoExtrato.classList.contains("hidden")){
    renderExtrato();
  }
}
window.addEventListener("senso-live-update", () => {
  renderTudo();
  iniciarAssistenteGastos();
  if(!modoExtrato.classList.contains("hidden")){
    renderExtrato();
  }
});
renderTudo();
iniciarAssistenteGastos();
</script>
</body>
</html>
