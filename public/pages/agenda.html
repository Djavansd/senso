<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Agenda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css?v=20260629-brasil-mobile" />
  <link rel="stylesheet" href="../css/assistente-senso.css" />
  <link rel="stylesheet" href="../css/assistente-ajuda.css" />

  <style>
    .agenda-filtros {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .agenda-filtros select {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    .agenda-card {
      --agenda-accent: #1686e8;
      --agenda-shadow: rgba(22, 134, 232, .18);
      background: linear-gradient(145deg, #fff, #f8fbff);
      border: 2px solid var(--agenda-accent);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow:
        0 10px 24px rgba(15, 23, 42, .10),
        0 4px 14px var(--agenda-shadow),
        inset 0 1px 0 rgba(255,255,255,.92);
      font-size: 14px;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .agenda-card.futuro { --agenda-accent: #16a34a; --agenda-shadow: rgba(22,163,74,.20); background:linear-gradient(145deg,#fff,#f0fdf4); }
    .agenda-card.hoje { --agenda-accent: #eab308; --agenda-shadow: rgba(234,179,8,.28); background:linear-gradient(145deg,#fff,#fef9c3); }
    .agenda-card.atrasado { --agenda-accent: #dc2626; --agenda-shadow: rgba(220,38,38,.30); background:linear-gradient(145deg,#fff,#fee2e2); }
    .agenda-card:hover,
    .agenda-card:focus-within {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(15,23,42,.13), 0 6px 18px var(--agenda-shadow);
    }

    .agenda-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agenda-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-whats {
      background: #25d366;
      border-radius: 8px;
      padding: 6px 8px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
    }

    .btn-arquivar {
      background: #e0e0e0;
      border-radius: 8px;
      padding: 6px 8px;
      border: none;
      cursor: pointer;
    }

    .agenda-row strong,
    .agenda-card .agenda-ultimo-nome {
      color: #172033;
    }

    .btn-editar,
    .btn-salvar-edicao,
    .btn-cancelar-edicao {
      border-radius: 8px;
      padding: 6px 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-editar {
      background: #e3f2fd;
      color: #0d47a1;
    }

    .btn-salvar-edicao {
      background: #0f9d58;
      color: #fff;
    }

    .btn-cancelar-edicao {
      background: #eeeeee;
      color: #444;
    }

    .btn-ver {
      background: none;
      border: none;
      color: #1976d2;
      font-size: 13px;
      cursor: pointer;
    }

    .agenda-detalhes {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 13px;
      display: none;
    }

    .agenda-ultimo-servico {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #dbeafe;
      border-radius: 10px;
      background: rgba(239, 246, 255, .82);
    }

    .agenda-ultimo-titulo {
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .agenda-ultimo-nome {
      margin-top: 4px;
      color: #172033;
      font-weight: 750;
    }

    .agenda-ultimo-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
      color: #52635c;
      font-size: 12px;
    }

    .agenda-btn-historico {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #0a7cff;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }

    .agenda-historico-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, .48);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .agenda-historico-conteudo {
      width: min(520px, 100%);
      max-height: 82vh;
      overflow: auto;
      padding: 16px;
      border: 2px solid #1686e8;
      border-radius: 18px 18px 12px 12px;
      background: linear-gradient(145deg, rgba(255,255,255,.99), rgba(239,248,255,.98));
      box-shadow:
        0 24px 55px rgba(15, 23, 42, .30),
        0 8px 24px rgba(22, 134, 232, .28),
        inset 0 1px 0 rgba(255,255,255,.95);
    }

    .agenda-historico-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .agenda-historico-topo h3 { margin: 0; color: #0a4ea9; }
    .agenda-historico-fechar { border: 1px solid #bfdbfe; border-radius: 999px; width: 34px; height: 34px; color:#0a4ea9; background:#eff6ff; cursor: pointer; }
    .agenda-historico-item { margin-top: 10px; padding: 12px; border: 1px solid #cfe4f8; border-radius: 10px; background: rgba(255,255,255,.88); box-shadow: 0 5px 14px rgba(22,134,232,.08); }
    .agenda-historico-item strong { color: #0a4ea9; }
    .agenda-historico-item ul { margin: 7px 0; padding-left: 18px; }
    .agenda-historico-observacao { color: #52635c; font-style: italic; }

    .agenda-edicao {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .agenda-edicao input {
      flex: 1;
      min-width: 150px;
      padding: 7px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
    }

    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: bold;
      margin-left: 6px;
    }

    .badge.atrasado {
      background: #dc2626;
      color: #fff;
    }

    .badge.hoje {
      background: #facc15;
      color: #422006;
    }

    .badge.futuro {
      background: #16a34a;
      color: #fff;
    }
  </style>
<script src="../js/auth-boot.js?v=20260630"></script>
</head>

<body>

  <div class="app">
    <div class="header">Agenda • Retornos</div>

    <div class="content">

      <div class="agenda-filtros">
        <select id="filtroMes">
          <option value="">Todos os meses</option>
        </select>
      </div>

      <div id="listaAgenda"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-guard.js?v=20260702-leituras1"></script>
  <script src="../js/core/plans.js?v=20260702-leituras1"></script>
  <script src="../js/core/profile.js?v=20260702-negocios2"></script>
  <script src="../js/domains/mecanica/domain.js"></script>
  <script src="../js/app.js?v=20260706-sync-unica"></script>
  <script src="../js/assistente-senso.js"></script>
  <script src="../js/assistente-ajuda.js"></script>

  <script>
    const listaAgenda = document.getElementById("listaAgenda");
    const filtroMes = document.getElementById("filtroMes");

    function normalizarData(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function statusPorData(dataRetorno) {
      const hoje = normalizarData(new Date());
      const r = normalizarData(dataRetorno);
      if (r < hoje) return "atrasado";
      if (r.getTime() === hoje.getTime()) return "hoje";
      return "futuro";
    }

    function formatarData(d) {
      const x = new Date(d);
      return isNaN(x) ? "—" : x.toLocaleDateString("pt-BR");
    }

    function formatarDataInput(d) {
      const x = new Date(d);
      if (isNaN(x)) return "";
      const ano = x.getFullYear();
      const mes = String(x.getMonth() + 1).padStart(2, "0");
      const dia = String(x.getDate()).padStart(2, "0");
      return `${ano}-${mes}-${dia}`;
    }

    function criarDataRetorno(novaData, dataAtual) {
      const base = new Date(dataAtual || new Date());
      const [ano, mes, dia] = String(novaData || "").split("-").map(Number);
      if (!ano || !mes || !dia) return null;
      base.setFullYear(ano, mes - 1, dia);
      return base.toISOString();
    }

    function retornoNoMes(dataRetorno, ano, mes) {
      const d = new Date(dataRetorno);
      if (isNaN(d)) return false;
      return d.getFullYear() === ano && d.getMonth() === mes;
    }

    function atualizarFiltroMes() {
      const selecionado = filtroMes.value;
      filtroMes.innerHTML = '<option value="">Todos os meses</option>';
      popularFiltroMesUmaVez();
      const existeSelecionado = Array.from(filtroMes.options).some(opt => opt.value === selecionado);
      filtroMes.value = existeSelecionado ? selecionado : "";
    }

    function popularFiltroMesUmaVez() {
      const data = getData();
      const meses = new Set();

      (data.agenda || []).forEach(a => {
        if (!a.dataRetorno || a.status !== "agendado") return;
        const d = new Date(a.dataRetorno);
        meses.add(`${d.getFullYear()}-${d.getMonth()}`);
      });

      [...meses].sort().forEach(m => {
        const [ano, mes] = m.split("-");
        const label = new Date(ano, mes).toLocaleDateString("pt-BR", {
          month: "long",
          year: "numeric"
        });

        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = label;
        filtroMes.appendChild(opt);
      });
    }

    function arquivar(id) {
      if (!confirm("Arquivar este retorno?")) return;
      const data = getData();
      const item = data.agenda.find(a => a.id === id);
      if (item) {
        item.status = "arquivado";
        saveData(data);
        renderAgenda();
      }
    }

    function remarcarRetorno(id, novaData) {
      const data = getData();
      const item = (data.agenda || []).find(a => a.id === id);
      if (!item) {
        alert("Retorno nao encontrado.");
        return false;
      }

      const novaDataIso = criarDataRetorno(novaData, item.dataRetorno);
      if (!novaDataIso) {
        alert("Informe uma nova data para o retorno.");
        return false;
      }

      item.dataRetorno = novaDataIso;
      item.atualizadoEm = new Date().toISOString();
      saveData(data);
      atualizarFiltroMes();
      renderAgenda();
      return true;
    }

    function gerarMensagemWhats(cliente, dataRetorno) {
      const dataFmt = formatarData(dataRetorno);
      return encodeURIComponent(
        `Olá ${cliente.nome}! 👋\n` +
        `Passando para lembrar da manutenção agendada para o dia ${dataFmt}.\n` +
        `Caso queira confirmar ou reagendar, é só me avisar.\n\n` +
        `Atenciosamente.`
      );
    }

    function dataServicoTimestamp(servico) {
      const date = new Date(servico?.executadoEm || servico?.criadoEm || 0);
      return Number.isFinite(date.getTime()) ? date.getTime() : 0;
    }

    function obterHistoricoCliente(cliente, dataRef) {
      const clienteId = String(cliente?.id || "");
      const nome = String(cliente?.nome || "").trim().toLocaleLowerCase("pt-BR");
      return (dataRef.servicos || [])
        .filter(servico => {
          if (servico?.status !== "executado") return false;
          const servicoClienteId = String(servico?.cliente?.id || servico?.clienteId || "");
          if (clienteId && servicoClienteId) return clienteId === servicoClienteId;
          return nome && String(servico?.cliente?.nome || "").trim().toLocaleLowerCase("pt-BR") === nome;
        })
        .sort((a, b) => dataServicoTimestamp(b) - dataServicoTimestamp(a));
    }

    function obterUltimoServicoCliente(cliente, dataRef) {
      return obterHistoricoCliente(cliente, dataRef)[0] || null;
    }

    function abrirHistoricoAgenda(cliente, dataRef) {
      const historico = obterHistoricoCliente(cliente, dataRef);
      const modal = document.createElement("div");
      modal.className = "agenda-historico-modal";
      const historyHtml = historico.length
        ? historico.map(servico => {
            const itens = Array.isArray(servico.itens) ? servico.itens : [];
            const itensHtml = itens
              .map(item => String(item?.descricao || item?.nome || "").trim())
              .filter(Boolean)
              .map(item => `<li>${escapeHtml(item)}</li>`)
              .join("");
            return `
              <div class="agenda-historico-item">
                <strong>${escapeHtml(formatarData(servico.executadoEm || servico.criadoEm))}</strong>
                <div>R$ ${escapeHtml(formatarMoedaBR(servico.totalGeral || 0))}</div>
                ${itensHtml ? `<ul>${itensHtml}</ul>` : ""}
                ${servico.observacoes ? `<div class="agenda-historico-observacao">${escapeHtml(servico.observacoes)}</div>` : ""}
              </div>`;
          }).join("")
        : "<p>Nenhum atendimento realizado encontrado.</p>";

      modal.innerHTML = `
        <div class="agenda-historico-conteudo" role="dialog" aria-modal="true" aria-labelledby="agendaHistoricoTitulo">
          <div class="agenda-historico-topo">
            <div><h3 id="agendaHistoricoTitulo">Histórico de atendimentos</h3><small>${escapeHtml(cliente?.nome || "Cliente")}</small></div>
            <button class="agenda-historico-fechar" type="button" aria-label="Fechar histórico">×</button>
          </div>
          ${historyHtml}
        </div>`;

      const fechar = () => modal.remove();
      modal.querySelector(".agenda-historico-fechar").onclick = fechar;
      modal.onclick = event => { if (event.target === modal) fechar(); };
      document.body.appendChild(modal);
    }

    function renderUltimoServicoAgenda(cliente, dataRef) {
      const ultimo = obterUltimoServicoCliente(cliente, dataRef);
      if (!ultimo) return `
        <div class="agenda-ultimo-servico">
          <div class="agenda-ultimo-titulo">Último atendimento</div>
          <div class="agenda-ultimo-meta">Nenhum atendimento realizado encontrado.</div>
        </div>`;

      const itens = Array.isArray(ultimo.itens) ? ultimo.itens : [];
      const titulo = String(itens[0]?.descricao || itens[0]?.nome || "Atendimento realizado");
      return `
        <div class="agenda-ultimo-servico">
          <div class="agenda-ultimo-titulo">Último atendimento</div>
          <div class="agenda-ultimo-nome">${escapeHtml(titulo)}</div>
          <div class="agenda-ultimo-meta">
            <span>${escapeHtml(formatarData(ultimo.executadoEm || ultimo.criadoEm))}</span>
            <span>R$ ${escapeHtml(formatarMoedaBR(ultimo.totalGeral || 0))}</span>
          </div>
          <button class="agenda-btn-historico" type="button">Ver histórico completo</button>
        </div>`;
    }

    function renderAgenda() {
      const data = getData();
      let agenda = (data.agenda || []).filter(a => a.status === "agendado");

      if (filtroMes.value) {
        const [ano, mes] = filtroMes.value.split("-").map(Number);
        agenda = agenda.filter(a => retornoNoMes(a.dataRetorno, ano, mes));
      }

      agenda.sort((a, b) => new Date(a.dataRetorno) - new Date(b.dataRetorno));

      listaAgenda.innerHTML = "";

      if (!agenda.length) {
        listaAgenda.innerHTML = "<p>Nenhum retorno para este período</p>";
        return;
      }

      agenda.forEach(a => {
        const c = a.cliente || {};
        const telefone = (c.telefone || "").replace(/\D/g, "");
        const status = statusPorData(a.dataRetorno);
        const msg = gerarMensagemWhats(c, a.dataRetorno);
        const ultimoServicoHtml = renderUltimoServicoAgenda(c, data);

        const card = document.createElement("div");
        card.className = `agenda-card ${status}`;

        card.innerHTML = `
        <div class="agenda-row">
          <div>
            <strong>${escapeHtml(c.nome)}</strong>
            <span class="badge ${status}">${status.toUpperCase()}</span><br>
            <small>🔁 ${formatarData(a.dataRetorno)}</small>
          </div>

          <div class="agenda-actions">
            <a class="btn-whats"
               href="https://wa.me/55${telefone}?text=${msg}"
               target="_blank">📲</a>
            <button class="btn-editar">Editar</button>
            <button class="btn-arquivar" onclick="arquivar('${escapeHtml(a.id)}')">📁</button>
            <button class="btn-ver">Ver</button>
          </div>
        </div>

        ${ultimoServicoHtml}

        <div class="agenda-edicao">
          <input class="input-data-retorno" type="date" value="${escapeHtml(formatarDataInput(a.dataRetorno))}">
          <button class="btn-salvar-edicao">Salvar</button>
          <button class="btn-cancelar-edicao">Cancelar</button>
        </div>

        <div class="agenda-detalhes">
          📞 ${escapeHtml(c.telefone || "—")}<br>
          📍 ${escapeHtml(c.endereco || "—")}<br>
          📄 ${escapeHtml(formatarDocumentoBR(c.documento) || "—")}<br>
          💼 Valor: R$ ${
  formatarMoedaBR(
    a.valorServico ??
    (getData().servicos.find(s => s.id === a.origemServicoId)?.totalGeral || 0)
  )
}<br>

          🗓 Executado em: ${formatarData(a.dataExecucao)}
        </div>
      `;

        const btnVer = card.querySelector(".btn-ver");
        const btnHistorico = card.querySelector(".agenda-btn-historico");
        const btnEditar = card.querySelector(".btn-editar");
        const btnSalvarEdicao = card.querySelector(".btn-salvar-edicao");
        const btnCancelarEdicao = card.querySelector(".btn-cancelar-edicao");
        const inputDataRetorno = card.querySelector(".input-data-retorno");
        const detalhes = card.querySelector(".agenda-detalhes");
        const edicao = card.querySelector(".agenda-edicao");

        btnVer.onclick = () => {
          const aberto = detalhes.style.display === "block";
          detalhes.style.display = aberto ? "none" : "block";
          btnVer.textContent = aberto ? "Ver" : "Fechar";
        };

        if (btnHistorico) {
          btnHistorico.onclick = () => abrirHistoricoAgenda(c, getData());
        }

        btnEditar.onclick = () => {
          const aberto = edicao.style.display === "flex";
          edicao.style.display = aberto ? "none" : "flex";
          if (!aberto) {
            inputDataRetorno.value = formatarDataInput(a.dataRetorno);
            inputDataRetorno.focus();
          }
        };

        btnCancelarEdicao.onclick = () => {
          edicao.style.display = "none";
          inputDataRetorno.value = formatarDataInput(a.dataRetorno);
        };

        btnSalvarEdicao.onclick = () => {
          remarcarRetorno(a.id, inputDataRetorno.value);
        };

        listaAgenda.appendChild(card);
      });
    }

    popularFiltroMesUmaVez();
    filtroMes.onchange = renderAgenda;
    window.addEventListener("senso-live-update", () => {
      renderAgenda();
    });
    renderAgenda();
  </script>

</body>
</html>
