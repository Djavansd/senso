<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Manutenção</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f9d58">

    <style>
        body {
            background:
                radial-gradient(circle at 14% 12%, rgba(14,165,233,.26), transparent 40%),
                radial-gradient(circle at 84% 20%, rgba(45,212,191,.22), transparent 44%),
                linear-gradient(165deg, #e8f5ff 0%, #ecfeff 46%, #f8fafc 100%);
        }

        .app { background: transparent; }

        /* ===== MENU ===== */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            display: none;
            z-index: 998;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -260px;
            width: 260px;
            height: 100%;
            background: rgba(255,255,255,.82);
            box-shadow: 10px 0 26px rgba(15,23,42,.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 16px;
            transition: left .3s ease;
            z-index: 999;
        }

        .side-menu.open { left: 0; }

        .menu-link {
            display: block;
            padding: 10px 8px;
            font-size: 15px;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
        }
        .menu-link.destaque {
            background: #fff8e1;
            color: #b45309;
            font-weight: 700;
            border: 1px solid #facc15;
        }
        .menu-link.destaque::after {
            content: " NOVO";
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            background: #f59e0b;
            border-radius: 999px;
            padding: 2px 6px;
            margin-left: 6px;
            vertical-align: middle;
        }

        .menu-link.active {
            background: #e8f5e9;
            color: #0f9d58;
            font-weight: bold;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(15,118,110,.84) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,.3);
        }

        .btn-menu {
            position: absolute;
            left: 12px;
            font-size: 22px;
            cursor: pointer;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 14px;
        }

        .card {
            --card-accent: #3b82f6;
            --card-border: rgba(59,130,246,.34);
            --card-ring: rgba(59,130,246,.20);
            --card-title-color: #1d4ed8;
            --card-value-color: #1e3a8a;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(145deg, rgba(255,255,255,.75), rgba(255,255,255,.43));
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 14px 24px rgba(15,23,42,.10), 0 0 0 1px var(--card-ring);
            text-decoration: none;
            color: #000;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 34%);
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card:hover,
        .card:focus-visible {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 20px 34px rgba(15,23,42,.16), 0 0 0 1px var(--card-ring);
            border-color: var(--card-accent);
        }

        .card:active {
            transform: translateY(0) scale(.99);
        }

        .card-icon { font-size: 36px; margin-bottom: 6px; filter: saturate(1.1); }
        .card-title { font-size: 15px; font-weight: bold; color: var(--card-title-color); }
        .card-value { margin-top: 6px; font-size: 15px; font-weight: bold; color: var(--card-value-color); }
        .card-desc { font-size: 13px; color: #666; margin-top: 4px; }

        .card-extra {
            margin-top: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #f57c00;
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                transition: none;
            }
        }

        /* cores suaves */
        .clientes {
            --card-accent: #2563eb;
            --card-border: rgba(37,99,235,.34);
            --card-ring: rgba(37,99,235,.20);
            --card-title-color: #1d4ed8;
            --card-value-color: #1e3a8a;
            background: linear-gradient(145deg, rgba(141,179,235,.54), rgba(255,255,255,.35));
        }
        .servico {
            --card-accent: #6b8e23;
            --card-border: rgba(107,142,35,.34);
            --card-ring: rgba(107,142,35,.20);
            --card-title-color: #3f6212;
            --card-value-color: #365314;
            background: linear-gradient(145deg, rgba(225,236,150,.54), rgba(255,255,255,.35));
        }
        .orcamentos {
            --card-accent: #15803d;
            --card-border: rgba(21,128,61,.34);
            --card-ring: rgba(21,128,61,.20);
            --card-title-color: #166534;
            --card-value-color: #14532d;
            background: linear-gradient(145deg, rgba(171,226,177,.52), rgba(255,255,255,.35));
        }
        .agenda {
            --card-accent: #7c3aed;
            --card-border: rgba(124,58,237,.34);
            --card-ring: rgba(124,58,237,.20);
            --card-title-color: #6d28d9;
            --card-value-color: #5b21b6;
            background: linear-gradient(145deg, rgba(212,197,238,.55), rgba(255,255,255,.35));
        }
        .financeiro {
            --card-accent: #b45309;
            --card-border: rgba(180,83,9,.34);
            --card-ring: rgba(180,83,9,.20);
            --card-title-color: #92400e;
            --card-value-color: #78350f;
            background: linear-gradient(145deg, rgba(245,209,139,.56), rgba(255,255,255,.35));
        }
        .resumo {
            --card-accent: #be185d;
            --card-border: rgba(190,24,93,.34);
            --card-ring: rgba(190,24,93,.20);
            --card-title-color: #9d174d;
            --card-value-color: #831843;
            background: linear-gradient(145deg, rgba(245,191,216,.56), rgba(255,255,255,.35));
        }
    </style>
</head>
<body>

<div class="menu-overlay" id="menuOverlay"></div>

<div class="side-menu" id="sideMenu">
    <a class="menu-link" href="index.html">🏠 Início</a>
    <a class="menu-link" href="pages/clientes.html">👤 Clientes</a>
    <a class="menu-link" href="pages/servico.html">🛠️ Serviços</a>
    <a class="menu-link" href="pages/orcamentos.html">📄 Orçamentos</a>
    <a class="menu-link" href="pages/agenda.html">📅 Agenda</a>
    <a class="menu-link" href="pages/financeiro.html">💰 Financeiro</a>
    <a class="menu-link" href="pages/resumo.html">📊 Resumo mensal</a>
    <a class="menu-link" href="pages/configuracoes.html">⚙️ Configuracoes</a>
    <a class="menu-link destaque" href="pages/nossos-servicos.html">🚀 Nossos serviços</a>

</div>

<div class="app">
    <div class="header">
        <span class="btn-menu" id="btnMenu">☰</span>
        Início
    </div>

    <div class="dashboard">

        <a href="pages/clientes.html" class="card clientes">
            <div class="card-icon">👤</div>
            <div class="card-title">Clientes</div>
            <div class="card-value" id="totalClientes">0</div>
            <div class="card-desc">Ativos</div></a>

        <a href="pages/servico.html" class="card servico">
            <div class="card-icon">🛠️</div>
            <div class="card-title">Serviços</div>
            <div class="card-value" id="servicosPendentes">0</div>
            <div class="card-desc">Pendentes</div></a>

        <a href="pages/orcamentos.html" class="card orcamentos">
            <div class="card-icon">📄</div>
            <div class="card-title">Orçamentos</div>
            <div class="card-value" id="totalOrcamentos">0</div>
            <div class="card-desc">Gerados</div>
            <div class="card-extra" id="orcPendentes"></div></a>

        <a href="pages/agenda.html" class="card agenda">
            <div class="card-icon">📅</div>
            <div class="card-title">Agenda</div>
            <div class="card-value" id="proximoRetorno">—</div>
            <div class="card-desc">Próximo retorno</div></a>

        <a href="pages/financeiro.html" class="card financeiro">
            <div class="card-icon">💰</div>
            <div class="card-title">Financeiro</div>
            <div class="card-value" id="saldoMes">R$ 0,00</div>
            <div class="card-desc">Saldo do mês</div></a>

        <a href="pages/resumo.html" class="card resumo">
            <div class="card-icon">📊</div>
            <div class="card-title">Resumo mensal</div>
            <div class="card-desc">Fechamento</div></a>

    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/core/profile.js"></script>
<script src="js/domains/mecanica/domain.js"></script>
<script src="js/app.js"></script>

<script>
function renderHomeDashboard() {
    const data = getData();

    document.getElementById("totalClientes").textContent =
        data.clientes.filter(c => !c.arquivado).length;

    document.getElementById("servicosPendentes").textContent =
        data.servicos.filter(s => s.status === "pendente").length;

    const totalOrc = data.orcamentos.length;
    const pendentes = data.orcamentos.filter(o => o.status === "enviado").length;
    document.getElementById("totalOrcamentos").textContent = totalOrc;
    document.getElementById("orcPendentes").textContent =
        pendentes > 0 ? `🔔 ${pendentes} pendente(s)` : "";

    const agora = new Date();
    let saldo = 0;
    listarFinanceiroValido(data).forEach(f => {
        const d = new Date(f.data);
        if (d.getMonth() === agora.getMonth() &&
            d.getFullYear() === agora.getFullYear()) {
            saldo += (f.tipo === "saida" ? -f.valor : f.valor);
        }
    });
    document.getElementById("saldoMes").textContent =
        "R$ " + formatarMoedaBR(saldo);
}

function renderProximoRetorno() {
    const data = getData();
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    const proximos = (data.agenda || [])
        .filter(a =>
            a.status === "agendado" &&
            a.dataRetorno &&
            new Date(a.dataRetorno) >= hoje
        )
        .sort((a, b) => new Date(a.dataRetorno) - new Date(b.dataRetorno));

    const proximoEl = document.getElementById("proximoRetorno");
    if (!proximoEl) return;

    if (proximos.length) {
        const p = proximos[0];
        const dataFmt = new Date(p.dataRetorno).toLocaleDateString("pt-BR");
        proximoEl.textContent = dataFmt;
        return;
    }

    proximoEl.textContent = "—";
}

window.addEventListener("senso-live-update", () => {
    renderHomeDashboard();
    renderProximoRetorno();
});

renderHomeDashboard();
renderProximoRetorno();
</script>

</body>

</html>
<script>
const btnMenu = document.getElementById("btnMenu");
const sideMenu = document.getElementById("sideMenu");
const overlay = document.getElementById("menuOverlay");

btnMenu.onclick = () => {
    sideMenu.classList.add("open");
    overlay.style.display = "block";
};

overlay.onclick = () => {
    sideMenu.classList.remove("open");
    overlay.style.display = "none";
};
</script>
